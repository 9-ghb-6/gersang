<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>천하제일거상: 비주얼 & 이펙트 극대화 에디션</title>
    <style>
        :root {
            --wood-dark: #180f08;
            --wood-mid: #321f11;
            --wood-border: #7a542e;
            --gold-trim: #facc15;
            --hanji-bg: #efe2c6;
            --hanji-card: #fbf4e4;
            --ink-dark: #22140a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background-color: #0b0704;
            color: #f6ecd7;
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            overflow-x: hidden;
        }

        .serif {
            font-family: "Batang", "AppleMyungjo", Georgia, serif;
            letter-spacing: -0.02em;
        }

        .app-root {
            width: 100%;
            max-width: 470px;
            min-height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #2b1a0e 0%, #140b06 100%);
            border-left: 2px solid #6b4725;
            border-right: 2px solid #6b4725;
            transition: max-width 0.25s ease;
        }

        .app-root.landscape-mode {
            max-width: 1020px;
        }

        /* 상단 원목 상태바 */
        .top-bar {
            background: linear-gradient(180deg, #3a2313 0%, #1d1109 100%);
            border-bottom: 2px solid #8a6035;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 10;
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            flex-wrap: wrap;
        }

        .badge-title {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 900;
            font-size: 13px;
            color: #fde047;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .crest-icon {
            width: 22px;
            height: 22px;
            border-radius: 5px;
            background: linear-gradient(135deg, #fde047, #b45309);
            color: #1c1008;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            border: 1px solid #fef9c3;
            box-shadow: 0 0 8px rgba(250,204,21,0.5);
        }

        .mini-btn {
            background: #24150b;
            border: 1px solid #855e36;
            color: #f5ebd6;
            border-radius: 6px;
            padding: 4px 7px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }

        .mini-btn.active-gold {
            background: linear-gradient(180deg, #facc15, #a16207);
            border-color: #fef08a;
            color: #140c06;
            font-weight: 900;
        }

        .mini-btn.sound-on {
            border-color: #4ade80;
            color: #86efac;
        }

        .resource-strip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #120b06;
            border: 1px solid #5e3f21;
            border-radius: 7px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 800;
            gap: 5px;
            flex-wrap: wrap;
        }

        /* 2.5D 캔버스 뷰포트 */
        .viewport-wrap {
            position: relative;
            width: 100%;
            height: 270px;
            background: #1b2416;
            border-bottom: 2px solid #8a6035;
            overflow: hidden;
            flex-shrink: 0;
        }

        .app-root.landscape-mode .viewport-wrap {
            height: 325px;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .hud-top-left {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(18, 10, 5, 0.86);
            border: 1px solid #a87b46;
            border-radius: 8px;
            padding: 4px 8px;
            pointer-events: none;
            max-width: 66%;
            box-shadow: 0 3px 10px rgba(0,0,0,0.6);
        }

        .hud-scene-title {
            font-size: 12px;
            font-weight: 900;
            color: #fde047;
        }

        .hud-sub-msg {
            font-size: 10px;
            color: #a7f3d0;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hud-top-right {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 5;
        }

        .float-action-btn {
            border-radius: 7px;
            padding: 6px 9px;
            font-size: 11px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .btn-gold {
            background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%);
            border: 1.5px solid #fef08a;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }

        .btn-crimson {
            background: linear-gradient(180deg, #dc2626 0%, #7f1d1d 100%);
            border: 1.5px solid #fecaca;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }

        .btn-azure {
            background: linear-gradient(180deg, #0284c7 0%, #1e3a8a 100%);
            border: 1.5px solid #bae6fd;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }

        .btn-wood {
            background: linear-gradient(180deg, #472d18 0%, #26160b 100%);
            border: 1px solid #a17846;
            color: #fef3c7;
        }

        .btn-hanji {
            background: linear-gradient(180deg, #fcf6e8 0%, #dcc69b 100%);
            border: 1.5px solid #593b20;
            color: #22140a;
            font-weight: 900;
        }

        button:active {
            transform: scale(0.95);
        }

        /* 전투 하단 필살기 바 */
        .battle-skill-bar {
            position: absolute;
            bottom: 6px;
            left: 6px;
            right: 6px;
            background: rgba(16, 9, 5, 0.92);
            border: 1.5px solid #a87b46;
            border-radius: 9px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 6;
            box-shadow: 0 4px 14px rgba(0,0,0,0.75);
        }

        .skill-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        .skill-btn {
            position: relative;
            border-radius: 6px;
            padding: 5px 2px;
            text-align: center;
            cursor: pointer;
            overflow: hidden;
        }

        .skill-cd-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.84);
            color: #fde047;
            font-weight: 900;
            font-size: 11px;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* 하단 한지 UI 덱 */
        .bottom-deck {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 6px;
            gap: 6px;
            background: #22140a;
        }

        .tab-nav {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
        }

        .tab-btn {
            background: linear-gradient(180deg, #4e331c 0%, #2a1a0d 100%);
            border: 1.5px solid #855e36;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            color: #e6d5b8;
            font-size: 11px;
            font-weight: 800;
            padding: 7px 2px;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            background: linear-gradient(180deg, #f7eedb 0%, #e3d1ab 100%);
            border-color: #4a311c;
            color: #22140a;
            font-weight: 900;
        }

        .hanji-panel {
            flex: 1;
            background-color: var(--hanji-bg);
            background-image: linear-gradient(180deg, #f6ecd6 0%, #e1cfa9 100%);
            border: 2px solid #4a311c;
            border-radius: 0 0 12px 12px;
            padding: 8px;
            color: var(--ink-dark);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hanji-box {
            background: linear-gradient(180deg, #fcf6e8 0%, #ebd9b7 100%);
            border: 1.5px solid #7c5832;
            border-radius: 9px;
            padding: 7px;
        }

        /* 부대 카드 스트립 */
        .squad-strip {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .hero-card {
            background: linear-gradient(180deg, #382212 0%, #1b0f07 100%);
            border: 2px solid #78522d;
            border-radius: 10px;
            padding: 5px;
            color: #f6ecd7;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .hero-card.selected {
            border-color: #fde047;
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.7);
        }

        .portrait-box {
            position: relative;
            width: 100%;
            height: 78px;
            border-radius: 7px;
            overflow: hidden;
            border: 1.5px solid #b8894c;
            background: #140d08;
        }

        .stage-pill {
            position: absolute;
            top: 2px;
            left: 2px;
            background: rgba(0, 0, 0, 0.82);
            color: #fde047;
            font-size: 9px;
            font-weight: 900;
            padding: 1px 4px;
            border-radius: 4px;
            border: 0.5px solid #ca8a04;
        }

        .ult-pill {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: linear-gradient(180deg, #dc2626, #7f1d1d);
            color: #fef08a;
            font-size: 8.5px;
            font-weight: 900;
            padding: 1px 5px;
            border-radius: 4px;
            border: 1px solid #fde047;
            box-shadow: 0 0 6px rgba(239,68,68,0.9);
        }

        .bar-track {
            width: 100%;
            height: 5px;
            background: #0f0905;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 2px;
        }

        .bar-hp {
            height: 100%;
            background: linear-gradient(90deg, #dc2626, #f87171);
        }

        .bar-mp {
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #38bdf8);
        }

        /* 4단계 진화 로드맵 */
        .evo-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .evo-node {
            background: #e3d2b0;
            border: 1.5px solid #9e825c;
            border-radius: 7px;
            padding: 4px 2px;
            text-align: center;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .evo-node.current {
            background: #362010;
            border-color: #fde047;
            color: #fef08a;
            font-weight: 900;
            box-shadow: 0 0 8px rgba(250,204,21,0.45);
        }

        /* 장비 그리드 */
        .gear-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .gear-slot {
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            border: 2px solid #5c3e21;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px;
            cursor: pointer;
            color: #ffffff;
        }

        .gear-slot.selected {
            border-color: #fde047;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.85);
        }

        .bg-UR  { background: radial-gradient(circle, #991b1b 0%, #3b0764 100%); }
        .bg-SSR { background: radial-gradient(circle, #b45309 0%, #451a03 100%); }
        .bg-SR  { background: radial-gradient(circle, #1d4ed8 0%, #172554 100%); }
        .bg-R   { background: radial-gradient(circle, #15803d 0%, #052e16 100%); }

        /* 모달 */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            display: none;
            pointer-events: none;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .modal-backdrop.open {
            display: flex;
            pointer-events: auto;
        }

        .modal-card {
            width: 100%;
            max-width: 440px;
            max-height: 88vh;
            overflow-y: auto;
            background: linear-gradient(180deg, #332012 0%, #190f08 100%);
            border: 2.5px solid #fde047;
            border-radius: 16px;
            padding: 14px;
            color: #f6ecd7;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.96);
        }

        .gacha-result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin: 10px 0;
        }

        @media (min-width: 420px) {
            .gacha-result-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .gacha-card {
            border-radius: 8px;
            border: 1.5px solid #fde047;
            padding: 5px 3px;
            text-align: center;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #toast-container {
            position: fixed;
            top: 64px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: max-content;
            max-width: 92vw;
        }

        .toast-item {
            background: rgba(24, 14, 7, 0.96);
            border: 1.5px solid #fde047;
            color: #fef9c3;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            text-align: center;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div id="appRoot" class="app-root">
        <!-- 1. 상단 원목 컨트롤 바 -->
        <header class="top-bar">
            <div class="top-row">
                <div class="badge-title">
                    <span class="crest-icon">巨</span>
                    <span class="serif">천하제일거상</span>
                    <button type="button" id="btnSoundToggle" data-action="toggle-sound" class="mini-btn sound-on">🔊 효과음</button>
                </div>

                <div style="display:flex; gap:4px; align-items:center;">
                    <button type="button" id="btnPortrait" data-action="set-layout" data-val="portrait" class="mini-btn active-gold">📱세로</button>
                    <button type="button" id="btnLandscape" data-action="set-layout" data-val="landscape" class="mini-btn">📲가로</button>
                    <button type="button" id="btnSpeed" data-action="cycle-speed" class="mini-btn active-gold">⚡1x</button>
                </div>
            </div>

            <div class="resource-strip">
                <span>📍<strong id="uiCity" style="color:#fde047;">한양</strong></span>
                <span>⚔️<strong id="uiPower" style="color:#fca5a5;">0</strong></span>
                <span>💰<strong id="uiMoney" style="color:#fde047;">50,000</strong></span>
                <span>📜<strong id="uiScrolls" style="color:#fef08a;">30</strong></span>
                <span>🔮<strong id="uiSoul" style="color:#67e8f9;">600</strong></span>
                <span>🔨<strong id="uiForge" style="color:#fb923c;">200</strong></span>
                <span>🎟️<strong id="uiSeals" style="color:#f0abfc;">30</strong></span>
            </div>
        </header>

        <!-- 2. 고밀도 2.5D 월드 & 전장 캔버스 -->
        <section class="viewport-wrap">
            <canvas id="gameCanvas"></canvas>

            <div class="hud-top-left">
                <div id="hudSceneTitle" class="hud-scene-title">⚔️ 원경 2.5D 전장 · 백두산 호랑이 출몰지</div>
                <div id="hudSubMsg" class="hud-sub-msg">필살기 버튼이나 초상화를 터치하면 초호화 궁극기가 폭발합니다!</div>
            </div>

            <div class="hud-top-right">
                <button type="button" data-action="skill-showcase" class="float-action-btn btn-azure">🎬 필살기 연출</button>
                <button type="button" id="btnSceneSwitch" data-action="toggle-scene" class="float-action-btn btn-gold">🏘️ 마을로 이동</button>
                <button type="button" data-action="spawn-boss" class="float-action-btn btn-crimson">🐉 대보스 소환</button>
                <button type="button" data-action="rest-inn" class="float-action-btn btn-wood">🍚 주막 회복</button>
            </div>

            <!-- 전투 중 4대 초호화 필살기 바 -->
            <div id="battleSkillBar" class="battle-skill-bar">
                <div class="skill-grid">
                    <button type="button" data-action="cast-skill" data-val="1" class="skill-btn btn-hanji">
                        <div id="cd1" class="skill-cd-overlay">0.0s</div>
                        <div style="font-size:10px; color:#0369a1;">🐉 청룡 칼바람</div>
                        <div style="font-size:8px; color:#5c3e21;">도력 20</div>
                    </button>
                    <button type="button" data-action="cast-skill" data-val="2" class="skill-btn btn-hanji">
                        <div id="cd2" class="skill-cd-overlay">0.0s</div>
                        <div style="font-size:10px; color:#15803d;">🪷 연꽃 회춘진</div>
                        <div style="font-size:8px; color:#5c3e21;">도력 25</div>
                    </button>
                    <button type="button" data-action="cast-skill" data-val="3" class="skill-btn btn-hanji">
                        <div id="cd3" class="skill-cd-overlay">0.0s</div>
                        <div style="font-size:10px; color:#7e22ce;">⚡ 사천왕 뇌전</div>
                        <div style="font-size:8px; color:#5c3e21;">도력 40</div>
                    </button>
                    <button type="button" data-action="cast-skill" data-val="4" class="skill-btn btn-gold">
                        <div id="cd4" class="skill-cd-overlay">0.0s</div>
                        <div style="font-size:10px;">🚢 거북선 출격</div>
                        <div style="font-size:8px; color:#fef9c3;">도력 60</div>
                    </button>
                </div>
                <div style="display:flex; align-items:center; gap:6px; font-size:10px; font-weight:800;">
                    <span style="color:#60a5fa;">💧도력</span>
                    <div style="flex:1; height:6px; background:#0f172a; border-radius:4px; overflow:hidden; border:1px solid #334155;">
                        <div id="hudMpBar" style="width:100%; height:100%; background:linear-gradient(90deg,#2563eb,#38bdf8);"></div>
                    </div>
                    <span id="hudMpVal" style="color:#93c5fd;">100</span>
                    <span style="color:#fde047;">| 난이도:</span>
                    <select id="diffSelect" style="background:#24150b; color:#fde047; border:1px solid #855e36; border-radius:4px; font-size:10px; font-weight:800; padding:1px 3px;">
                        <option value="easy">쉬움</option>
                        <option value="normal" selected>보통</option>
                        <option value="hard">어려움</option>
                        <option value="hell">지옥</option>
                        <option value="nightmare">악몽</option>
                        <option value="inferno">불지옥</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- 3. 하단 한지 & 원목 컨트롤 덱 -->
        <section class="bottom-deck">
            <nav class="tab-nav">
                <button type="button" id="tab-squad" data-action="switch-tab" data-val="squad" class="tab-btn active">부대·전직</button>
                <button type="button" id="tab-gacha" data-action="switch-tab" data-val="gacha" class="tab-btn">등용·소환</button>
                <button type="button" id="tab-gear" data-action="switch-tab" data-val="gear" class="tab-btn">장비·대장간</button>
                <button type="button" id="tab-trade" data-action="switch-tab" data-val="trade" class="tab-btn">동아시아교역</button>
                <button type="button" id="tab-codex" data-action="switch-tab" data-val="codex" class="tab-btn">도감·저장</button>
            </nav>

            <div id="hanjiPanel" class="hanji-panel"></div>
        </section>
    </div>

    <!-- 시네마틱 가챠 / 전직 결과 모달 -->
    <div id="resultModal" class="modal-backdrop" data-action="close-modal-backdrop">
        <div class="modal-card" id="resultModalCard">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #6e4b2a; padding-bottom:8px; margin-bottom:8px;">
                <h3 id="modalTitle" class="serif" style="font-size:16px; font-weight:900; color:#fde047;">✨ 소환 결과</h3>
                <button type="button" data-action="close-modal" class="float-action-btn btn-crimson" style="padding:5px 12px;">✕ 닫기</button>
            </div>
            <div id="modalBody"></div>
            <div style="margin-top:10px; display:flex; gap:8px;">
                <button type="button" id="modalExtraBtn" data-action="gacha-again" class="float-action-btn btn-gold" style="flex:1; padding:10px; font-size:13px;">🌟 다시 10연속 소환</button>
                <button type="button" data-action="close-modal" class="float-action-btn btn-hanji" style="flex:1; padding:10px; font-size:13px;">확인 완료</button>
            </div>

        class SoundEngine {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            unlock() {
                try {
                    if (!this.ctx) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) this.ctx = new AudioCtx();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                } catch (e) {}
            }

            toggle() {
                this.enabled = !this.enabled;
                if (this.enabled) {
                    this.unlock();
                    this.click();
                }
                const btn = document.getElementById('btnSoundToggle');
                if (btn) {
                    btn.textContent = this.enabled ? '🔊 효과음' : '🔇 음소거';
                    btn.className = this.enabled ? 'mini-btn sound-on' : 'mini-btn';
                }
            }

            tone(freq, dur, type = 'triangle', vol = 0.16, delay = 0, slideTo = null) {
                if (!this.enabled) return;
                try {
                    this.unlock();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime + delay;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, now);
                    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + dur);
                } catch (e) {}
            }

            noise(dur, vol = 0.15, delay = 0) {
                if (!this.enabled) return;
                try {
                    this.unlock();
                    if (!this.ctx) return;
                    const sr = this.ctx.sampleRate;
                    const len = Math.floor(sr * dur);
                    const buf = this.ctx.createBuffer(1, len, sr);
                    const data = buf.getChannelData(0);
                    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
                    const src = this.ctx.createBufferSource();
                    src.buffer = buf;
                    const gain = this.ctx.createGain();
                    const now = this.ctx.currentTime + delay;
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
                    src.connect(gain);
                    gain.connect(this.ctx.destination);
                    src.start(now);
                } catch (e) {}
            }

            click() { this.tone(640, 0.06, 'triangle', 0.14, 0, 320); }
            coin()  { this.tone(1046, 0.08, 'sine', 0.15, 0); this.tone(1396, 0.16, 'sine', 0.16, 0.06); }

                    });
                }
            }

        /**
         * ============================================================================
         * 4. 동양화풍 정밀 일러스트 초상화 엔진 (오프스크린 캐시 + 다층 명암/세밀화)
         * ============================================================================
         */
        class HighCraftPortraitEngine {
            constructor() {
                this.cache = new Map();
            }

            getPortraitCanvas(spec) {
                if (this.cache.has(spec.unitKey)) {
                    return this.cache.get(spec.unitKey);
                }
                const off = document.createElement('canvas');
                off.width = 160;
                off.height = 160;
                this.renderCharacterPortrait(off, spec);
                this.cache.set(spec.unitKey, off);
                return off;
            }

            paintTo(targetCanvas, spec) {
                if (!targetCanvas) return;
                const src = this.getPortraitCanvas(spec);
                const ctx = targetCanvas.getContext('2d');
                ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
                ctx.drawImage(src, 0, 0, targetCanvas.width, targetCanvas.height);
            }

            getSkinPalette(skinType) {
                switch (skinType) {
                    case 'crimson_guanyu':
                        return { light: '#e07a5f', mid: '#b84a39', shadow: '#7f261d', cheek: 'rgba(220,38,38,0.35)' };
                    case 'pale':
                        return { light: '#fff3e6', mid: '#f3d2b3', shadow: '#cfa07a', cheek: 'rgba(244,114,182,0.22)' };
                    case 'celestial_gold':
                        return { light: '#fef08a', mid: '#f59e0b', shadow: '#92400e', cheek: 'rgba(253,224,71,0.4)' };
                    case 'celestial_blue':
                        return { light: '#e0f2fe', mid: '#93c5fd', shadow: '#1e40af', cheek: 'rgba(56,189,248,0.35)' };
                    case 'warm':
                        return { light: '#fde2c4', mid: '#eab689', shadow: '#b57b4e', cheek: 'rgba(239,68,68,0.18)' };
                    case 'warrior':
                    default:
                        return { light: '#f5c79e', mid: '#d69766', shadow: '#8c552d', cheek: 'rgba(185,28,28,0.2)' };
                }
            }

            renderCharacterPortrait(canvas, spec) {
                const ctx = canvas.getContext('2d');
                const w = canvas.width;
                const h = canvas.height;
                const cx = w * 0.5;
                const cy = h * 0.52;

                ctx.save();

                // 1. 고풍스러운 배경 풍경 & 등급별 수묵/금박 그라데이션
                const bg = ctx.createRadialGradient(cx, cy * 0.85, 8, cx, cy, w * 0.78);
                if (spec.stage === 3) {
                    bg.addColorStop(0, '#fef08a');
                    bg.addColorStop(0.38, '#b91c1c');
                    bg.addColorStop(0.75, '#4c1d95');
                    bg.addColorStop(1, '#12081d');
                } else if (spec.stage === 2) {
                    bg.addColorStop(0, '#fde68a');
                    bg.addColorStop(0.45, '#b45309');
                    bg.addColorStop(1, '#291205');
                } else if (spec.stage === 1) {
                    bg.addColorStop(0, '#bae6fd');
                    bg.addColorStop(0.45, '#1e3a8a');
                    bg.addColorStop(1, '#0f172a');
                } else {
                    bg.addColorStop(0, '#cbd5e1');
                    bg.addColorStop(0.5, '#475569');
                    bg.addColorStop(1, '#1e293b');
                }
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, w, h);

                // 한지 질감 미세 선 & 산수화 능선 실루엣
                ctx.fillStyle = 'rgba(15, 10, 5, 0.28)';
                ctx.beginPath();
                ctx.moveTo(0, h * 0.65);
                ctx.lineTo(w * 0.28, h * 0.44);
                ctx.lineTo(w * 0.55, h * 0.58);
                ctx.lineTo(w * 0.82, h * 0.40);
                ctx.lineTo(w, h * 0.56);
                ctx.lineTo(w, h);
                ctx.lineTo(0, h);
                ctx.closePath();
                ctx.fill();

                // 3차 각성 / 2차 개조 후광 만다라 & 불꽃 오라
                if (spec.stage >= 2) {
                    ctx.save();
                    ctx.translate(cx, cy * 0.86);
                    const haloGrad = ctx.createRadialGradient(0, 0, 14, 0, 0, 56);
                    haloGrad.addColorStop(0, 'rgba(254, 249, 195, 0.9)');
                    haloGrad.addColorStop(0.55, 'rgba(250, 204, 21, 0.35)');
                    haloGrad.addColorStop(1, 'rgba(250, 204, 21, 0)');
                    ctx.fillStyle = haloGrad;
                    ctx.beginPath();
                    ctx.arc(0, 0, 56, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = spec.stage === 3 ? '#fef08a' : '#f59e0b';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, 44, 0, Math.PI * 2);
                    ctx.stroke();

                    if (spec.stage === 3) {
                        for (let i = 0; i < 12; i++) {
                            const ang = (Math.PI * 2 * i) / 12;
                            ctx.beginPath();
                            ctx.moveTo(Math.cos(ang) * 44, Math.sin(ang) * 44);
                            ctx.lineTo(Math.cos(ang) * 53, Math.sin(ang) * 53);
                            ctx.stroke();
                        }
                    }
                    ctx.restore();
                }

                // 등 뒤 무기 실루엣 (청룡언월도 / 장검 / 각궁 / 두루마리)
                ctx.save();
                if (spec.weapon === 'spear' || spec.weapon === 'sword') {
                    const bladeGrad = ctx.createLinearGradient(w * 0.72, h * 0.08, w * 0.88, h * 0.55);
                    bladeGrad.addColorStop(0, '#f8fafc');
                    bladeGrad.addColorStop(0.5, '#cbd5e1');
                    bladeGrad.addColorStop(1, '#475569');
                    ctx.fillStyle = bladeGrad;
                    ctx.strokeStyle = '#140c06';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(w * 0.84, h * 0.08);
                    ctx.quadraticCurveTo(w * 0.92, h * 0.25, w * 0.80, h * 0.45);
                    ctx.lineTo(w * 0.75, h * 0.42);
                    ctx.quadraticCurveTo(w * 0.82, h * 0.25, w * 0.84, h * 0.08);
                    ctx.fill();
                    ctx.stroke();
                } else if (spec.weapon === 'bow') {
                    ctx.strokeStyle = '#78350f';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(w * 0.85, h * 0.35, 34, Math.PI * 0.65, Math.PI * 1.35);
                    ctx.stroke();
                }
                ctx.restore();

                // 2. 풍성한 머리카락 뒷단
                ctx.fillStyle = spec.beard === 'long_white' ? '#e2e8f0' : '#140e0a';
                ctx.beginPath();
                ctx.ellipse(cx, cy + 4, 34, 42, 0, 0, Math.PI * 2);
                ctx.fill();

                // 3. 상체 갑옷 & 의복 (다층 음영 + 금박 깃 + 용비늘/두정갑 디테일)
                const coatGrad = ctx.createLinearGradient(cx - 50, h * 0.62, cx + 50, h);
                coatGrad.addColorStop(0, spec.coat);
                coatGrad.addColorStop(0.5, spec.coat);
                coatGrad.addColorStop(1, '#0f0905');

                ctx.fillStyle = coatGrad;
                ctx.strokeStyle = '#140c06';
                ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.moveTo(w * 0.06, h);
                ctx.quadraticCurveTo(w * 0.14, h * 0.66, cx, h * 0.66);
                ctx.quadraticCurveTo(w * 0.86, h * 0.66, w * 0.94, h);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 겹깃 (Y자 전통 한복/갑옷 깃)
                ctx.fillStyle = spec.trim;
                ctx.beginPath();
                ctx.moveTo(cx - 18, h * 0.67);
                ctx.lineTo(cx, h * 0.88);
                ctx.lineTo(cx + 18, h * 0.67);
                ctx.lineTo(cx + 11, h * 0.67);
                ctx.lineTo(cx, h * 0.80);
                ctx.lineTo(cx - 11, h * 0.67);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 갑옷 두정갑 징(금속 리벳) & 흉갑 문양
                if (spec.hat !== 'scholar_gat' && spec.hat !== 'zhuge_hat' && !spec.female) {
                    ctx.fillStyle = '#fde047';
                    for (let r = 0; r < 2; r++) {
                        for (let c = -2; c <= 2; c++) {
                            ctx.beginPath();
                            ctx.arc(cx + c * 14, h * 0.86 + r * 11, 2.1, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                    // 화려한 용머리/황금 견갑
                    [-1, 1].forEach(dir => {
                        const px = cx + dir * 44;
                        const py = h * 0.78;
                        const pGrad = ctx.createRadialGradient(px - dir * 4, py - 4, 2, px, py, 22);
                        pGrad.addColorStop(0, '#fef08a');
                        pGrad.addColorStop(0.55, spec.trim);
                        pGrad.addColorStop(1, '#451a03');
                        ctx.fillStyle = pGrad;
                        ctx.beginPath();
                        ctx.ellipse(px, py, 20, 14, dir * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    });
                }

                // 4. 목 & 턱선 입체 얼굴 (입체 피부 쉐이딩)
                const pal = this.getSkinPalette(spec.skin);

                // 목 그림자
                ctx.fillStyle = pal.shadow;
                ctx.fillRect(cx - 11, cy + 16, 22, 20);

                // 얼굴 윤곽 (광대와 날렵한 턱선)
                const faceGrad = ctx.createRadialGradient(cx - 6, cy - 8, 4, cx, cy, 34);
                faceGrad.addColorStop(0, pal.light);
                faceGrad.addColorStop(0.68, pal.mid);
                faceGrad.addColorStop(1, pal.shadow);

                ctx.fillStyle = faceGrad;
                ctx.strokeStyle = '#1f1108';
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.moveTo(cx - 24, cy - 12);
                ctx.quadraticCurveTo(cx - 26, cy + 12, cx - 14, cy + 25);
                ctx.quadraticCurveTo(cx, cy + 33, cx + 14, cy + 25);
                ctx.quadraticCurveTo(cx + 26, cy + 12, cx + 24, cy - 12);
                ctx.quadraticCurveTo(cx, cy - 28, cx - 24, cy - 12);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 볼 홍조 / 무장 혈색
                ctx.fillStyle = pal.cheek;
                ctx.beginPath();
                ctx.ellipse(cx - 13, cy + 5, 6, 4, 0, 0, Math.PI * 2);
                ctx.ellipse(cx + 13, cy + 5, 6, 4, 0, 0, Math.PI * 2);
                ctx.fill();

                // 귀
                [-1, 1].forEach(dir => {
                    ctx.fillStyle = pal.mid;
                    ctx.beginPath();
                    ctx.ellipse(cx + dir * 24, cy + 2, 4.5, 8, dir * 0.15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                });

                // 5. 사실적인 이목구비 (눈썹, 흰자/동공/캐치라이트, 콧날, 입술, 흉터, 3안)
                // 검처럼 치켜올라간 눈썹
                ctx.strokeStyle = spec.beard === 'long_white' ? '#cbd5e1' : '#140c06';
                ctx.lineWidth = spec.female ? 2.0 : 3.2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(cx - 18, cy - 6);
                ctx.quadraticCurveTo(cx - 10, cy - 10, cx - 4, cy - 5);
                ctx.moveTo(cx + 18, cy - 6);
                ctx.quadraticCurveTo(cx + 10, cy - 10, cx + 4, cy - 5);
                ctx.stroke();

                // 미간 주름 (장수 카리스마)
                if (!spec.female) {
                    ctx.strokeStyle = pal.shadow;
                    ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    ctx.moveTo(cx - 2, cy - 7); ctx.lineTo(cx - 2, cy - 2);
                    ctx.moveTo(cx + 2, cy - 7); ctx.lineTo(cx + 2, cy - 2);
                    ctx.stroke();
                }

                // 닌자 복면 분기
                if (spec.hat === 'ninja_mask') {
                    ctx.fillStyle = '#1e1b4b';
                    ctx.beginPath();
                    ctx.moveTo(cx - 23, cy + 2);
                    ctx.lineTo(cx + 23, cy + 2);
                    ctx.lineTo(cx + 15, cy + 26);
                    ctx.lineTo(cx, cy + 32);
                    ctx.lineTo(cx - 15, cy + 26);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }

                // 눈 (흰자위 + 홍채 + 동공 + 하이라이트)
                [-1, 1].forEach(dir => {
                    const ex = cx + dir * 10.5;
                    const ey = cy - 1.5;

                    // 흰자위
                    ctx.fillStyle = spec.stage === 3 ? '#fef9c3' : '#ffffff';
                    ctx.beginPath();
                    ctx.ellipse(ex, ey, 5.2, spec.female ? 3.8 : 3.1, dir * -0.1, 0, Math.PI * 2);
                    ctx.fill();

                    // 눈꺼풀 아이라인
                    ctx.strokeStyle = '#140c06';
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(ex - 6, ey + 0.5);
                    ctx.quadraticCurveTo(ex, ey - 4.2, ex + 6, ey - 0.5);
                    ctx.stroke();

                    // 홍채 & 동공
                    ctx.fillStyle = spec.stage === 3 ? '#dc2626' : '#1c1917';
                    ctx.beginPath();
                    ctx.arc(ex, ey, 2.4, 0, Math.PI * 2);
                    ctx.fill();

                    // 눈동자 하이라이트
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(ex - 0.8, ey - 0.8, 0.9, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 3차 각성 천왕/신수 이마 신안(第3의 눈)
                if (spec.stage === 3) {
                    ctx.fillStyle = '#fde047';
                    ctx.beginPath();
                    ctx.ellipse(cx, cy - 12, 2.2, 4.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (spec.hat !== 'ninja_mask') {
                    // 콧날 하이라이트 & 코끝 음영
                    ctx.strokeStyle = pal.light;
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - 3);
                    ctx.lineTo(cx - 1, cy + 7);
                    ctx.stroke();

                    ctx.strokeStyle = pal.shadow;
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(cx - 3.5, cy + 8.5);
                    ctx.quadraticCurveTo(cx, cy + 10.5, cx + 3.5, cy + 8.5);
                    ctx.stroke();

                    // 입술
                    ctx.fillStyle = spec.female ? '#e11d48' : '#7c2d12';
                    ctx.beginPath();
                    ctx.ellipse(cx, cy + 16, spec.female ? 5.5 : 6.5, spec.female ? 2.4 : 1.8, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // 흉터 (여포/치우 등)
                    if (spec.scar) {
                        ctx.strokeStyle = '#991b1b';
                        ctx.lineWidth = 1.8;
                        ctx.beginPath();
                        ctx.moveTo(cx + 8, cy - 7);
                        ctx.lineTo(cx + 15, cy + 8);
                        ctx.stroke();
                    }

                    // 수염 렌더링 (관우 오장수염, 이순신 풍성한 수염, 제갈량/허준 염소수염 등)
                    const beardColor = (spec.beard === 'long_white' || spec.beard === 'divine') ? '#f1f5f9' : '#140e0a';
                    ctx.fillStyle = beardColor;
                    ctx.strokeStyle = '#0f0905';
                    ctx.lineWidth = 1.5;

                    if (spec.beard === 'guanyu') {
                        // 관우의 가슴까지 내려오는 장수염
                        ctx.beginPath();
                        ctx.moveTo(cx - 12, cy + 13);
                        ctx.quadraticCurveTo(cx, cy + 11, cx + 12, cy + 13);
                        ctx.quadraticCurveTo(cx + 16, cy + 48, cx, cy + 68);
                        ctx.quadraticCurveTo(cx - 16, cy + 48, cx - 12, cy + 13);
                        ctx.fill();
                        ctx.stroke();
                    } else if (spec.beard === 'full' || spec.beard === 'divine' || spec.beard === 'long_white') {
                        // 이순신·광개토태왕·사천왕의 위엄 있는 턱수염 + 콧수염
                        ctx.beginPath();
                        ctx.moveTo(cx - 16, cy + 10);
                        ctx.quadraticCurveTo(cx - 19, cy + 32, cx, cy + 44);
                        ctx.quadraticCurveTo(cx + 19, cy + 32, cx + 16, cy + 10);
                        ctx.quadraticCurveTo(cx, cy + 19, cx - 16, cy + 10);
                        ctx.fill();
                        ctx.stroke();
                    } else if (spec.beard === 'goatee') {
                        // 허준·제갈량의 단정한 콧수염 + 턱수염
                        ctx.beginPath();
                        ctx.moveTo(cx - 11, cy + 13);
                        ctx.quadraticCurveTo(cx, cy + 11, cx + 11, cy + 13);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(cx - 4, cy + 21);
                        ctx.lineTo(cx, cy + 37);
                        ctx.lineTo(cx + 4, cy + 21);
                        ctx.closePath();
                        ctx.fill();
                    } else if (spec.beard === 'mustache') {
                        ctx.lineWidth = 2.4;
                        ctx.beginPath();
                        ctx.moveTo(cx - 13, cy + 14);
                        ctx.quadraticCurveTo(cx, cy + 10, cx + 13, cy + 14);
                        ctx.stroke();
                    }
                }

                // 6. 국가·등급별 정교한 투구 / 관모 / 보관 일러스트
                this.drawHeadgear(ctx, cx, cy, spec);

                // 외곽 테두리
                ctx.strokeStyle = spec.stage === 3 ? '#fde047' : '#78522d';
                ctx.lineWidth = 3;
                ctx.strokeRect(1.5, 1.5, w - 3, h - 3);

                ctx.restore();
            }

            drawHeadgear(ctx, cx, cy, spec) {
                ctx.save();
                ctx.strokeStyle = '#140c06';
                ctx.lineWidth = 2;

                switch (spec.hat) {
                    case 'joseon_gen':
                    case 'ming_gen': {
                        // 장수 투구 (금속 그라데이션 + 붉은 상모 깃털 + 용문양 이마가리개)
                        const hGrad = ctx.createLinearGradient(cx - 28, cy - 42, cx + 28, cy - 12);
                        hGrad.addColorStop(0, '#fef08a');
                        hGrad.addColorStop(0.5, '#b45309');
                        hGrad.addColorStop(1, '#451a03');
                        ctx.fillStyle = hGrad;
                        ctx.beginPath();
                        ctx.arc(cx, cy - 14, 27, Math.PI, 0);
                        ctx.fill();
                        ctx.stroke();

                        // 이마 금테
                        ctx.fillStyle = '#fde047';
                        ctx.fillRect(cx - 28, cy - 18, 56, 6);
                        ctx.strokeRect(cx - 28, cy - 18, 56, 6);

                        // 투구 꼭대기 붉은 상모 술
                        ctx.fillStyle = '#dc2626';
                        ctx.beginPath();
                        ctx.moveTo(cx, cy - 42);
                        ctx.quadraticCurveTo(cx - 12, cy - 58, cx - 18, cy - 36);
                        ctx.quadraticCurveTo(cx, cy - 45, cx + 18, cy - 36);
                        ctx.quadraticCurveTo(cx + 12, cy - 58, cx, cy - 42);
                        ctx.fill();
                        ctx.stroke();
                        break;
                    }
                    case 'deva_crown':
                    case 'king_crown': {
                        // 사천왕 & 광개토태왕 황금 보석 보관
                        const cGrad = ctx.createLinearGradient(cx - 30, cy - 52, cx + 30, cy - 12);
                        cGrad.addColorStop(0, '#fef9c3');
                        cGrad.addColorStop(0.5, '#eab308');
                        cGrad.addColorStop(1, '#92400e');
                        ctx.fillStyle = cGrad;
                        ctx.beginPath();
                        ctx.moveTo(cx - 28, cy - 14);
                        ctx.lineTo(cx - 22, cy - 38);
                        ctx.lineTo(cx - 10, cy - 26);
                        ctx.lineTo(cx, cy - 50);
                        ctx.lineTo(cx + 10, cy - 26);
                        ctx.lineTo(cx + 22, cy - 38);
                        ctx.lineTo(cx + 28, cy - 14);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();

                        // 중앙 적보석
                        ctx.fillStyle = '#ef4444';
                        ctx.beginPath();
                        ctx.arc(cx, cy - 23, 4.5, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    }
                    case 'phoenix_crown':
                    case 'hairpin': {
                        // 초선·주작·마조의 봉황 금비녀 & 화려한 화관
                        ctx.fillStyle = '#facc15';
                        ctx.beginPath();
                        ctx.arc(cx, cy - 24, 14, Math.PI, 0);
                        ctx.fill();
                        ctx.stroke();
                        [-1, 1].forEach(dir => {
                            ctx.beginPath();
                            ctx.moveTo(cx + dir * 10, cy - 22);
                            ctx.lineTo(cx + dir * 32, cy - 34);
                            ctx.stroke();
                            ctx.fillStyle = '#f43f5e';
                            ctx.beginPath();
                            ctx.arc(cx + dir * 32, cy - 34, 4, 0, Math.PI * 2);
                            ctx.fill();
                        });
                        break;
                    }
                    case 'kabuto':
                    case 'kabuto_horns': {
                        // 일본 전국시대 투구 + 초승달 황금 뿔(쿠와가타)
                        ctx.fillStyle = '#1e293b';
                        ctx.beginPath();
                        ctx.arc(cx, cy - 14, 27, Math.PI, 0);
                        ctx.fill();
                        ctx.stroke();

                        if (spec.hat === 'kabuto_horns') {
                            ctx.fillStyle = '#facc15';
                            ctx.beginPath();
                            ctx.moveTo(cx, cy - 22);
                            ctx.quadraticCurveTo(cx - 26, cy - 30, cx - 22, cy - 52);
                            ctx.quadraticCurveTo(cx - 12, cy - 32, cx, cy - 27);
                            ctx.quadraticCurveTo(cx + 12, cy - 32, cx + 22, cy - 52);
                            ctx.quadraticCurveTo(cx + 26, cy - 30, cx, cy - 22);
                            ctx.fill();
                            ctx.stroke();
                        }
                        break;
                    }
                    case 'scholar_gat': {
                        // 허준의 조선 전통 갓
                        ctx.fillStyle = 'rgba(20, 18, 16, 0.88)';
                        ctx.beginPath();
                        ctx.ellipse(cx, cy - 17, 46, 8, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.fillRect(cx - 15, cy - 36, 30, 19);
                        break;
                    }
                    case 'zhuge_hat':
                    case 'scholar_cap': {
                        // 제갈량 윤건 / 유생 관모
                        ctx.fillStyle = '#1e1b4b';
                        ctx.beginPath();
                        ctx.moveTo(cx - 22, cy - 14);
                        ctx.lineTo(cx - 16, cy - 42);
                        ctx.lineTo(cx + 16, cy - 42);
                        ctx.lineTo(cx + 22, cy - 14);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                        ctx.fillStyle = '#fde047';
                        ctx.fillRect(cx - 18, cy - 20, 36, 4);
                        break;
                    }
                    case 'mongol_fur': {
                        // 몽골·초원 모피 투구
                        ctx.fillStyle = '#78350f';
                        ctx.beginPath();
                        ctx.arc(cx, cy - 16, 26, Math.PI, 0);
                        ctx.fill();
                        ctx.stroke();
                        ctx.fillStyle = '#d6d3d1';
                        ctx.beginPath();
                        ctx.roundRect(cx - 28, cy - 22, 56, 10, 5);
                        ctx.fill();
                        ctx.stroke();
                        break;
                    }
                    case 'hwarang': {
                        // 김유신 화랑 금관모
                        ctx.fillStyle = '#facc15';
                        ctx.beginPath();
                        ctx.moveTo(cx - 22, cy - 16);
                        ctx.lineTo(cx, cy - 44);
                        ctx.lineTo(cx + 22, cy - 16);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                        break;
                    }
                    default: {
                        // 기본 전립/전투모
                        ctx.fillStyle = '#334155';
                        ctx.beginPath();
                        ctx.ellipse(cx, cy - 16, 32, 7, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(cx, cy - 17, 21, Math.PI, 0);
                        ctx.fill();
                        ctx.stroke();
                        break;
                    }
                }
                ctx.restore();
            }
        }

        /**
         * ============================================================================
         * 5. 전장 유닛 & 초호화 다층 필살기 VFX 렌더러
         * ============================================================================
         */
        class BattleVFXRenderer {
            drawActor(ctx, unit, x, y, scale, tick, facing = 1) {
                ctx.save();
                ctx.translate(x, y);

                // 발밑 회전 태극 마법진
                if (unit.side === 'ally' || unit.isBoss) {
                    const ringColor = unit.side === 'enemy' ? '#ef4444' : (unit.healer || unit.aoe ? '#22d3ee' : '#facc15');
                    ctx.save();
                    ctx.scale(1, 0.44);
                    ctx.strokeStyle = ringColor;
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.arc(0, 0, 22 * scale, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.rotate(tick * 0.045);
                    ctx.setLineDash([5, 4]);
                    ctx.beginPath();
                    ctx.arc(0, 0, 15 * scale, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                } else {
                    ctx.fillStyle = 'rgba(0,0,0,0.38)';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 16 * scale, 6 * scale, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (facing < 0) ctx.scale(-1, 1);
                const bob = Math.abs(Math.sin(tick * 0.16)) * 2.5;
                ctx.scale(scale, scale);
                ctx.translate(0, -bob);

                if (unit.kind === 'tiger') {
                    // 백두산 호랑이
                    ctx.fillStyle = '#f97316';
                    ctx.strokeStyle = '#140c06';
                    ctx.lineWidth = 1.6;
                    ctx.fillRect(-11, -10, 5, 10);
                    ctx.fillRect(6, -10, 5, 10);
                    ctx.beginPath();
                    ctx.ellipse(0, -14, 17, 9.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(-14, -18, 8.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.strokeStyle = '#140c06';
                    ctx.lineWidth = 2;
                    [-5, 0, 5].forEach(sx => {
                        ctx.beginPath(); ctx.moveTo(sx, -21); ctx.lineTo(sx - 1, -13); ctx.stroke();
                    });
                } else if (unit.kind === 'demon') {
                    // 어둠의 요괴
                    ctx.fillStyle = '#312e81';
                    ctx.strokeStyle = '#0f172a';
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(-9, 0); ctx.lineTo(-11, -25); ctx.lineTo(0, -34); ctx.lineTo(11, -25); ctx.lineTo(9, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = '#f87171';
                    ctx.fillRect(-4, -24, 3, 2.5);
                    ctx.fillRect(1, -24, 3, 2.5);
                } else {
                    // 3차 각성 불꽃 오라
                    if (unit.stage === 3) {
                        ctx.save();
                        ctx.globalCompositeOperation = 'lighter';
                        ctx.strokeStyle = 'rgba(251, 146, 60, 0.9)';
                        ctx.lineWidth = 2.6;
                        ctx.beginPath();
                        ctx.arc(0, -23, 18 + Math.sin(tick * 0.2) * 2, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.restore();
                    }

                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(-5, -10, 4, 10);
                    ctx.fillRect(1, -10, 4, 10);

                    ctx.fillStyle = unit.hitFlash > 0 ? '#ef4444' : unit.coat;
                    ctx.strokeStyle = '#140c06';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.roundRect(-8, -25, 16, 15, 3);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#f3c69f';
                    ctx.beginPath();
                    ctx.arc(0, -31, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = unit.stage === 3 ? '#facc15' : (unit.stage >= 1 ? '#92400e' : '#334155');
                    ctx.beginPath();
                    ctx.arc(0, -33, 6.8, Math.PI, 0);
                    ctx.fill();
                    ctx.stroke();

                    // 무기
                    ctx.fillStyle = '#fde047';
                    ctx.fillRect(7, -34, 2.8, 20);
                }

                ctx.restore();
            }

            drawSkillFX(ctx, fx, w, h, tick) {
                const progress = 1 - fx.life / fx.maxLife;
                ctx.save();

                if (fx.type === 1) {
                    // [청룡 칼바람] 화면을 가르는 초거대 진공 검기 파동 + 상승하는 청룡과 번개
                    ctx.globalCompositeOperation = 'lighter';
                    const cx = w * (0.48 + progress * 0.34);
                    const cy = h * 0.56;

                    // 3중 초승달 진공 칼바람 파동
                    for (let i = 0; i < 3; i++) {
                        const r = 42 + i * 24 + progress * 48;
                        ctx.strokeStyle = i === 0 ? '#ffffff' : (i === 1 ? '#38bdf8' : '#0284c7');
                        ctx.lineWidth = 9 - i * 2;
                        ctx.beginPath();
                        ctx.arc(cx - i * 18, cy, r, -Math.PI * 0.42, Math.PI * 0.42);
                        ctx.stroke();
                    }

                    // 나선형으로 솟구치는 청룡 에너지 기둥
                    ctx.strokeStyle = '#67e8f9';
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    for (let t = 0; t <= 1; t += 0.05) {
                        const sy = h * 0.85 - t * h * 0.68;
                        const sx = cx + Math.sin(t * 10 + tick * 0.3) * 32;
                        if (t === 0) ctx.moveTo(sx, sy);
                        else ctx.lineTo(sx, sy);
                    }
                    ctx.stroke();
                } else if (fx.type === 2) {
                    // [연꽃 회춘진] 비취·황금 연꽃 만다라 + 솟구치는 치유 영혼구
                    ctx.globalCompositeOperation = 'lighter';
                    const lx = w * 0.26;
                    const ly = h * 0.66;

                    ctx.save();
                    ctx.translate(lx, ly);
                    ctx.scale(1, 0.48);
                    ctx.rotate(tick * 0.06);

                    for (let p = 0; p < 8; p++) {
                        ctx.rotate(Math.PI / 4);
                        ctx.fillStyle = p % 2 === 0 ? 'rgba(74, 222, 128, 0.5)' : 'rgba(250, 204, 21, 0.45)';
                        ctx.beginPath();
                        ctx.ellipse(26, 0, 22, 9, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();

                    // 상승 치유 빛기둥
                    const beam = ctx.createLinearGradient(0, ly, 0, ly - 140);
                    beam.addColorStop(0, 'rgba(74, 222, 128, 0.55)');
                    beam.addColorStop(1, 'rgba(74, 222, 128, 0)');
                    ctx.fillStyle = beam;
                    ctx.fillRect(lx - 48, ly - 140, 96, 140);
                } else if (fx.type === 3) {
                    // [사천왕 뇌전 천벌] 어두워진 하늘에서 내리꽂히는 다중 갈래 번개 + 플라즈마 충격파
                    ctx.fillStyle = `rgba(15, 7, 36, ${0.42 * (1 - progress)})`;
                    ctx.fillRect(0, 0, w, h);

                    ctx.globalCompositeOperation = 'lighter';
                    const tx = w * 0.74;
                    const ty = h * 0.62;

                    for (let b = 0; b < 4; b++) {
                        ctx.strokeStyle = b % 2 === 0 ? '#ffffff' : '#c084fc';
                        ctx.lineWidth = b === 0 ? 5 : 2.5;
                        ctx.beginPath();
                        let bx = tx + (b - 1.5) * 28;
                        let by = 0;
                        ctx.moveTo(bx, by);
                        while (by < ty) {
                            by += 22;
                            bx += (Math.random() - 0.5) * 34;
                            ctx.lineTo(bx, by);
                        }
                        ctx.stroke();
                    }

                    // 지면 플라즈마 충격파 링
                    ctx.save();
                    ctx.translate(tx, ty);
                    ctx.scale(1, 0.45);
                    ctx.strokeStyle = '#e879f9';
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.arc(0, 0, 20 + progress * 95, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                } else if (fx.type === 4) {
                    // [거북선 출격] 거북선 실루엣 돌진 + 용머리 초거대 화염 방사 브레스 + 연속 포격 폭발
                    const sx = w * (0.14 + progress * 0.25);
                    const sy = h * 0.54;

                    // 거북선 갑판 & 용머리 실루엣
                    ctx.fillStyle = '#451a03';
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(sx, sy, 44, 18, 0, Math.PI, 0);
                    ctx.lineTo(sx + 48, sy + 10);
                    ctx.lineTo(sx - 44, sy + 10);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // 용머리 포구
                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    ctx.arc(sx + 46, sy - 4, 9, 0, Math.PI * 2);
                    ctx.fill();

                    // 용머리에서 적진까지 뿜어지는 초거대 화염 브레스 콘
                    ctx.globalCompositeOperation = 'lighter';
                    const fGrad = ctx.createLinearGradient(sx + 48, sy, w * 0.92, sy);
                    fGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                    fGrad.addColorStop(0.25, 'rgba(253, 224, 71, 0.9)');
                    fGrad.addColorStop(0.65, 'rgba(249, 115, 22, 0.85)');
                    fGrad.addColorStop(1, 'rgba(220, 38, 38, 0)');

                    ctx.fillStyle = fGrad;
                    ctx.beginPath();
                    ctx.moveTo(sx + 48, sy - 6);
                    ctx.lineTo(w * 0.94, sy - 58 - Math.sin(tick * 0.4) * 10);
                    ctx.lineTo(w * 0.94, sy + 54 + Math.cos(tick * 0.4) * 10);
                    ctx.lineTo(sx + 48, sy + 4);
                    ctx.closePath();
                    ctx.fill();

                    // 적진 위 연쇄 함포 폭발구
                    for (let k = 0; k < 3; k++) {
                        const ex = w * (0.68 + k * 0.08);
                        const ey = h * (0.50 + (k % 2) * 0.12);
                        const er = 18 + Math.sin(progress * Math.PI) * 26;
                        const eGrad = ctx.createRadialGradient(ex, ey, 2, ex, ey, er);
                        eGrad.addColorStop(0, '#ffffff');
                        eGrad.addColorStop(0.45, '#facc15');
                        eGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');
                        ctx.fillStyle = eGrad;
                        ctx.beginPath();
                        ctx.arc(ex, ey, er, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.restore();
            }
        }

        /**
         * ============================================================================
         * 6. 메인 게임 컨트롤러
         * ============================================================================
         */
        class GersangGame {
            constructor() {
                this.STORAGE_KEY = 'gersang_remaster_v3';
                this.state = this.defaultState();
                this.loadSafe();

                this.scene = 'battle';
                this.activeTab = 'squad';
                this.selectedHeroUid = this.state.roster[0].uid;
                this.selectedGearUid = this.state.gear[0].uid;
                this.speed = 1;
                this.autoHunt = true;
                this.autoTrade = false;
                this.tick = 0;
                this.shake = 0;
                this.hitStop = 0;
                this.mp = 100;
                this.skills = {
                    1: { cd: 0, max: 3.0, mp: 20 },
                    2: { cd: 0, max: 4.5, mp: 25 },
                    3: { cd: 0, max: 5.5, mp: 40 },
                    4: { cd: 0, max: 7.0, mp: 60 }
                };

                this.allies = [];
                this.enemies = [];
                this.particles = [];
                this.activeSkillFX = [];
                this.cutin = null;
                this.wagonX = 80;

                this.portraitEngine = new HighCraftPortraitEngine();
                this.vfxRenderer = new BattleVFXRenderer();

                this.refreshPrices();
                this.spawnWave(false);
                this.renderAll();

                // 게임 진입 1.2초 후 환영 시네마틱 컷인 자동 연출
                setTimeout(() => this.castSkill(4, true), 900);

                this.lastTs = performance.now();
                requestAnimationFrame((t) => this.loop(t));
            }

            defaultState() {
                return {
                    cityId: 'hanyang',
                    difficulty: 'normal',
                    money: 50000,
                    scrolls: 30,
                    soul: 600,
                    forge: 200,
                    seals: 30,
                    cargo: { hanyang: 3, gaeseong: 2 },
                    prices: {},
                    roster: [
                        { uid: 'h1', lineageId: 'kr_archer', stage: 1, level: 85, stars: 2 }, // 이순신
                        { uid: 'h2', lineageId: 'kr_healer', stage: 1, level: 85, stars: 2 }, // 허준
                        { uid: 'h3', lineageId: 'cn_axe',    stage: 3, level: 85, stars: 3 }, // 지국천왕
                        { uid: 'h4', lineageId: 'kr_spear',  stage: 0, level: 15, stars: 1 }  // 조선 창병
                    ],
                    partyUids: ['h1', 'h2', 'h3'],
                    gear: [
                        { uid: 'g1', tplId: 'w_sain',   enhance: 12, owner: 'h1' },
                        { uid: 'g2', tplId: 'r_turtle', enhance: 12, owner: 'h1' },
                        { uid: 'g3', tplId: 'w_dragon', enhance: 15, owner: 'h3' },
                        { uid: 'g4', tplId: 'a_dragon', enhance: 12, owner: 'h3' },
                        { uid: 'g5', tplId: 'r_book',   enhance: 12, owner: 'h2' },
                        { uid: 'g6', tplId: 'r_seal',   enhance: 15, owner: null },
                        { uid: 'g7', tplId: 'w_yeoui',  enhance: 10, owner: null },
                        { uid: 'g8', tplId: 'a_hyeonmu',enhance: 10, owner: null }
                    ],
                    nextUid: 10
                };
            }

            saveSafe() {
                try { window.localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.state)); } catch (e) {}
            }

            loadSafe() {
                try {
                    const raw = window.localStorage.getItem(this.STORAGE_KEY);
                    if (raw) {
                        const data = JSON.parse(raw);
                        if (data && Array.isArray(data.roster) && data.roster.length > 0) {
                            this.state = Object.assign(this.defaultState(), data);
                            const sel = document.getElementById('diffSelect');
                            if (sel) sel.value = this.state.difficulty;
                        }
                    }
                } catch (e) {}
            }

            toast(msg) {
                const box = document.getElementById('toast-container');
                if (!box) return;
                const el = document.createElement('div');
                el.className = 'toast-item';
                el.textContent = msg;
                box.appendChild(el);
                setTimeout(() => el.remove(), 2200);
            }

            getCity() {
                return CITIES.find(c => c.id === this.state.cityId) || CITIES[0];
            }

            getHeroStats(h) {
                const spec = getUnitSpec(h.lineageId, h.stage);
                const lvScale = 1 + (h.level - 1) * 0.08;
                const starScale = 1 + (h.stars - 1) * 0.2;
                let gAtk = 0, gHp = 0, gDef = 0;

                this.state.gear.filter(g => g.owner === h.uid).forEach(g => {
                    const tpl = GEAR_TEMPLATES.find(t => t.id === g.tplId);
                    if (tpl) {
                        const m = 1 + g.enhance * 0.18;
                        gAtk += Math.round(tpl.atk * m);
                        gHp += Math.round(tpl.hp * m);
                        gDef += Math.round(tpl.def * m);
                    }
                });

                const maxHp = Math.round(spec.baseHp * lvScale * starScale + gHp);
                const atk = Math.round(spec.baseAtk * lvScale * starScale + gAtk);
                const def = Math.round(spec.baseDef * lvScale * starScale + gDef);
                const power = Math.round(atk * 2.4 + maxHp * 0.35 + def * 2.5);
                return { ...spec, ...h, maxHp, atk, def, power };
            }

            getTotalPower() {
                return this.state.partyUids
                    .map(uid => this.state.roster.find(h => h.uid === uid))
                    .filter(Boolean)
                    .reduce((sum, h) => sum + this.getHeroStats(h).power, 0);
            }

            refreshPrices() {
                CITIES.forEach(c => {
                    this.state.prices[c.id] = {};
                    CITIES.forEach(itemCity => {
                        const isOrigin = itemCity.id === c.id;
                        const mult = isOrigin ? (0.6 + Math.random() * 0.15) : (1.05 + Math.random() * 0.75);
                        this.state.prices[c.id][itemCity.id] = Math.round(itemCity.base * mult);
                    });
                });
            }

            spawnWave(isBoss = false) {
                const city = this.getCity();
                const diff = DIFFICULTIES[this.state.difficulty] || DIFFICULTIES.normal;

                this.allies = this.state.partyUids
                    .map(uid => this.state.roster.find(h => h.uid === uid))
                    .filter(Boolean)
                    .map((h, i) => {
                        const st = this.getHeroStats(h);
                        return { ...st, side: 'ally', hp: st.maxHp, x: 68 + (i % 2) * 38, y: 138 + i * 32, cd: 0, hitFlash: 0 };
                    });

                const mobTemplates = [
                    { name: '백두산 호랑이', kind: 'tiger', hp: 420, atk: 34 },
                    { name: '산적 두목', kind: 'human', coat: '#7f1d1d', stage: 1, hp: 310, atk: 28 },
                    { name: '어둠의 요괴', kind: 'demon', hp: 340, atk: 31 }
                ];

                this.enemies = [];
                const count = isBoss ? 4 : 3;
                for (let i = 0; i < count; i++) {
                    const tpl = mobTemplates[i % mobTemplates.length];
                    const mega = isBoss && i === 0;
                    const mult = diff.enemy * (mega ? 2.4 : 1.0);
                    this.enemies.push({
                        ...tpl,
                        name: mega ? city.boss : tpl.name,
                        isBoss: mega,
                        side: 'enemy',
                        maxHp: Math.round(tpl.hp * mult),
                        hp: Math.round(tpl.hp * mult),
                        atk: Math.round(tpl.atk * mult),
                        x: 275 + (i % 2) * 48,
                        y: 140 + i * 30,
                        cd: 0,
                        hitFlash: 0
                    });
                }

                const titleEl = document.getElementById('hudSceneTitle');
                if (titleEl && this.scene === 'battle') {
                    titleEl.textContent = isBoss
                        ? `🐉 원경 2.5D 전장 · [대보스] ${city.boss}`
                        : `⚔️ 원경 2.5D 전장 · ${city.mob}`;
                }
            }

            castSkill(num, freeCast = false, customCaster = null) {
                const sk = this.skills[num];
                if (!sk) return;

                if (!freeCast) {
                    if (sk.cd > 0) {
                        this.toast(`재사용 대기 중 (${sk.cd.toFixed(1)}초)`);
                        return;
                    }
                    if (this.mp < sk.mp) {
                        this.toast(`도력이 부족합니다! (도력 ${sk.mp} 필요)`);
                        return;
                    }
                    this.mp -= sk.mp;
                    sk.cd = sk.max;
                }

                if (this.scene !== 'battle') {
                    this.scene = 'battle';
                    document.getElementById('btnSceneSwitch').textContent = '🏘️ 마을로 이동';
                    document.getElementById('battleSkillBar').style.display = 'flex';
                }

                if (this.enemies.length === 0) this.spawnWave(false);
                sfx.skill(num);

                const totalAtk = this.allies.reduce((s, a) => s + a.atk, 0) || 150;
                const lead = customCaster || this.allies[0] || getUnitSpec('kr_archer', 1);

                this.activeSkillFX.push({ type: num, life: 1.25, maxLife: 1.25 });
                this.hitStop = 0.05;

                if (num === 1) {
                    const target = this.enemies[0];
                    const dmg = Math.round(totalAtk * 1.45);
                    target.hp -= dmg;
                    target.hitFlash = 10;
                    this.shake = 12;
                    this.cutin = { spec: lead, title: `${lead.name} · 일격필살의 칼바람!`, color: '#38bdf8', life: 1.35 };
                    this.addParticle(target.x, target.y - 22, '#38bdf8', `치명타! -${dmg.toLocaleString()}`);
                } else if (num === 2) {
                    const heal = Math.round(totalAtk * 0.95);
                    const healer = customCaster || this.allies.find(a => a.healer) || this.allies[1] || lead;
                    this.cutin = { spec: healer, title: `${healer.name} · 의술: 연꽃 회춘진!`, color: '#4ade80', life: 1.35 };
                    this.allies.forEach(a => {
                        a.hp = Math.min(a.maxHp, a.hp + heal);
                        this.addParticle(a.x, a.y - 22, '#4ade80', `의술 +${heal.toLocaleString()}`);
                    });
                } else if (num === 3) {
                    const caster = customCaster || this.allies[2] || lead;
                    this.shake = 16;
                    this.cutin = { spec: caster, title: `${caster.name} · 사천왕 뇌전천벌!`, color: '#e879f9', life: 1.35 };
                    this.enemies.forEach(e => {
                        const dmg = Math.round(totalAtk * 1.15);
                        e.hp -= dmg;
                        e.hitFlash = 10;
                        this.addParticle(e.x, e.y - 22, '#e879f9', `뇌전! -${dmg.toLocaleString()}`);
                    });
                } else if (num === 4) {
                    this.shake = 20;
                    this.cutin = { spec: lead, title: `${lead.name} · 거북선 출격!!`, color: '#fde047', life: 1.5 };
                    this.enemies.forEach(e => {
                        const dmg = Math.round(totalAtk * 1.85);
                        e.hp -= dmg;
                        e.hitFlash = 12;
                        this.addParticle(e.x, e.y - 24, '#fde047', `치명타! -${dmg.toLocaleString()}`);
                    });
                }
            }

            playSkillShowcase() {
                this.toast('🎬 4대 초호화 필살기 연속 시네마틱 연출 시작!');
                this.castSkill(1, true, this.allies[0]);
                setTimeout(() => this.castSkill(2, true, this.allies[1] || this.allies[0]), 950);
                setTimeout(() => this.castSkill(3, true, this.allies[2] || this.allies[0]), 1900);
                setTimeout(() => this.castSkill(4, true, this.allies[0]), 2850);
            }

            addParticle(x, y, color, text) {
                for (let i = 0; i < 12; i++) {
                    this.particles.push({
                        x: x + (Math.random() - 0.5) * 34,
                        y: y + (Math.random() - 0.5) * 22,
                        vx: (Math.random() - 0.5) * 3.5,
                        vy: -1.6 - Math.random() * 2.2,
                        r: 3 + Math.random() * 3.5,
                        color,
                        life: 32
                    });
                }
                if (text) {
                    this.particles.push({ x, y: y - 10, vx: 0, vy: -0.9, text, color, life: 45 });
                }
            }

            levelUpHero(uid, count) {
                const h = this.state.roster.find(x => x.uid === uid);
                if (!h) return;
                const costMoney = count * 300;
                const costSoul = count * 10;
                if (this.state.money < costMoney || this.state.soul < costSoul) {
                    this.toast(`재화 부족! (${costMoney.toLocaleString()}냥 + 🔮${costSoul} 필요)`);
                    return;
                }
                this.state.money -= costMoney;
                this.state.soul -= costSoul;
                h.level = Math.min(100, h.level + count);
                sfx.anvil(true);
                const spec = getUnitSpec(h.lineageId, h.stage);
                this.toast(`🔥 [${spec.name}] 단련 성공! Lv.${h.level}`);
                this.saveSafe();
                this.renderAll();
            }

            evolveHero(uid) {
                const h = this.state.roster.find(x => x.uid === uid);
                if (!h) return;
                if (h.stage >= 3) {
                    this.toast('이미 최고 경지인 [3차 각성] 영웅입니다!');
                    return;
                }
                const next = STAGES[h.stage + 1];
                if (h.level < next.reqLv) {
                    this.toast(`단련 레벨 부족! Lv.${next.reqLv} 이상 필요합니다 (현재 Lv.${h.level})`);
                    return;
                }
                if (this.state.scrolls < next.scrolls || this.state.soul < next.soul || this.state.money < next.gold) {
                    this.toast(`전직 재료 부족! (📜${next.scrolls} + 🔮${next.soul} + ${next.gold.toLocaleString()}냥)`);
                    return;
                }
                this.state.scrolls -= next.scrolls;
                this.state.soul -= next.soul;
                this.state.money -= next.gold;

                const before = getUnitSpec(h.lineageId, h.stage);
                h.stage += 1;
                const after = getUnitSpec(h.lineageId, h.stage);

                sfx.evolve();
                this.saveSafe();
                this.spawnWave(false);
                this.renderAll();

                this.openModal(
                    '🔥 천명 전직 · 승급 완료! 🔥',
                    `
                        <div style="text-align:center; padding:6px 0;">
                            <div style="display:flex; justify-content:center; align-items:center; gap:12px; margin-bottom:8px;">
                                <canvas id="ev_before" width="76" height="76" style="border-radius:10px; border:2px solid #94a3b8;"></canvas>
                                <span style="font-size:22px; color:#fde047; font-weight:900;">➔</span>
