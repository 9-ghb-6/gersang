<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>천하제일거상 : 제국 리마스터 v3</title>
<style>
  :root {
    --bg-cream: #f4efe6;
    --bg-panel: #fbf8f2;
    --bg-card: #ffffff;
    --ink-main: #221d18;
    --ink-sub: #665d53;
    --ink-muted: #8f8477;
    --accent-gold: #b8821d;
    --accent-gold-soft: rgba(184, 130, 29, 0.14);
    --accent-jade: #1e7a65;
    --accent-jade-soft: rgba(30, 122, 101, 0.14);
    --accent-crimson: #b83227;
    --accent-crimson-soft: rgba(184, 50, 39, 0.14);
    --border-soft: rgba(74, 58, 38, 0.16);
    --shadow-card: 0 4px 14px rgba(42, 31, 18, 0.07);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-cream);
    color: var(--ink-main);
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }

  #app {
    display: flex;
    width: 100%;
    height: 100%;
  }

  /* 좌측 전장 영역 */
  #battle-pane {
    position: relative;
    flex: 1.15;
    min-width: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, #8ecae6 0%, #cde8f5 52%, #e8dcc4 53%, #cbb896 100%);
  }

  #battle-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .hud-top-bar {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    pointer-events: none;
    z-index: 10;
  }

  .hud-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: auto;
  }

  .hud-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .pill-btn {
    border: 1px solid var(--border-soft);
    background: rgba(251, 248, 242, 0.92);
    backdrop-filter: blur(8px);
    color: var(--ink-main);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .pill-btn:hover {
    background: #fffdf8;
  }

  .pill-btn.danger {
    background: rgba(184, 50, 39, 0.92);
    color: #fff;
    border-color: transparent;
  }

  .pill-btn.active {
    background: var(--accent-jade);
    color: #fff;
    border-color: transparent;
  }

  .stage-badge {
    background: rgba(251, 248, 242, 0.94);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 158px;
  }

  .wave-bar-wrap {
    width: 100%;
    height: 6px;
    background: rgba(0, 0, 0, 0.1);
    border-radius: 999px;
    overflow: hidden;
  }

  .wave-bar-fill {
    height: 100%;
    width: 20%;
    background: linear-gradient(90deg, var(--accent-gold), var(--accent-jade));
    transition: width 0.25s ease;
  }

  .hud-bottom-bar {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    pointer-events: auto;
  }

  .ultimate-btn {
    border: 2px solid #d49b27;
    background: linear-gradient(135deg, #2b2118 0%, #4d3519 100%);
    color: #ffe299;
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
    white-space: nowrap;
  }

  .ultimate-btn.ready {
    background: linear-gradient(135deg, #c97a16 0%, #e63946 100%);
    color: #fff;
    border-color: #fff3b0;
    animation: pulseGlow 1.1s infinite alternate;
  }

  @keyframes pulseGlow {
    from { transform: scale(1); }
    to { transform: scale(1.05); }
  }

  /* 우측 관리/도감 패널 */
  #side-pane {
    flex: 1;
    min-width: 320px;
    max-width: 560px;
    height: 100%;
    background: var(--bg-panel);
    border-left: 2px solid rgba(184, 130, 29, 0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .top-resource-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: #f1eadc;
    border-bottom: 1px solid var(--border-soft);
    font-size: 12px;
    font-weight: 700;
    gap: 8px;
    flex-wrap: wrap;
  }

  .nav-tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    padding: 8px;
    background: #f6f1e7;
    border-bottom: 1px solid var(--border-soft);
  }

  .nav-tab {
    border: 1px solid var(--border-soft);
    background: var(--bg-card);
    color: var(--ink-sub);
    border-radius: 10px;
    padding: 8px 4px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
  }

  .nav-tab.active {
    background: #223029;
    color: #fff;
    border-color: #223029;
  }

  #tab-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .section-card {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 12px;
    box-shadow: var(--shadow-card);
  }

  .section-title {
    margin: 0 0 8px 0;
    font-size: 14px;
    font-weight: 800;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nation-filter-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .nation-chip {
    border: 1px solid var(--border-soft);
    background: #faf6ee;
    color: var(--ink-sub);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .nation-chip.active {
    background: var(--accent-gold);
    color: #fff;
    border-color: var(--accent-gold);
  }

  .hero-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
  }

  .hero-card {
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 8px;
    background: #fffdf9;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .hero-card.locked {
    opacity: 0.62;
    background: #f3efe8;
  }

  .hero-thumb {
    width: 100%;
    height: 88px;
    border-radius: 8px;
    object-fit: cover;
    background: #e7decb;
  }

  .hero-name {
    font-size: 13px;
    font-weight: 800;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .hero-meta {
    font-size: 11px;
    color: var(--ink-sub);
  }

  .btn-row {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .mini-btn {
    flex: 1;
    border: 1px solid var(--border-soft);
    background: #f5efe3;
    color: var(--ink-main);
    border-radius: 8px;
    padding: 5px 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }

  .mini-btn.primary {
    background: var(--accent-jade);
    color: #fff;
    border-color: transparent;
  }

  .mini-btn.gold {
    background: var(--accent-gold);
    color: #fff;
    border-color: transparent;
  }

  .mini-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .synergy-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .synergy-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 8px;
    background: var(--accent-gold-soft);
    color: var(--ink-main);
    border: 1px solid rgba(184, 130, 29, 0.25);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 64px;
    transform: translateX(-50%);
    background: rgba(34, 29, 24, 0.92);
    color: #fff;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    z-index: 999;
    display: none;
  }

  /* 난이도 모달 */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-box {
    width: 100%;
    max-width: 420px;
    background: var(--bg-panel);
    border-radius: 16px;
    padding: 16px;
    border: 1px solid var(--border-soft);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .diff-item {
    border: 1px solid var(--border-soft);
    background: #fff;
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    text-align: left;
  }

  .diff-item.active {
    border-color: var(--accent-gold);
    background: var(--accent-gold-soft);
  }

  @media (max-width: 820px) {
    #app {
      flex-direction: column;
    }
    #battle-pane {
      flex: none;
      height: 46%;
      width: 100%;
    }
    #side-pane {
      flex: 1;
      min-width: 0;
      max-width: none;
      width: 100%;
      border-left: none;
      border-top: 2px solid rgba(184, 130, 29, 0.45);
    }
  }
</style>
</head>
<body>
<div id="app">
  <!-- 좌측 전장 -->
  <section id="battle-pane">
    <canvas id="battle-canvas"></canvas>

    <div class="hud-top-bar">
      <div class="hud-group">
        <div class="hud-row">
          <button id="btn-diff-modal" class="pill-btn" type="button">난이도: 입문 ▾</button>
          <button id="btn-bg-upload" class="pill-btn" type="button" title="배경 이미지 변경">🏞️</button>
          <input id="file-bg-input" type="file" accept="image/*" style="display:none" />
        </div>
        <div class="hud-row">
          <button id="btn-prev-stage" class="pill-btn" type="button">◀ 이전</button>
          <button id="btn-boss-now" class="pill-btn danger" type="button">👹 보스즉시</button>
          <button id="btn-next-stage" class="pill-btn" type="button">다음 ▶</button>
        </div>
      </div>

      <div class="hud-group" style="align-items:flex-end;">
        <div class="stage-badge">
          <div id="stage-label">1-1 한양성 외곽 (1/5)</div>
          <div class="wave-bar-wrap">
            <div id="wave-bar" class="wave-bar-fill"></div>
          </div>
        </div>
        <button id="btn-auto-stage" class="pill-btn active" type="button">🔄 자동진행 ON</button>
      </div>
    </div>

    <div class="hud-bottom-bar">
      <button id="btn-ultimate" class="ultimate-btn" type="button">⚡ 천지개벽 협동필살 공명 0%</button>
    </div>
  </section>

  <!-- 우측 관리 패널 -->
  <aside id="side-pane">
    <div class="top-resource-strip">
      <span id="res-gold">💰 1,500냥</span>
      <span id="res-gem">💎 300옥</span>
      <span id="res-soul">🔥 영혼석 20</span>
    </div>

    <nav class="nav-tabs" aria-label="주요 메뉴">
      <button class="nav-tab active" data-tab="squad" type="button">⚔️ 출전부대</button>
      <button class="nav-tab" data-tab="roster" type="button">📜 장수·용병</button>
      <button class="nav-tab" data-tab="summon" type="button">🔮 태극소환</button>
      <button class="nav-tab" data-tab="dungeon" type="button">📖 각성던전</button>
      <button class="nav-tab" data-tab="merchant" type="button">🏛️ 상단·제련</button>
    </nav>

    <main id="tab-content"></main>
  </aside>
</div>

<!-- 난이도 선택 모달 -->
<div id="diff-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="난이도 선택">
  <div class="modal-box">
    <div class="section-title">
      <span>전장 난이도 선택</span>
      <button id="btn-close-diff" class="mini-btn" type="button">닫기</button>
    </div>
    <div id="diff-list"></div>
  </div>
</div>

<!-- 장수 개별 이미지 교체용 숨김 input -->
<input id="file-hero-input" type="file" accept="image/*" style="display:none" />
<div id="toast" class="toast"></div>

<script>
(function () {
  "use strict";

  const DIFFICULTIES = [
    { id: 0, name: "입문", mult: 1, hpPow: 1.0, rewardMult: 1 },
    { id: 1, name: "정예", mult: 8, hpPow: 1.12, rewardMult: 2.5 },
    { id: 2, name: "무쌍", mult: 45, hpPow: 1.24, rewardMult: 6 },
    { id: 3, name: "패왕", mult: 220, hpPow: 1.38, rewardMult: 15 },
    { id: 4, name: "신화", mult: 950, hpPow: 1.52, rewardMult: 40 },
    { id: 5, name: "천마강림", mult: 2800, hpPow: 1.68, rewardMult: 100 }
  ];

  const STAGE_TITLES = [
    "한양성 외곽", "경복궁 누각", "임진강 나루", "남한산성길", "백두산 기슭",
    "용문객잔 앞", "황하 상류", "장안성 성문", "낙양 만리교", "천상 낙원"
  ];

  const CHAPTER_NAMES = [
    "제1장 조선 건국", "제2장 대륙 정벌", "제3장 사해 패권", "제4장 천상 개벽"
  ];

  const NATIONS = ["전체", "조선", "명나라", "일본", "몽골", "천상"];

  const HERO_POOL = [
    {
      id: "yi_sunsin",
      name: "이순신",
      nation: "조선",
      role: "지휘관",
      element: "수(水)",
      baseAtk: 145,
      baseHp: 1400,
      asset: "./assets/yi_sunsin.png",
      color: "#1d4ed8",
      unlockedDefault: true
    },
    {
      id: "seondeok",
      name: "선덕여왕",
      nation: "조선",
      role: "책략가",
      element: "화(火)",
      baseAtk: 132,
      baseHp: 1050,
      asset: "./assets/seondeok.png",
      color: "#dc2626",
      unlockedDefault: true
    },
    {
      id: "guan_yu",
      name: "관우",
      nation: "명나라",
      role: "돌격장",
      element: "목(木)",
      baseAtk: 155,
      baseHp: 1320,
      asset: "./assets/guan_yu.png",
      color: "#15803d",
      unlockedDefault: true
    },
    {
      id: "oda",
      name: "오다 노부나가",
      nation: "일본",
      role: "선봉장",
      element: "화(火)",
      baseAtk: 162,
      baseHp: 1120,
      asset: "./assets/oda.png",
      color: "#b45309",
      unlockedDefault: false
    },
    {
      id: "genghis",
      name: "칭기즈칸",
      nation: "몽골",
      role: "돌격장",
      element: "풍(風)",
      baseAtk: 158,
      baseHp: 1250,
      asset: "./assets/genghis.png",
      color: "#0369a1",
      unlockedDefault: false
    },
    {
      id: "sacheonwang",
      name: "다문천왕",
      nation: "천상",
      role: "지휘관",
      element: "뇌(雷)",
      baseAtk: 185,
      baseHp: 1650,
      asset: "./assets/sacheonwang.png",
      color: "#6d28d9",
      unlockedDefault: false
    },
    {
      id: "hwang_jini",
      name: "황진이",
      nation: "조선",
      role: "책략가",
      element: "풍(風)",
      baseAtk: 124,
      baseHp: 960,
      asset: null,
      color: "#be185d",
      unlockedDefault: false
    },
    {
      id: "zhuge_liang",
      name: "제갈량",
      nation: "명나라",
      role: "책략가",
      element: "풍(風)",
      baseAtk: 148,
      baseHp: 980,
      asset: null,
      color: "#0f766e",
      unlockedDefault: false
    }
  ];

  const state = {
    gold: 1500,
    gem: 300,
    soul: 20,
    difficultyIdx: 0,
    chapter: 1,
    stageNum: 1,
    wave: 1,
    maxWave: 5,
    autoStage: true,
    resonance: 0,
    activeTab: "squad",
    selectedNation: "전체",
    squadIds: ["yi_sunsin", "seondeok", "guan_yu"],
    heroes: {},
    customImages: {},
    bgImageSrc: "./assets/bg_day.png",
    pendingHeroImageId: null,
    enemies: [],
    projectiles: [],
    effects: [],
    lastTime: performance.now(),
    waveTimer: 0
  };

  function initHeroes() {
    for (const h of HERO_POOL) {
      state.heroes[h.id] = {
        unlocked: Boolean(h.unlockedDefault),
        level: 1,
        star: 1,
        relicLv: 0
      };
    }
  }

  initHeroes();

  // 이미지 캐시 (실패해도 절대 크래시 나지 않도록 처리)
  const imgCache = new Map();
  function getLoadedImage(src) {
    if (!src) return null;
    if (imgCache.has(src)) {
      const entry = imgCache.get(src);
      return entry.ready ? entry.img : null;
    }
    const img = new Image();
    const entry = { img, ready: false };
    img.onload = () => { entry.ready = true; };
    img.onerror = () => { entry.ready = false; };
    img.src = src;
    imgCache.set(src, entry);
    return null;
  }

  function getHeroImageSrc(heroId) {
    if (state.customImages[heroId]) return state.customImages[heroId];
    const poolItem = HERO_POOL.find(h => h.id === heroId);
    return poolItem ? poolItem.asset : null;
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.style.display = "block";
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => {
      el.style.display = "none";
    }, 1800);
  }

  function formatNum(n) {
    return Math.floor(n).toLocaleString("ko-KR");
  }

  function getStageIndex() {
    return (state.chapter - 1) * 10 + (state.stageNum - 1);
  }

  function getStageName() {
    const title = STAGE_TITLES[(state.stageNum - 1) % STAGE_TITLES.length];
    return `${state.chapter}-${state.stageNum} ${title} (${state.wave}/${state.maxWave})`;
  }

  function getHeroPower(heroId) {
    const base = HERO_POOL.find(h => h.id === heroId);
    const st = state.heroes[heroId];
    if (!base || !st) return { atk: 100, maxHp: 1000 };
    const lvScale = 1 + (st.level - 1) * 0.14;
    const starScale = 1 + (st.star - 1) * 0.35;
    const relicScale = 1 + st.relicLv * 0.2;
    return {
      atk: Math.round(base.baseAtk * lvScale * starScale * relicScale),
      maxHp: Math.round(base.baseHp * lvScale * starScale * relicScale)
    };
  }

  function spawnWaveEnemies(isBossForce = false) {
    const diff = DIFFICULTIES[state.difficultyIdx] || DIFFICULTIES[0];
    const sIdx = getStageIndex();
    const isBoss = isBossForce || state.wave === state.maxWave;
    const count = isBoss ? 1 : 3;
    const baseHp = Math.round(320 * Math.pow(1.22, sIdx) * Math.pow(diff.hpPow, sIdx) * (isBoss ? 3.6 : 1));
    const baseAtk = Math.round(28 * Math.pow(1.16, sIdx) * Math.sqrt(diff.mult) * (isBoss ? 1.5 : 1));

    state.enemies = [];
    for (let i = 0; i < count; i++) {
      state.enemies.push({
        id: "e_" + Math.random().toString(36).slice(2, 8),
        name: isBoss ? `${getStageName().split(" ")[1]} 수호신` : `흉수 ${i + 1}`,
        isBoss,
        hp: baseHp,
        maxHp: baseHp,
        atk: baseAtk,
        xRatio: 0.72 + i * 0.08,
        yRatio: isBoss ? 0.64 : 0.56 + i * 0.11,
        hitFlash: 0
      });
    }
  }

  function advanceStage(delta) {
    const nextTotal = getStageIndex() + delta;
    const clamped = Math.max(0, nextTotal);
    state.chapter = Math.floor(clamped / 10) + 1;
    state.stageNum = (clamped % 10) + 1;
    state.wave = 1;
    spawnWaveEnemies(false);
    updateHud();
    showToast(`스테이지 이동: ${state.chapter}-${state.stageNum}`);
  }

  function onWaveCleared() {
    const diff = DIFFICULTIES[state.difficultyIdx] || DIFFICULTIES[0];
    const goldGain = Math.round((120 + getStageIndex() * 35) * diff.rewardMult);
    const gemGain = state.wave === state.maxWave ? Math.max(5, Math.round(10 * Math.sqrt(diff.rewardMult))) : 0;
    state.gold += goldGain;
    state.gem += gemGain;
    state.resonance = Math.min(100, state.resonance + 25);

    if (state.wave < state.maxWave) {
      state.wave += 1;
      spawnWaveEnemies(false);
      showToast(`웨이브 클리어! +${formatNum(goldGain)}냥`);
    } else if (state.autoStage) {
      const nextTotal = getStageIndex() + 1;
      state.chapter = Math.floor(nextTotal / 10) + 1;
      state.stageNum = (nextTotal % 10) + 1;
      state.wave = 1;
      spawnWaveEnemies(false);
      showToast(`스테이지 돌파! +${formatNum(goldGain)}냥${gemGain ? ` · +${gemGain}옥` : ""}`);
    } else {
      state.wave = 1;
      spawnWaveEnemies(false);
      showToast(`보스 토벌 완료! +${formatNum(goldGain)}냥`);
    }
    updateHud();
    if (state.activeTab === "squad" || state.activeTab === "roster") {
      renderTabContent();
    }
  }

  function triggerUltimate() {
    if (state.resonance < 100) {
      showToast("공명 게이지 100% 달성 시 발동 가능!");
      return;
    }
    state.resonance = 0;
    let totalDmg = 0;
    for (const hid of state.squadIds) {
      totalDmg += getHeroPower(hid).atk * 3;
    }
    totalDmg = Math.max(250, totalDmg);

    for (const en of state.enemies) {
      en.hp -= totalDmg;
      en.hitFlash = 0.25;
      state.effects.push({
        xRatio: en.xRatio,
        yRatio: en.yRatio,
        radius: en.isBoss ? 78 : 52,
        alpha: 0.9,
        color: "#f59e0b"
      });
    }
    state.enemies = state.enemies.filter(e => e.hp > 0);
    showToast(`⚡ 천지개벽 협동필살! (${formatNum(totalDmg)} 피해)`);
    if (state.enemies.length === 0) {
      onWaveCleared();
    }
    updateHud();
  }

  function toggleSquadHero(heroId) {
    const st = state.heroes[heroId];
    if (!st || !st.unlocked) {
      showToast("미보유 장수입니다. 태극소환에서 영입하세요!");
      return;
    }
    const idx = state.squadIds.indexOf(heroId);
    if (idx >= 0) {
      if (state.squadIds.length <= 1) {
        showToast("최소 1명 이상의 장수를 출전시켜야 합니다.");
        return;
      }
      state.squadIds.splice(idx, 1);
      showToast("출전 부대에서 제외했습니다.");
    } else {
      if (state.squadIds.length >= 4) {
        state.squadIds.shift();
      }
      state.squadIds.push(heroId);
      showToast("출전 부대에 배치했습니다.");
    }
    renderTabContent();
  }

  function levelUpHero(heroId) {
    const st = state.heroes[heroId];
    if (!st || !st.unlocked) return;
    const cost = st.level * 150;
    if (state.gold < cost) {
      showToast("냥이 부족합니다!");
      return;
    }
    state.gold -= cost;
    st.level += 1;
    updateHud();
    renderTabContent();
    showToast(`Lv.${st.level} 달성!`);
  }

  function promoteStarHero(heroId) {
    const st = state.heroes[heroId];
    if (!st || !st.unlocked) return;
    if (st.star >= 6) {
      showToast("이미 ★6 최고 성급입니다.");
      return;
    }
    const cost = st.star * 10;
    if (state.soul < cost) {
      showToast(`영혼석 ${cost}개가 필요합니다.`);
      return;
    }
    state.soul -= cost;
    st.star += 1;
    updateHud();
    renderTabContent();
    showToast(`★${st.star} 성급 돌파 성공!`);
  }

  function doSummon(count) {
    const cost = count === 10 ? 180 : 20;
    if (state.gem < cost) {
      showToast("옥이 부족합니다!");
      return;
    }
    state.gem -= cost;
    const unlockedNow = [];
    for (let i = 0; i < count; i++) {
      const pick = HERO_POOL[Math.floor(Math.random() * HERO_POOL.length)];
      const st = state.heroes[pick.id];
      if (!st.unlocked) {
        st.unlocked = true;
        unlockedNow.push(pick.name);
      } else {
        state.soul += 4;
      }
    }
    updateHud();
    renderTabContent();
    if (unlockedNow.length > 0) {
      showToast(`🎉 신규 영입: ${unlockedNow.join(", ")}`);
    } else {
      showToast("중복 장수 영혼석 변환 완료!");
    }
  }

  function getActiveSynergies() {
    const nationCount = {};
    const roleCount = {};
    for (const hid of state.squadIds) {
      const h = HERO_POOL.find(x => x.id === hid);
      if (!h) continue;
      nationCount[h.nation] = (nationCount[h.nation] || 0) + 1;
      roleCount[h.role] = (roleCount[h.role] || 0) + 1;
    }
    const list = [];
    for (const [nat, cnt] of Object.entries(nationCount)) {
      if (cnt >= 2) list.push(`${nat} ${cnt}인 결속 (공격 +${cnt * 10}%)`);
    }
    for (const [role, cnt] of Object.entries(roleCount)) {
      if (cnt >= 2) list.push(`${role} 진형 (체력 +${cnt * 12}%)`);
    }
    if (list.length === 0) list.push("출전 조합으로 국적/역할 시너지를 활성화하세요.");
    return list;
  }

  function renderHeroCard(hero, mode) {
    const st = state.heroes[hero.id];
    const pwr = getHeroPower(hero.id);
    const isDeployed = state.squadIds.includes(hero.id);
    const imgSrc = getHeroImageSrc(hero.id);
    const loadedImg = getLoadedImage(imgSrc);
    const lvCost = st.level * 150;
    const starCost = st.star * 10;

    const div = document.createElement("div");
    div.className = `hero-card ${st.unlocked ? "" : "locked"}`;

    let visualHtml = "";
    if (loadedImg && imgSrc) {
      visualHtml = `<img class="hero-thumb" src="${imgSrc}" alt="${hero.name}" />`;
    } else {
      visualHtml = `<div class="hero-thumb" style="display:flex;align-items:center;justify-content:center;background:${hero.color};color:#fff;font-weight:800;font-size:18px;">${hero.name[0]}</div>`;
    }

    div.innerHTML = `
      ${visualHtml}
      <div class="hero-name">
        <span>${hero.name}</span>
        <span>★${st.star}</span>
      </div>
      <div class="hero-meta">${hero.nation} · ${hero.role} · ${hero.element}</div>
      <div class="hero-meta">Lv.${st.level} · 공격 ${formatNum(pwr.atk)} · 체력 ${formatNum(pwr.maxHp)}</div>
      <div class="btn-row">
        <button class="mini-btn ${isDeployed ? "gold" : "primary"}" data-act="deploy" data-id="${hero.id}" ${st.unlocked ? "" : "disabled"}>
          ${!st.unlocked ? "미보유" : (isDeployed ? "출전중" : "배치")}
        </button>
        <button class="mini-btn" data-act="photo" data-id="${hero.id}" title="이미지 교체">📷</button>
      </div>
      ${st.unlocked && mode === "roster" ? `
        <div class="btn-row">
          <button class="mini-btn" data-act="lvup" data-id="${hero.id}">강화 (${lvCost}냥)</button>
          <button class="mini-btn" data-act="starup" data-id="${hero.id}" ${st.star >= 6 ? "disabled" : ""}>돌파 (${starCost}석)</button>
        </div>
      ` : ""}
    `;

    div.querySelectorAll("button[data-act]").forEach(btn => {
      btn.addEventListener("click", () => {
        const act = btn.getAttribute("data-act");
        const id = btn.getAttribute("data-id");
        if (act === "deploy") toggleSquadHero(id);
        else if (act === "lvup") levelUpHero(id);
        else if (act === "starup") promoteStarHero(id);
        else if (act === "photo") {
          state.pendingHeroImageId = id;
          document.getElementById("file-hero-input").click();
        }
      });
    });

    return div;
  }

    const container = document.getElementById("tab-content");
    if (!container) return;
    container.innerHTML = "";

    if (state.activeTab === "squad") {
      const synCard = document.createElement("div");
      synCard.className = "section-card";
      const synList = getActiveSynergies();
      synCard.innerHTML = `
        <h3 class="section-title">
          <span>출전 부대 (${state.squadIds.length}/4)</span>
          <span style="font-size:11px;color:var(--ink-sub);">${CHAPTER_NAMES[(state.chapter - 1) % CHAPTER_NAMES.length]}</span>
        </h3>
        <div class="synergy-list">${synList.map(s => `<span class="synergy-badge">${s}</span>`).join("")}</div>
      `;
      container.appendChild(synCard);

      const gridCard = document.createElement("div");
      gridCard.className = "section-card";

      const grid = gridCard.querySelector("#squad-grid");
      for (const hid of state.squadIds) {
        const h = HERO_POOL.find(x => x.id === hid);
        if (h) grid.appendChild(renderHeroCard(h, "squad"));
      }

    } else if (state.activeTab === "roster") {

      card.className = "section-card";
      const ownedCount = HERO_POOL.filter(h => state.heroes[h.id] && state.heroes[h.id].unlocked).length;
      card.innerHTML = `
        <h3 class="section-title">
          <span>국적별 장수·용병 도감</span>
          <span style="font-size:12px;color:var(--accent-jade);">보유 ${ownedCount}/${HERO_POOL.length}</span>
        </h3>
        <div id="nation-filters" class="nation-filter-bar"></div>
        <div id="roster-grid" class="hero-grid"></div>
      `;

      const filterBar = card.querySelector("#nation-filters");
      for (const nat of NATIONS) {

          renderTabContent();

    } else if (state.activeTab === "summon") {
      const card = document.createElement("div");
      card.className = "section-card";
      card.innerHTML = `
        <h3 class="section-title">🔮 태극 장수 소환</h3>
        <p style="margin:0 0 10px 0;font-size:12px;color:var(--ink-sub);">
          조선·명나라·일본·몽골·천상 명장을 영입합니다. 이미 보유한 장수는 영혼석으로 전환됩니다.
        </p>
        <div class="btn-row">
          <button id="btn-summon-1" class="mini-btn primary" type="button">1회 소환 (20옥)</button>
          <button id="btn-summon-10" class="mini-btn gold" type="button">10회 소환 (180옥)</button>
        </div>
      `;
      card.querySelector("#btn-summon-1").addEventListener("click", () => doSummon(1));
      card.querySelector("#btn-summon-10").addEventListener("click", () => doSummon(10));
      container.appendChild(card);
    } else if (state.activeTab === "dungeon") {
      const card = document.createElement("div");
      card.className = "section-card";
      card.innerHTML = `
        <h3 class="section-title">📖 각성 시련</h3>
        <p style="margin:0 0 10px 0;font-size:12px;color:var(--ink-sub);">
          시련을 돌파해 영혼석과 옥을 획득하고 장수 성급 돌파에 활용하세요.
        </p>
        <button id="btn-run-dungeon" class="mini-btn primary" type="button" style="width:100%;padding:9px;">
          시련 도전 (보상: 영혼석 +8 · 옥 +25)
        </button>
      `;
      card.querySelector("#btn-run-dungeon").addEventListener("click", () => {
        state.soul += 8;
        state.gem += 25;
        updateHud();
        showToast("각성 시련 돌파! 영혼석 +8, 옥 +25");
      });
      container.appendChild(card);
    } else if (state.activeTab === "merchant") {
      const card = document.createElement("div");
      card.className = "section-card";
      card.innerHTML = `
        <h3 class="section-title">🏛️ 제국 상단·환전</h3>
        <p style="margin:0 0 10px 0;font-size:12px;color:var(--ink-sub);">
          전투에서 모은 냥을 옥과 영혼석으로 교환합니다.
        </p>
        <div class="btn-row">
          <button id="btn-buy-gem" class="mini-btn gold" type="button">옥 +50 (800냥)</button>
          <button id="btn-buy-soul" class="mini-btn primary" type="button">영혼석 +6 (600냥)</button>
        </div>
      `;
      card.querySelector("#btn-buy-gem").addEventListener("click", () => {
        if (state.gold < 800) { showToast("냥이 부족합니다."); return; }
        state.gold -= 800;
        state.gem += 50;
        updateHud();
        showToast("옥 +50 교환 완료!");
      });
      card.querySelector("#btn-buy-soul").addEventListener("click", () => {
        if (state.gold < 600) { showToast("냥이 부족합니다."); return; }
        state.gold -= 600;
        state.soul += 6;
        updateHud();
        showToast("영혼석 +6 교환 완료!");
      });
      container.appendChild(card);
    }
  }

  function renderDifficultyModal() {
    const list = document.getElementById("diff-list");
    if (!list) return;
    list.innerHTML = "";
    for (const d of DIFFICULTIES) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = `diff-item ${state.difficultyIdx === d.id ? "active" : ""}`;
      btn.innerHTML = `
        <div>
          <strong>${d.id + 1}. ${d.name}</strong>
          <div style="font-size:11px;color:var(--ink-sub);">적 전투 배율 ×${formatNum(d.mult)}</div>
        </div>
        <span style="font-size:12px;font-weight:700;color:var(--accent-jade);">보상 ×${d.rewardMult}</span>
      `;
      btn.addEventListener("click", () => {
        state.difficultyIdx = d.id;
        spawnWaveEnemies(false);
        updateHud();
        renderDifficultyModal();
        document.getElementById("diff-modal").classList.remove("open");
        showToast(`난이도 변경: ${d.name}`);
      });
      list.appendChild(btn);
    }
  }

  function updateHud() {
    const diff = DIFFICULTIES[state.difficultyIdx] || DIFFICULTIES[0];
    document.getElementById("btn-diff-modal").textContent = `난이도: ${diff.name} ▾`;
    document.getElementById("stage-label").textContent = getStageName();
    document.getElementById("wave-bar").style.width = `${(state.wave / state.maxWave) * 100}%`;

    const autoBtn = document.getElementById("btn-auto-stage");
    autoBtn.textContent = `🔄 자동진행 ${state.autoStage ? "ON" : "OFF"}`;
    autoBtn.classList.toggle("active", state.autoStage);

    const ultBtn = document.getElementById("btn-ultimate");
    ultBtn.textContent = `⚡ 천지개벽 협동필살 공명 ${Math.min(100, Math.floor(state.resonance))}%`;
    ultBtn.classList.toggle("ready", state.resonance >= 100);

    document.getElementById("res-gold").textContent = `💰 ${formatNum(state.gold)}냥`;
    document.getElementById("res-gem").textContent = `💎 ${formatNum(state.gem)}옥`;
    document.getElementById("res-soul").textContent = `🔥 영혼석 ${formatNum(state.soul)}`;
  }

  // 전장 캔버스 루프
  const canvas = document.getElementById("battle-canvas");
  const ctx = canvas.getContext("2d");

  function resizeCanvas() {
    const pane = document.getElementById("battle-pane");
    if (!pane || !canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = pane.clientWidth;
    const h = pane.clientHeight;
    canvas.width = Math.max(1, Math.floor(w * dpr));
    canvas.height = Math.max(1, Math.floor(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function stepBattle(dt) {
    if (state.enemies.length === 0) {
      state.waveTimer += dt;
      if (state.waveTimer > 0.6) {
        state.waveTimer = 0;
        spawnWaveEnemies(false);
      }
      return;
    }

    // 아군 공격
    let dps = 0;
    for (const hid of state.squadIds) {
      dps += getHeroPower(hid).atk;
    }
    const deal = dps * dt * 1.15;
    const target = state.enemies[0];
    if (target) {
      target.hp -= deal;
      target.hitFlash = Math.max(0, target.hitFlash - dt);
      state.resonance = Math.min(100, state.resonance + dt * 9);
      if (Math.random() < dt * 4) {
        state.projectiles.push({
          x: 0.28,
          y: 0.6,
          tx: target.xRatio,
          ty: target.yRatio,
          t: 0
        });
      }
    }

    state.enemies = state.enemies.filter(e => e.hp > 0);
    if (state.enemies.length === 0) {
      onWaveCleared();
    }

    for (const p of state.projectiles) {
      p.t = Math.min(1, p.t + dt * 4.5);
    }
    state.projectiles = state.projectiles.filter(p => p.t < 1);

    for (const ef of state.effects) {
      ef.alpha -= dt * 2.2;
      ef.radius += dt * 40;
    }
    state.effects = state.effects.filter(ef => ef.alpha > 0);
  }

  function drawBattle() {
    const pane = document.getElementById("battle-pane");
    if (!pane || !ctx) return;
    const w = pane.clientWidth;
    const h = pane.clientHeight;
    ctx.clearRect(0, 0, w, h);

    const bgImg = getLoadedImage(state.bgImageSrc);
    if (bgImg) {
      ctx.drawImage(bgImg, 0, 0, w, h);
    } else {
      const sky = ctx.createLinearGradient(0, 0, 0, h * 0.56);
      sky.addColorStop(0, "#7ec8e3");
      sky.addColorStop(1, "#e0f2fe");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h * 0.56);

      const ground = ctx.createLinearGradient(0, h * 0.56, 0, h);
      ground.addColorStop(0, "#dfd2b5");
      ground.addColorStop(1, "#c2b08d");
      ctx.fillStyle = ground;
      ctx.fillRect(0, h * 0.56, w, h * 0.44);
    }

    // 아군 장수 렌더링
    state.squadIds.forEach((hid, idx) => {
      const hero = HERO_POOL.find(x => x.id === hid);
      if (!hero) return;
      const x = w * (0.16 + (idx % 2) * 0.09);
      const y = h * (0.56 + Math.floor(idx / 2) * 0.16);
      const hImg = getLoadedImage(getHeroImageSrc(hid));

      if (hImg) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y - 16, 26, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(hImg, x - 26, y - 42, 52, 52);
        ctx.restore();
      } else {
        ctx.fillStyle = hero.color;
        ctx.beginPath();
        ctx.arc(x, y - 16, 22, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "rgba(255,255,255,0.92)";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(hero.name, x, y + 18);
    });

    // 적 몬스터 렌더링
    for (const en of state.enemies) {
      const x = w * en.xRatio;
      const y = h * en.yRatio;
      const r = en.isBoss ? 32 : 20;

      ctx.fillStyle = en.hitFlash > 0 ? "#fde047" : (en.isBoss ? "#991b1b" : "#4b5563");
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      const ratio = Math.max(0, en.hp / en.maxHp);
      const barW = en.isBoss ? 68 : 44;
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(x - barW / 2, y - r - 12, barW, 6);
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(x - barW / 2, y - r - 12, barW * ratio, 6);

      ctx.fillStyle = "#fff";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(en.name, x, y + r + 14);
    }

    // 투사체 및 이펙트
    for (const p of state.projectiles) {
      const cx = w * (p.x + (p.tx - p.x) * p.t);
      const cy = h * (p.y + (p.ty - p.y) * p.t);
      ctx.fillStyle = "#fbbf24";
      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const ef of state.effects) {
      ctx.strokeStyle = `rgba(245, 158, 11, ${Math.max(0, ef.alpha)})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(w * ef.xRatio, h * ef.yRatio, ef.radius, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function loop(now) {
    const dt = Math.min(0.1, Math.max(0.001, (now - state.lastTime) / 1000));
    state.lastTime = now;
    stepBattle(dt);
    drawBattle();
    requestAnimationFrame(loop);
  }

  function bindEvents() {
    window.addEventListener("resize", resizeCanvas);

    document.querySelectorAll(".nav-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.activeTab = btn.getAttribute("data-tab") || "squad";
        renderTabContent();
      });
    });

    document.getElementById("btn-diff-modal").addEventListener("click", () => {
      renderDifficultyModal();
      document.getElementById("diff-modal").classList.add("open");
    });

    document.getElementById("btn-close-diff").addEventListener("click", () => {
      document.getElementById("diff-modal").classList.remove("open");
    });

    document.getElementById("btn-prev-stage").addEventListener("click", () => advanceStage(-1));
    document.getElementById("btn-next-stage").addEventListener("click", () => advanceStage(1));
    document.getElementById("btn-boss-now").addEventListener("click", () => {
      state.wave = state.maxWave;
      spawnWaveEnemies(true);
      updateHud();
      showToast("보스 즉시 소환!");
    });

    document.getElementById("btn-auto-stage").addEventListener("click", () => {
      state.autoStage = !state.autoStage;
      updateHud();
    });

    document.getElementById("btn-ultimate").addEventListener("click", triggerUltimate);

    document.getElementById("btn-bg-upload").addEventListener("click", () => {
      document.getElementById("file-bg-input").click();
    });

    document.getElementById("file-bg-input").addEventListener("change", e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        if (ev.target && typeof ev.target.result === "string") {
          state.bgImageSrc = ev.target.result;
          showToast("전장 배경이 변경되었습니다.");
        }
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    });

    document.getElementById("file-hero-input").addEventListener("change", e => {
      const file = e.target.files && e.target.files[0];
      const targetId = state.pendingHeroImageId;
      state.pendingHeroImageId = null;
      if (!file || !targetId) return;
      const reader = new FileReader();
      reader.onload = ev => {
        if (ev.target && typeof ev.target.result === "string") {
          state.customImages[targetId] = ev.target.result;
          renderTabContent();
          showToast("장수 일러스트가 변경되었습니다.");
        }
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    });
  }

  resizeCanvas();
  bindEvents();
  spawnWaveEnemies(false);
  updateHud();
  renderTabContent();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
