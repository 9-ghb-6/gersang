<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>천하제일거상 : 제국 리마스터 v3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --hanji: #f9f5eb;
      --hanji-card: rgba(255, 252, 244, 0.92);
      --jade-bg: #e6f0ec;
      --jade-deep: #1e3a34;
      --jade-mid: #2f5d53;
      --gold-accent: #c88a1e;
      --gold-bright: #f5b942;
      --border-soft: rgba(200, 138, 30, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(135deg, #f4efe2 0%, #e1ede8 100%);
      color: var(--jade-deep);
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    }

    /* Z Fold 8 Responsive Shell */
    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      max-width: 1440px;
      margin: 0 auto;
      background: var(--hanji);
      box-shadow: 0 0 30px rgba(30, 58, 52, 0.12);
    }

    .top-bar {
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      background: linear-gradient(90deg, #fcf8ee 0%, #e5f1ec 100%);
      border-bottom: 1.5px solid var(--border-soft);
      gap: 4px;
      z-index: 20;
    }

    .main-split {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .arena-panel {
      position: relative;
      height: 43%;
      min-height: 225px;
      flex-shrink: 0;
      background: #87ceeb;
      border-bottom: 2px solid var(--gold-accent);
      overflow: hidden;
    }

    .command-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--hanji);
      overflow: hidden;
    }

    /* Z Fold Unfolded / Tablet Landscape Split */
    @media (min-width: 760px) {
      .main-split {
        flex-direction: row;
      }
      .arena-panel {
        width: 52%;
        height: 100%;
        border-bottom: none;
        border-right: 2px solid var(--gold-accent);
      }
      .command-panel {
        width: 48%;
        height: 100%;
      }
    }

    .hanji-card {
      background: var(--hanji-card);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(30, 58, 52, 0.06);
      backdrop-filter: blur(8px);
    }

    .jade-pill {
      background: var(--jade-bg);
      border: 1px solid rgba(47, 93, 83, 0.25);
      color: var(--jade-deep);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .gold-btn {
      background: linear-gradient(180deg, #f8c85c 0%, #d49122 100%);
      color: #fffef9;
      text-shadow: 0 1px 2px rgba(92, 56, 4, 0.6);
      border: 1px solid #b57612;
      border-radius: 12px;
      font-weight: 800;
      box-shadow: 0 3px 0 #9e650d, 0 5px 10px rgba(200, 138, 30, 0.25);
      transition: transform 0.08s ease, filter 0.15s ease;
    }
    .gold-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #9e650d;
    }
    .gold-btn:disabled {
      opacity: 0.45;
      filter: grayscale(0.7);
      cursor: not-allowed;
    }

    .jade-btn {
      background: linear-gradient(180deg, #3b7468 0%, #244b43 100%);
      color: #f6fbf9;
      border: 1px solid #1a3832;
      border-radius: 12px;
      font-weight: 700;
      box-shadow: 0 3px 0 #16302b;
      transition: transform 0.08s ease;
    }
    .jade-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #16302b;
    }
    .jade-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Rarity Borders */
    .rarity-N { border-color: #8c9ba5 !important; }
    .rarity-R { border-color: #2b8cbe !important; }
    .rarity-SR { border-color: #8856a7 !important; box-shadow: 0 0 10px rgba(136, 86, 167, 0.25); }
    .rarity-SSR { border-color: #d99015 !important; box-shadow: 0 0 14px rgba(245, 185, 66, 0.55); }

    /* Custom subtle scrollbar inside sub-panels */
    .scroll-thin::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .scroll-thin::-webkit-scrollbar-thumb {
      background: rgba(47, 93, 83, 0.25);
      border-radius: 99px;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 8px rgba(245, 185, 66, 0.7), 0 0 18px rgba(220, 38, 38, 0.5); transform: scale(1); }
      50% { box-shadow: 0 0 16px rgba(254, 240, 138, 1), 0 0 28px rgba(234, 88, 12, 0.85); transform: scale(1.04); }
    }
    .chain-ready {
      animation: pulseGlow 1.1s infinite ease-in-out;
    }
  </style>
</head>

    /**
     * =========================================================================
     * 1. WEB AUDIO SYNTHESIZER (Zero external audio dependencies)
     * =========================================================================
     */
    class SoundEngine {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }
      play(type) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'tap') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(640, now);
          osc.frequency.exponentialRampToValueAtTime(920, now + 0.05);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.start(now);
          osc.stop(now + 0.06);
        } else if (type === 'hit') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(190, now);
          osc.frequency.exponentialRampToValueAtTime(55, now + 0.11);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'combo') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(760, now + 0.22);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.start(now);
          osc.stop(now + 0.24);
        } else if (type === 'ult') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.35);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          osc.start(now);
          osc.stop(now + 0.38);
        } else if (type === 'coin') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(980, now);
          osc.frequency.setValueAtTime(1320, now + 0.06);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.start(now);
          osc.stop(now + 0.16);
        } else if (type === 'error') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.setValueAtTime(120, now + 0.08);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.start(now);
          osc.stop(now + 0.16);
        }
      }
    }

    function getHeroSpec(lineageId, tier) {
      const lin = LINEAGES.find(l => l.id === lineageId) || LINEAGES[0];
      const t = TIERS[tier] || TIERS[0];
      return {
        key: `${lin.id}_${tier}`,
        lineageId: lin.id,
        nation: lin.nation,
        role: lin.role,
        elem: ELEMENTS[lin.elem],
        tier,
        code: t.code,
        tierLabel: t.label,
        name: lin.names[tier],
        coat: lin.coat,
        trim: lin.trim,
        hat: lin.hat,
        weapon: lin.weapon,
        beard: lin.beard || 'none',
        female: !!lin.female,
        skills: lin.skills,
        baseHp: Math.round(lin.hp * t.mult),
        baseAtk: Math.round(lin.atk * t.mult),
        baseDef: Math.round(lin.def * t.mult)
      };
    }

    /**
     * =========================================================================
     * 3. HIGH-DETAIL PROCEDURAL PORTRAIT ARTIST (With Custom Image Override)
     * =========================================================================
     */
    class HeroArtist {
      constructor() {
        this.cache = new Map();
        this.customImages = new Map();
      }

      setCustomImage(lineageId, dataUrl) {
        if (!dataUrl) return;
        const img = new Image();
        img.onload = () => {
          this.customImages.set(lineageId, img);
          this.cache.clear();
        };
        img.src = dataUrl;
      }

      getCanvas(spec) {
        const cacheKey = `${spec.key}_${this.customImages.has(spec.lineageId) ? 'c' : 'p'}`;
        if (this.cache.has(cacheKey)) return this.cache.get(cacheKey);

        const c = document.createElement('canvas');
        c.width = 128;
        c.height = 144;
        const ctx = c.getContext('2d');

        if (this.customImages.has(spec.lineageId)) {
          const img = this.customImages.get(spec.lineageId);
          ctx.drawImage(img, 0, 0, c.width, c.height);
        } else {
          this.paintHero(ctx, c.width, c.height, spec);
        }

        this.cache.set(cacheKey, c);
        return c;
      }

      drawTo(canvasEl, spec) {
        if (!canvasEl || !spec) return;
        const src = this.getCanvas(spec);
        const ctx = canvasEl.getContext('2d');
        ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
        ctx.drawImage(src, 0, 0, canvasEl.width, canvasEl.height);
      }

      paintHero(ctx, w, h, spec) {
        const cx = w * 0.5;
        const cy = h * 0.52;

        // Luminous Oriental Aura Backdrop
        const bg = ctx.createRadialGradient(cx, cy * 0.8, 8, cx, cy, w * 0.85);
        if (spec.tier === 3) {
          bg.addColorStop(0, '#fef9c3');
          bg.addColorStop(0.45, '#f59e0b');
          bg.addColorStop(1, '#7c2d12');
        } else if (spec.tier === 2) {
          bg.addColorStop(0, '#f3e8ff');
          bg.addColorStop(0.5, '#7e22ce');
          bg.addColorStop(1, '#1e1b4b');
        } else if (spec.tier === 1) {
          bg.addColorStop(0, '#e0f2fe');
          bg.addColorStop(0.55, '#0369a1');
          bg.addColorStop(1, '#0f172a');
        } else {
          bg.addColorStop(0, '#f1f5f9');
          bg.addColorStop(1, '#334155');
        }
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);

        // Sacred Mandala Halo for Awakened / SR+
        if (spec.tier >= 1) {
          ctx.save();
          ctx.translate(cx, cy - 8);
          ctx.strokeStyle = spec.tier === 3 ? 'rgba(254, 240, 138, 0.9)' : 'rgba(255, 255, 255, 0.45)';
          ctx.lineWidth = spec.tier === 3 ? 3 : 2;
          ctx.beginPath();
          ctx.arc(0, 0, 44, 0, Math.PI * 2);
          ctx.stroke();
          if (spec.tier >= 2) {
            for (let i = 0; i < 8; i++) {
              const a = (i * Math.PI) / 4;
              ctx.beginPath();
              ctx.moveTo(Math.cos(a) * 38, Math.sin(a) * 38);
              ctx.lineTo(Math.cos(a) * 49, Math.sin(a) * 49);
              ctx.stroke();
            }
          }
          ctx.restore();
        }

        // Weapon Silhouette Behind Shoulder
        ctx.save();
        ctx.strokeStyle = spec.trim;
        ctx.fillStyle = '#e2e8f0';
        ctx.lineWidth = 3;
        if (spec.weapon === 'glaive' || spec.weapon === 'sword') {
          ctx.beginPath();
          ctx.moveTo(w * 0.78, h * 0.14);
          ctx.lineTo(w * 0.24, h * 0.92);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(w * 0.78, h * 0.14);
          ctx.quadraticCurveTo(w * 0.92, h * 0.24, w * 0.72, h * 0.34);
          ctx.fill();
        } else if (spec.weapon === 'bow') {
          ctx.beginPath();
          ctx.arc(w * 0.75, h * 0.5, 42, -Math.PI * 0.45, Math.PI * 0.45);
          ctx.stroke();
        } else if (spec.weapon === 'lute') {
          ctx.fillStyle = '#d97706';
          ctx.beginPath();
          ctx.ellipse(w * 0.74, h * 0.58, 14, 22, 0.35, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Ornate Armor & Royal Robe
        const robeGrad = ctx.createLinearGradient(0, h * 0.55, 0, h);
        robeGrad.addColorStop(0, spec.coat);
        robeGrad.addColorStop(1, '#0f172a');
        ctx.fillStyle = robeGrad;
        ctx.beginPath();
        ctx.moveTo(cx - 46, h);
        ctx.quadraticCurveTo(cx - 42, h * 0.62, cx, h * 0.60);
        ctx.quadraticCurveTo(cx + 42, h * 0.62, cx + 46, h);
        ctx.fill();

        // Gold Pauldrons & Collar Trim
        ctx.strokeStyle = spec.trim;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(cx - 38, h * 0.74);
        ctx.quadraticCurveTo(cx, h * 0.56, cx + 38, h * 0.74);
        ctx.stroke();

        // Chest Medallion
        ctx.fillStyle = spec.trim;
        ctx.beginPath();
        ctx.arc(cx, h * 0.78, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = spec.elem.color;
        ctx.beginPath();
        ctx.arc(cx, h * 0.78, 5, 0, Math.PI * 2);
        ctx.fill();

        // 3D Shaded Face
        const faceGrad = ctx.createRadialGradient(cx - 6, cy - 8, 3, cx, cy, 28);
        faceGrad.addColorStop(0, spec.female ? '#fff5eb' : '#fad7b8');
        faceGrad.addColorStop(0.72, spec.female ? '#f2c5a0' : '#d69765');
        faceGrad.addColorStop(1, '#854d27');
        ctx.fillStyle = faceGrad;
        ctx.beginPath();
        ctx.ellipse(cx, cy - 2, 20, 24, 0, 0, Math.PI * 2);
        ctx.fill();

        // Expressive Eyes & Brows
        ctx.fillStyle = '#1e1b18';
        ctx.beginPath();
        ctx.moveTo(cx - 14, cy - 8); ctx.lineTo(cx - 4, cy - 5); ctx.lineTo(cx - 4, cy - 8); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx + 14, cy - 8); ctx.lineTo(cx + 4, cy - 5); ctx.lineTo(cx + 4, cy - 8); ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(cx - 8, cy - 2, 3.5, 0, Math.PI * 2);
        ctx.arc(cx + 8, cy - 2, 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#090a0f';
        ctx.beginPath();
        ctx.arc(cx - 8, cy - 2, 2.0, 0, Math.PI * 2);
        ctx.arc(cx + 8, cy - 2, 2.0, 0, Math.PI * 2);
        ctx.fill();

        // Beard / Lips
        if (spec.female) {
          ctx.fillStyle = '#e11d48';
          ctx.beginPath();
          ctx.ellipse(cx, cy + 11, 4, 2, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (spec.beard === 'long') {
          ctx.fillStyle = '#1c1917';
          ctx.beginPath();
          ctx.moveTo(cx - 13, cy + 8);
          ctx.quadraticCurveTo(cx, cy + 52, cx + 13, cy + 8);
          ctx.fill();
        } else if (spec.beard === 'full') {
          ctx.fillStyle = '#334155';
          ctx.beginPath();
          ctx.moveTo(cx - 14, cy + 7);
          ctx.quadraticCurveTo(cx, cy + 34, cx + 14, cy + 7);
          ctx.fill();
        } else if (spec.beard === 'goatee') {
          ctx.fillStyle = '#334155';
          ctx.beginPath();
          ctx.moveTo(cx - 5, cy + 12);
          ctx.lineTo(cx, cy + 26);
          ctx.lineTo(cx + 5, cy + 12);
          ctx.fill();
        }

        // Headgear (Crown / General Helmet / Kabuto / Scholar Hat)
        ctx.fillStyle = spec.trim;
        if (spec.hat === 'crown') {
          ctx.beginPath();
          ctx.moveTo(cx - 19, cy - 17);
          ctx.lineTo(cx - 15, cy - 40);
          ctx.lineTo(cx - 6, cy - 26);
          ctx.lineTo(cx, cy - 44);
          ctx.lineTo(cx + 6, cy - 26);
          ctx.lineTo(cx + 15, cy - 40);
          ctx.lineTo(cx + 19, cy - 17);
          ctx.fill();
        } else if (spec.hat === 'kabuto') {
          ctx.fillStyle = '#1c1917';
          ctx.beginPath();
          ctx.arc(cx, cy - 16, 21, Math.PI, 0);
          ctx.fill();
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.arc(cx, cy - 30, 16, 0.15 * Math.PI, 0.85 * Math.PI);
          ctx.stroke();
        } else if (spec.hat === 'scholar') {
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(cx - 22, cy - 22, 44, 6);
          ctx.fillRect(cx - 13, cy - 36, 26, 15);
        } else {
          ctx.beginPath();
          ctx.arc(cx, cy - 16, 21, Math.PI, 0);
          ctx.fill();
          ctx.fillStyle = '#dc2626';
          ctx.beginPath();
          ctx.ellipse(cx, cy - 40, 5, 11, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

        this.hitstop = 0;
        this.banner = null;
        this.tick = 0;
        this.lastTs = performance.now();

        this.spawnWave();
        this.bindInputs();
        this.renderAll();

        requestAnimationFrame(ts => this.loop(ts));
      }

      saveState() {
        try {
          localStorage.setItem('gersang_v3_save', JSON.stringify(this.state));
        } catch (e) {}
      }

      loadSavedState() {
        try {
          const raw = localStorage.getItem('gersang_v3_save');
          if (!raw) return;
          const saved = JSON.parse(raw);
          if (saved && Array.isArray(saved.roster) && saved.roster.length > 0) {
            this.state = { ...this.state, ...saved };
          }
        } catch (e) {}
      }

      loadSavedMedia() {
        try {
          const savedBg = localStorage.getItem('gersang_v2_bg');
          if (savedBg) {
            const img = new Image();
            img.onload = () => { this.customBgImg = img; };
            img.src = savedBg;
          }
          LINEAGES.forEach(l => {
            const dataUrl = localStorage.getItem(`gersang_v2_hero_${l.id}`);
            if (dataUrl) this.artist.setCustomImage(l.id, dataUrl);
          });
        } catch (e) {}
      }

      bindInputs() {
        const heroInput = document.getElementById('heroImgInput');
        heroInput.addEventListener('change', e => {
          const file = e.target.files && e.target.files[0];
          if (!file || !this._uploadHeroLineage) return;
          const reader = new FileReader();
          reader.onload = ev => {
            const url = ev.target.result;
            this.artist.setCustomImage(this._uploadHeroLineage, url);
            try { localStorage.setItem(`gersang_v2_hero_${this._uploadHeroLineage}`, url); } catch (err) {}
            this.toast('📷 영웅 커스텀 일러스트 적용 완료!');
            this.renderAll();
          };
          reader.readAsDataURL(file);
          heroInput.value = '';
        });

        const bgInput = document.getElementById('bgImgInput');
        bgInput.addEventListener('change', e => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = ev => {
            const url = ev.target.result;
            const img = new Image();
            img.onload = () => {
              this.customBgImg = img;
              try { localStorage.setItem('gersang_v2_bg', url); } catch (err) {}
              this.toast('🏞️ 전장 커스텀 배경 적용 완료!');
            };
            img.src = url;
          };
          reader.readAsDataURL(file);
          bgInput.value = '';
        });
      }

      toast(msg) {
        const box = document.getElementById('toastBox');
        if (!box) return;
        const el = document.createElement('div');
        el.className = 'px-3 py-1 rounded-full bg-[#1e3a34]/95 text-amber-200 border border-amber-400 text-[11px] font-extrabold shadow-lg';
        el.textContent = msg;
        box.appendChild(el);
        setTimeout(() => el.remove(), 2200);
      }

      /**
       * Real-time Synergy Calculator
       */
      getActiveSynergies() {
        const nations = {};
        const roles = new Set();

        this.state.party.forEach(uid => {
          const h = this.state.roster.find(r => r.uid === uid);
          if (!h) return;
          const lin = LINEAGES.find(l => l.id === h.lineageId);
          if (!lin) return;
          nations[lin.nation] = (nations[lin.nation] || 0) + 1;
          roles.add(lin.role);
        });

        const list = SYNERGY_RULES.map(rule => {
          const cur = rule.type === 'nation' ? (nations[rule.target] || 0) : roles.size;
          return { ...rule, cur, active: cur >= rule.req };
        });

        const active = list.filter(s => s.active);
        const totals = active.reduce((acc, s) => ({
          atk: acc.atk + s.atk,
          def: acc.def + s.def,
          crit: acc.crit + s.crit,
          dmg: acc.dmg + s.dmg
        }), { atk: 0, def: 0, crit: 0, dmg: 0 });

        return { list, active, totals };
      }

      computeHero(heroObj) {
        const spec = getHeroSpec(heroObj.lineageId, heroObj.tier);
        const syn = this.getActiveSynergies().totals;
        const lvMult = 1 + (heroObj.lv - 1) * 0.14;
        const starMult = 1 + ((heroObj.stars || 1) - 1) * 0.18;

        const wBonus = this.state.gear.weapon * 45;
        const aBonus = this.state.gear.armor * 240;
        const rBonus = this.state.gear.relic * 30;

        const maxHp = Math.round(spec.baseHp * lvMult * starMult + aBonus);
        const atk = Math.round((spec.baseAtk * lvMult * starMult + wBonus + rBonus) * (1 + syn.atk));
        const def = Math.round((spec.baseDef * lvMult * starMult + this.state.gear.armor * 18) * (1 + syn.def));

        return { ...spec, ...heroObj, maxHp, atk, def, syn };
      }

      spawnWave() {
        const diff = DIFFICULTIES[this.state.diffIdx] || DIFFICULTIES[0];
        const prevHpMap = new Map(this.allies.map(a => [a.uid, a.hp]));

        this.allies = this.state.party
          .map(uid => this.state.roster.find(r => r.uid === uid))
          .filter(Boolean)
          .map((h, idx) => {
            const c = this.computeHero(h);
            const savedHp = prevHpMap.get(h.uid);
            return {
              ...c,
              side: 'ally',
              hp: savedHp && savedHp > 0 ? Math.min(c.maxHp, savedHp) : c.maxHp,
              x: 60,
              y: 120,
              lunge: 0,
              flash: 0,
              buffTimer: 0,
              cds: [0.4 + idx * 0.25, 2.0 + idx * 0.35, 3.8 + idx * 0.5]
            };
          });

        const totalStage = (this.state.chapter - 1) * 10 + this.state.stage;
        const isStageBoss = this.state.stage === 10 && this.state.wave === 5;
        const isWaveBoss = this.state.wave === 5;
        const count = isWaveBoss ? 1 : 3;

        const chTheme = CHAPTER_THEMES[(this.state.chapter - 1) % CHAPTER_THEMES.length];
        const hpGrowth = Math.pow(1.28, totalStage - 1) * (1 + (this.state.wave - 1) * 0.14);
        const atkGrowth = Math.pow(1.20, totalStage - 1) * (1 + (this.state.wave - 1) * 0.10);

        const enemyPool = [
          { name: `${chTheme.title} 백호`, kind: 'tiger', hp: 620, atk: 34 },
          { name: `${chTheme.title} 정예병`, kind: 'warrior', hp: 570, atk: 30 },
          { name: `${chTheme.title} 요괴술사`, kind: 'demon', hp: 600, atk: 32 }
        ];

        this.enemies = [];
        for (let i = 0; i < count; i++) {
          const tpl = isWaveBoss
            ? {
                name: isStageBoss
                  ? `👑 ${this.state.chapter}-${this.state.stage} ${chTheme.bossPrefix}`
                  : `👹 ${this.state.chapter}-${this.state.stage} 수문장`,
                kind: 'boss',
                hp: isStageBoss ? 3600 : 2500,
                atk: isStageBoss ? 68 : 54
              }
            : enemyPool[i % enemyPool.length];

          const maxHp = Math.max(120, Math.round(tpl.hp * hpGrowth * diff.hpMult));
          const def = Math.round((16 + totalStage * 8 + diff.defBonus) * (isWaveBoss ? 1.4 : 1.0));
          const atk = Math.max(12, Math.round(tpl.atk * atkGrowth * diff.atkMult));
          const shieldMax = isStageBoss ? 140 : (isWaveBoss ? 100 : 48);

          this.enemies.push({
            name: tpl.name,
            kind: tpl.kind,
            isBoss: isWaveBoss,
            side: 'enemy',
            maxHp,
            hp: maxHp,
            def,
            atk,
            shieldMax,
            shield: shieldMax,
            brokenTimer: 0,
            aura: null,
            x: 260,
            y: 120,
            lunge: 0,
            flash: 0,
            cd: 0.5 + i * 0.35
          });
        }

        this.renderHeroSkillDock();
        this.updateTopHud();
      }

      applyElementalCombo(en, elemId, scaledDmg) {
        let extra = 0;
        if (!en.aura) {
          en.aura = elemId;
          en.shield -= 12;
        } else if (en.aura !== elemId) {
          const pair = [en.aura, elemId].sort().join('+');
          en.aura = null;
          let label = '☀️ 천벌 성광폭발!';
          let color = '#d97706';

          if (pair === 'fire+lightning') {
            label = '💥 과부하 대폭발!';
            color = '#ea580c';
            extra = Math.round(scaledDmg * 1.45);
            en.shield -= 34;
          } else if (pair === 'lightning+water') {
            label = '❄️ 초전도 빙결!';
            color = '#0284c7';
            extra = Math.round(scaledDmg * 1.30);
            en.brokenTimer = Math.max(en.brokenTimer, 2.3);
            en.shield -= 28;
          } else if (pair === 'fire+water') {
            label = '💨 증발 연쇄일격!';
            color = '#0369a1';
            extra = Math.round(scaledDmg * 1.35);
            en.shield -= 26;
          } else {
            extra = Math.round(scaledDmg * 1.60);
            en.shield -= 38;
          }

          this.sfx.play('combo');
          this.shake = Math.max(this.shake, 9);
          this.floats.push({ x: en.x, y: en.y - 44, text: label, color, life: 1.05 });
        } else {
          en.shield -= 14;
        }

        if (en.shield <= 0 && en.brokenTimer <= 0) {
          en.shield = en.shieldMax;
          en.brokenTimer = 3.2;
          this.shake = 12;
          this.hitstop = 0.045;
          this.floats.push({ x: en.x, y: en.y - 56, text: '🛡️ 강인도 파괴! (피해 2배)', color: '#dc2626', life: 1.2 });
        }

        return extra;
      }

      castSkill(caster, slotIdx, isManual = false) {
        const sk = caster.skills[slotIdx];
        if (!sk) return;
        if (isManual && caster.cds[slotIdx] > 0) {
          this.toast(`${caster.name} 궁극기 충전 중 (${caster.cds[slotIdx].toFixed(1)}초)`);
          return;
        }

        caster.cds[slotIdx] = sk.cd;
        caster.lunge = slotIdx === 2 ? 24 : 13;
        this.chainGauge = Math.min(100, this.chainGauge + (slotIdx === 2 ? 24 : 8));

        if (slotIdx === 2) {
          this.sfx.play('ult');
          this.shake = 10 + caster.tier * 2;
          this.hitstop = 0.04;
          this.banner = { text: `${caster.elem.icon} ${caster.name} · ${sk.name}!`, life: 1.1 };
        } else {
          this.sfx.play('hit');
        }

        const syn = caster.syn || this.getActiveSynergies().totals;
        const buffMult = caster.buffTimer > 0 ? 1.3 : 1.0;
        const power = caster.atk * sk.mult * buffMult * (1 + syn.dmg);

        if (sk.type === 'heal' || sk.type === 'ult_heal') {
          this.allies.forEach(a => {
            const heal = Math.round(power * 1.15);
            a.hp = Math.min(a.maxHp, a.hp + heal);
            this.floats.push({ x: a.x, y: a.y - 32, text: `+${heal.toLocaleString()}`, color: '#15803d', life: 0.85 });
            this.vfx.push({ x: a.x, y: a.y - 12, color: '#22c55e', r: 8, maxR: 34, life: 0.36, ult: slotIdx === 2 });
          });
        } else if (sk.type === 'buff') {
          this.allies.forEach(a => {
            a.buffTimer = 5.0;
            this.floats.push({ x: a.x, y: a.y - 34, text: '전술 고양!', color: '#0369a1', life: 0.85 });
            this.vfx.push({ x: a.x, y: a.y - 12, color: '#38bdf8', r: 8, maxR: 32, life: 0.35, ult: false });
          });
        } else {
          const targets = (sk.type === 'aoe' || slotIdx === 2) ? this.enemies : [this.enemies[0]].filter(Boolean);
          targets.forEach(en => {
            if (!en || en.hp <= 0) return;
            const mitigation = 100 / (100 + en.def);
            const breakMult = en.brokenTimer > 0 ? 2.0 : 1.0;
            const crit = Math.random() < 0.28 || slotIdx === 2;
            const critMult = crit ? (1.5 + syn.crit) : 1.0;

            const comboDmg = this.applyElementalCombo(en, caster.elem.id, power * mitigation);
            const finalDmg = Math.max(1, Math.round(power * mitigation * critMult * breakMult + comboDmg));

            en.hp -= finalDmg;
            en.flash = 0.16;
            en.lunge = -6;

            this.floats.push({
              x: en.x + (Math.random() - 0.5) * 16,
              y: en.y - 28,
              text: `${crit ? '⚡' : ''}-${finalDmg.toLocaleString()}`,
              color: crit ? '#b45309' : caster.elem.color,
              life: 0.85
            });
            this.vfx.push({
              x: en.x,
              y: en.y - 14,
              color: caster.elem.color,
              r: 10,
              maxR: slotIdx === 2 ? 52 : 28,
              life: 0.36,
              ult: slotIdx === 2
            });
          });
        }
      }

      triggerChainUlt() {
        if (this.chainGauge < 100) {
          this.sfx.play('error');
          this.toast(`공명 게이지가 100%가 되면 발동됩니다! (현재 ${Math.floor(this.chainGauge)}%)`);
          return;
        }
        this.chainGauge = 0;
        this.sfx.play('ult');
        this.shake = 18;
        this.hitstop = 0.06;
        this.banner = { text: '🔥⚡🌊✨ 천지개벽 · 4인 협동 연쇄 필살기!!', life: 1.5 };

        this.allies.forEach(ally => {
          ally.cds[2] = 0;
          this.castSkill(ally, 2, false);
        });
      }

      loop(ts) {
        const dt = Math.min(0.05, (ts - this.lastTs) / 1000);
        this.lastTs = ts;
        this.tick += dt * 60;

        this.update(dt);
        this.renderBattle();
        requestAnimationFrame(nextTs => this.loop(nextTs));
      }

      update(dt) {
        if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 34);
        if (this.banner) {
          this.banner.life -= dt;
          if (this.banner.life <= 0) this.banner = null;
        }

        // Ambient clouds & cherry blossom petals
        this.clouds.forEach(c => {
          c.x += c.v * dt;
          if (c.x > 1.15) c.x = -0.15;
        });
        this.petals.forEach(p => {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.x < -10) p.x = 490;
          if (p.y > 270) { p.y = -10; p.x = Math.random() * 480; }
        });

        // Trade caravan passive loop
        const tr = this.state.trade;
        const route = TRADE_ROUTES[tr.routeIdx] || TRADE_ROUTES[0];
        if (tr.running) {
          tr.progress += dt;
          if (tr.progress >= route.time) {
            tr.progress = 0;
            this.state.silver += route.silver;
            this.state.gems += route.gems;
            this.sfx.play('coin');
            this.toast(`${route.icon} 상단 정산! +${route.silver.toLocaleString()}🪙 · +${route.gems}💎`);
            if (!tr.auto) tr.running = false;
            this.updateTopHud();
          }
          const bar = document.getElementById('tradeProgressBar');
          if (bar) bar.style.width = `${Math.min(100, (tr.progress / route.time) * 100)}%`;
        }

        // Auto-dungeon exploration
        if (this.state.dungeon.auto) {
          this._dunTimer = (this._dunTimer || 0) + dt;
          if (this._dunTimer >= 1.1) {
            this._dunTimer = 0;
            this.autoStepDungeon();
          }
        }

        if (this.hitstop > 0) {
          this.hitstop -= dt;
          return;
        }

        // Update Chain Ultimate Button
        const chainBtn = document.getElementById('btnChainUlt');
        const chainPct = document.getElementById('uiChainPct');
        if (chainBtn && chainPct) {
          const pct = Math.floor(this.chainGauge);
          chainPct.textContent = pct >= 100 ? '지금 발동 가능!' : `공명 ${pct}%`;
          if (pct >= 100) {
            chainBtn.classList.add('chain-ready');
            chainBtn.style.background = 'linear-gradient(135deg, #dc2626 0%, #d97706 100%)';
            chainBtn.style.color = '#ffffff';
          } else {
            chainBtn.classList.remove('chain-ready');
            chainBtn.style.background = 'rgba(30, 58, 52, 0.9)';
            chainBtn.style.color = '#fde68a';
          }
        }

        // Allies AI & Cooldowns
        this.allies.forEach((ally, idx) => {
          if (ally.lunge > 0) ally.lunge = Math.max(0, ally.lunge - dt * 65);
          if (ally.flash > 0) ally.flash = Math.max(0, ally.flash - dt);
          if (ally.buffTimer > 0) ally.buffTimer -= dt;

          for (let s = 0; s < 3; s++) {
            if (ally.cds[s] > 0) ally.cds[s] = Math.max(0, ally.cds[s] - dt);
          }

          if (this.enemies.length > 0) {
            if (this.state.autoBattle && ally.cds[2] <= 0) this.castSkill(ally, 2, false);
            else if (ally.cds[1] <= 0) this.castSkill(ally, 1, false);
            else if (ally.cds[0] <= 0) this.castSkill(ally, 0, false);
          }

          const cdOverlay = document.getElementById(`heroCd_${idx}`);
          const sk = ally.skills[2];
          if (cdOverlay && sk) {
            const ratio = Math.max(0, Math.min(1, ally.cds[2] / sk.cd));
            cdOverlay.style.height = `${Math.round(ratio * 100)}%`;
          }
        });

        // Enemies AI
        this.enemies.forEach(en => {
          if (en.lunge !== 0) en.lunge += (0 - en.lunge) * Math.min(1, dt * 15);
          if (en.flash > 0) en.flash = Math.max(0, en.flash - dt);
          if (en.brokenTimer > 0) {
            en.brokenTimer -= dt;
            return;
          }
          en.cd += dt;
          if (en.cd >= 1.35 && this.allies.length > 0) {
            en.cd = 0;
            en.lunge = 14;
            const target = this.allies[Math.floor(Math.random() * this.allies.length)];
            const mit = 100 / (100 + target.def);
            const dmg = Math.max(1, Math.round(en.atk * mit));
            target.hp = Math.max(1, target.hp - dmg);
            target.flash = 0.14;
          }
        });

        // Check Enemy Defeats
        const alive = this.enemies.filter(e => e.hp > 0);
        if (alive.length < this.enemies.length) {
          const killed = this.enemies.length - alive.length;
          const diff = DIFFICULTIES[this.state.diffIdx] || DIFFICULTIES[0];
          const totalStage = (this.state.chapter - 1) * 10 + this.state.stage;
          const stageRewardMult = 1 + (totalStage - 1) * 0.22;

          this.state.silver += Math.round(240 * stageRewardMult * diff.rewardMult * killed);
          this.state.gems += Math.round(18 * (1 + this.state.diffIdx * 0.55) * killed);
          if (Math.random() < 0.32) this.state.awaken += 1;

          this.enemies = alive;
          this.updateTopHud();
        }

        if (this.enemies.length === 0) {
          if (this.state.wave < this.state.waveGoal) {
            this.state.wave += 1;
          } else {
            // Stage Cleared!
            const diff = DIFFICULTIES[this.state.diffIdx] || DIFFICULTIES[0];
            const clearBonus = Math.round(1200 * diff.rewardMult);
            this.state.silver += clearBonus;
            this.state.gems += 40 + this.state.diffIdx * 20;

            if (this.state.autoStage) {
              this.state.wave = 1;
              this.state.stage += 1;
              if (this.state.stage > 10) {
                this.state.stage = 1;
                this.state.chapter += 1;
                this.toast(`🏯 제${this.state.chapter}장 신규 지역 개방!`);
              }
              const curTotal = (this.state.chapter - 1) * 10 + this.state.stage;
              const maxTotal = (this.state.maxChapter - 1) * 10 + this.state.maxStage;
              if (curTotal > maxTotal) {
                this.state.maxChapter = this.state.chapter;
                this.state.maxStage = this.state.stage;
              }
            } else {
              this.state.wave = 1;
            }
            this.saveState();
          }
          this.spawnWave();
        }

        for (let i = this.vfx.length - 1; i >= 0; i--) {
          this.vfx[i].life -= dt;
          if (this.vfx[i].life <= 0) this.vfx.splice(i, 1);
        }
        for (let i = this.floats.length - 1; i >= 0; i--) {
          this.floats[i].y -= dt * 26;
          this.floats[i].life -= dt;
          if (this.floats[i].life <= 0) this.floats.splice(i, 1);
        }
      }

      /**
       * =======================================================================
       * 5. HIGH-DENSITY 2.5D DAYTIME BATTLE CANVAS RENDERER
       * =======================================================================
       */
      renderBattle() {
        const canvas = document.getElementById('battleCanvas');
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const cw = Math.max(300, Math.floor(rect.width));
        const ch = Math.max(200, Math.floor(rect.height));
        if (canvas.width !== cw || canvas.height !== ch) {
          canvas.width = cw;
          canvas.height = ch;
        }
        const ctx = canvas.getContext('2d');

        ctx.save();
        if (this.shake > 0) {
          ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
        }

        if (this.customBgImg) {
          ctx.drawImage(this.customBgImg, 0, 0, cw, ch);
          ctx.fillStyle = 'rgba(255, 250, 238, 0.14)';
          ctx.fillRect(0, 0, cw, ch);
        } else {
          // 1. Clear Daytime Azure Sky & Sunburst
          const sky = ctx.createLinearGradient(0, 0, 0, ch * 0.48);
          sky.addColorStop(0, '#0284c7');
          sky.addColorStop(0.5, '#7dd3fc');
          sky.addColorStop(1, '#fef9c3');
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, cw, ch * 0.48);

          const sunX = cw * 0.84, sunY = ch * 0.17;
          const sun = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 76);
          sun.addColorStop(0, 'rgba(255, 254, 240, 1)');
          sun.addColorStop(0.35, 'rgba(253, 224, 71, 0.55)');
          sun.addColorStop(1, 'rgba(253, 224, 71, 0)');
          ctx.fillStyle = sun;
          ctx.beginPath(); ctx.arc(sunX, sunY, 76, 0, Math.PI * 2); ctx.fill();

          // Drifting Clouds
          ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
          this.clouds.forEach(cl => {
            const x = cl.x * cw, y = cl.y * ch;
            ctx.beginPath();
            ctx.ellipse(x, y, 32 * cl.s, 9 * cl.s, 0, 0, Math.PI * 2);
            ctx.ellipse(x + 18 * cl.s, y - 3 * cl.s, 22 * cl.s, 8 * cl.s, 0, 0, Math.PI * 2);
            ctx.fill();
          });

          // 2. Distant Misty Emerald Mountain Ridges
          ctx.fillStyle = '#5eead4';
          ctx.beginPath();
          ctx.moveTo(0, ch * 0.46);
          ctx.lineTo(cw * 0.22, ch * 0.19);
          ctx.lineTo(cw * 0.48, ch * 0.34);
          ctx.lineTo(cw * 0.78, ch * 0.17);
          ctx.lineTo(cw, ch * 0.31);
          ctx.lineTo(cw, ch * 0.46);
          ctx.fill();

          ctx.fillStyle = '#0f766e';
          ctx.beginPath();
          ctx.moveTo(0, ch * 0.46);
          ctx.lineTo(cw * 0.16, ch * 0.28);
          ctx.lineTo(cw * 0.42, ch * 0.39);
          ctx.lineTo(cw * 0.70, ch * 0.24);
          ctx.lineTo(cw, ch * 0.40);
          ctx.lineTo(cw, ch * 0.46);
          ctx.fill();

          // 3. Joseon Fortress Gatehouse & Curved Tiled Roof (Left Background)
          const gx = cw * 0.19, gy = ch * 0.43;
          ctx.fillStyle = '#78716c';
          ctx.fillRect(gx - 34, gy - 20, 68, 20);
          ctx.fillStyle = '#292524';
          ctx.beginPath();
          ctx.arc(gx, gy, 8, Math.PI, 0);
          ctx.fill();
          // Curved Pavilion Roof
          ctx.fillStyle = '#1e293b';
          ctx.beginPath();
          ctx.moveTo(gx - 42, gy - 20);
          ctx.quadraticCurveTo(gx, gy - 29, gx + 42, gy - 20);
          ctx.lineTo(gx + 32, gy - 28);
          ctx.lineTo(gx - 32, gy - 28);
          ctx.fill();

          // 4. Warm Cobblestone Courtyard & Shimmering Jade River
          const gnd = ctx.createLinearGradient(0, ch * 0.42, 0, ch);
          gnd.addColorStop(0, '#fde68a');
          gnd.addColorStop(0.32, '#e6c89c');
          gnd.addColorStop(1, '#c29e6b');
          ctx.fillStyle = gnd;
          ctx.fillRect(0, ch * 0.42, cw, ch * 0.58);

          // Jade River on the Right
          const river = ctx.createLinearGradient(cw * 0.72, ch * 0.42, cw, ch * 0.65);
          river.addColorStop(0, '#14b8a6');
          river.addColorStop(1, '#0d9488');
          ctx.fillStyle = river;
          ctx.beginPath();
          ctx.moveTo(cw * 0.76, ch * 0.42);
          ctx.quadraticCurveTo(cw * 0.67, ch * 0.53, cw * 0.85, ch * 0.64);
          ctx.lineTo(cw, ch * 0.64);
          ctx.lineTo(cw, ch * 0.42);
          ctx.fill();

          // Shimmering Water Ripples
          ctx.strokeStyle = 'rgba(254, 249, 195, 0.55)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(cw * 0.82, ch * 0.49); ctx.lineTo(cw * 0.93, ch * 0.49);
          ctx.moveTo(cw * 0.79, ch * 0.55); ctx.lineTo(cw * 0.91, ch * 0.55);
          ctx.stroke();
        }

        // Sacred Golden/Jade Battle Formation Circle
        ctx.save();
        ctx.translate(cw * 0.5, ch * 0.58);
        ctx.scale(1, 0.34);
        ctx.strokeStyle = 'rgba(217, 119, 6, 0.38)';
        ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.arc(0, 0, cw * 0.37, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();

        // 5. Non-Overlapping Tactical Positioning (Safe Zone between Top HUD and Bottom Skill Dock)
        const arenaTop = Math.max(46, ch * 0.43);
        const arenaBot = ch - 68;
        const spanY = Math.max(44, arenaBot - arenaTop);

        this.allies.forEach((a, i) => {
          const col = i % 2;
          const row = Math.floor(i / 2);
          const bx = cw * (col === 0 ? 0.14 : 0.28);
          const by = arenaTop + spanY * (0.26 + row * 0.48 + col * 0.10);
          a.x = bx + (a.lunge || 0);
          a.y = by;
        });

        this.enemies.forEach((en, i) => {
          const cnt = this.enemies.length;
          const bx = en.isBoss ? cw * 0.78 : cw * (i % 2 === 0 ? 0.71 : 0.85);
          const by = en.isBoss
            ? arenaTop + spanY * 0.52
            : arenaTop + spanY * (0.22 + (i / Math.max(1, cnt - 1)) * 0.56);
          en.x = bx - (en.lunge || 0);
          en.y = by;
        });

        // 6. Render Allies & Enemies Sorted by Y-Depth
        const renderList = [...this.allies, ...this.enemies].sort((a, b) => a.y - b.y);
        renderList.forEach(u => {
          const sc = u.isBoss ? 1.24 : 0.98;
          const bob = u.brokenTimer > 0 ? 0 : Math.sin(this.tick * 0.12 + u.y) * 2.2;

          ctx.save();
          ctx.translate(u.x, u.y + bob);

          // Glowing Pedestal Magic Circle
          ctx.save();
          ctx.scale(1, 0.35);
          ctx.fillStyle = u.side === 'enemy' ? 'rgba(220, 38, 38, 0.26)' : 'rgba(245, 158, 11, 0.34)';
          ctx.beginPath(); ctx.arc(0, 8, 22 * sc, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = u.side === 'enemy' ? (u.brokenTimer > 0 ? '#0284c7' : '#dc2626') : '#d97706';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 8, 20 * sc, 0, Math.PI * 2); ctx.stroke();
          ctx.restore();

          // Hero Card / Monster Standee
          const cardW = 34 * sc;
          const cardH = 40 * sc;
          const x0 = -cardW / 2;
          const y0 = -cardH + 4;

          ctx.save();
          ctx.beginPath();
          ctx.roundRect(x0, y0, cardW, cardH, 8);
          ctx.clip();

          if (u.side === 'ally') {
            const heroImg = this.artist.getCanvas(u);
            ctx.drawImage(heroImg, x0, y0, cardW, cardH);
          } else {
            const eGrad = ctx.createLinearGradient(x0, y0, x0, y0 + cardH);
            eGrad.addColorStop(0, u.isBoss ? '#991b1b' : '#78350f');
            eGrad.addColorStop(1, '#1c1917');
            ctx.fillStyle = eGrad;
            ctx.fillRect(x0, y0, cardW, cardH);

            ctx.font = `${Math.round(20 * sc)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const icon = u.isBoss ? '👹' : (u.kind === 'tiger' ? '🐯' : (u.kind === 'demon' ? '👺' : '⚔️'));
            ctx.fillText(icon, 0, y0 + cardH * 0.52);
          }

          if (u.flash > 0) {
            ctx.fillStyle = 'rgba(239, 68, 68, 0.55)';
            ctx.fillRect(x0, y0, cardW, cardH);
          }
          ctx.restore();

          // Frame Border
          ctx.strokeStyle = u.side === 'enemy' ? '#ef4444' : (u.tier === 3 ? '#f59e0b' : '#ffffff');
          ctx.lineWidth = (u.tier === 3 || u.isBoss) ? 2.4 : 1.6;
          ctx.beginPath();
          ctx.roundRect(x0, y0, cardW, cardH, 8);
          ctx.stroke();

          // Element Badge on Ally Card
          if (u.side === 'ally') {
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(u.elem.icon, x0 + 2, y0 + 10);
          }

          // HP & Toughness Shield Bar
          const barY = y0 - 6;
          const barW = 36 * sc;
          ctx.fillStyle = 'rgba(28, 25, 23, 0.85)';
          ctx.beginPath();
          ctx.roundRect(-barW / 2 - 1, barY - 1, barW + 2, u.side === 'enemy' ? 7.2 : 5.2, 3);
          ctx.fill();

          ctx.fillStyle = u.side === 'ally' ? '#16a34a' : '#dc2626';
          ctx.fillRect(-barW / 2, barY, barW * Math.max(0, u.hp / u.maxHp), 3.4);

          if (u.side === 'enemy') {
            ctx.fillStyle = u.brokenTimer > 0 ? '#0284c7' : '#f59e0b';
            const shRatio = u.brokenTimer > 0 ? 1 : Math.max(0, u.shield / u.shieldMax);
            ctx.fillRect(-barW / 2, barY + 4, barW * shRatio, 2);

            const auraIcon = u.aura ? ELEMENTS[u.aura].icon : '';
            const stunTxt = u.brokenTimer > 0 ? ' [기절!]' : '';
            ctx.font = '900 8.5px sans-serif';
            ctx.textAlign = 'center';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.6;
            ctx.strokeText(`${auraIcon}${u.name}${stunTxt}`, 0, barY - 3);
            ctx.fillStyle = u.brokenTimer > 0 ? '#0369a1' : (u.isBoss ? '#b91c1c' : '#1c1917');
            ctx.fillText(`${auraIcon}${u.name}${stunTxt}`, 0, barY - 3);
          }

          ctx.restore();
        });

        // 7. Drifting Cherry Blossom Petals
        ctx.save();
        ctx.fillStyle = 'rgba(255, 228, 230, 0.88)';
        this.petals.forEach(p => {
          ctx.beginPath();
          ctx.ellipse(p.x, p.y, p.r, p.r * 0.6, p.x * 0.05, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();

        // 8. Multi-layered Skill & Combo Particle Bursts
        this.vfx.forEach(v => {
          const prog = 1 - v.life / 0.36;
          ctx.save();
          const rad = v.r + (v.maxR - v.r) * Math.max(0, prog);
          ctx.strokeStyle = v.color;
          ctx.lineWidth = v.ult ? 4.5 : 2.6;
          ctx.beginPath();
          ctx.arc(v.x, v.y, rad, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        });

        // 9. Floating Damage & Elemental Reaction Text
        this.floats.forEach(ft => {
          ctx.save();
          ctx.globalAlpha = Math.min(1, ft.life * 1.6);
          ctx.font = '900 11.5px sans-serif';
          ctx.textAlign = 'center';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3.2;
          ctx.strokeText(ft.text, ft.x, ft.y);
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        });

        // 10. Ultimate Skill Cut-in Banner
        if (this.banner) {
          const by = ch * 0.21;
          ctx.save();
          ctx.globalAlpha = Math.min(1, this.banner.life * 2.4);
          const grad = ctx.createLinearGradient(0, by, cw, by);
          grad.addColorStop(0, 'rgba(185, 28, 28, 0.94)');
          grad.addColorStop(0.75, 'rgba(217, 119, 6, 0.92)');
          grad.addColorStop(1, 'rgba(217, 119, 6, 0)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, by, cw, 30);
          ctx.font = '900 11.5px sans-serif';
          ctx.fillStyle = '#fef9c3';
          ctx.textAlign = 'left';
          ctx.fillText(this.banner.text, 12, by + 19);
          ctx.restore();
        }

        ctx.restore();
      }

      /**
       * =======================================================================
       * 6. UI RENDERERS (HUD, SQUAD, GACHA, DUNGEON, MERCHANT, SYNERGY CODEX)
       * =======================================================================
       */
      updateTopHud() {
        document.getElementById('uiSilver').textContent = this.state.silver.toLocaleString();
        document.getElementById('uiGems').textContent = this.state.gems.toLocaleString();
        document.getElementById('uiAwaken').textContent = this.state.awaken.toLocaleString();

        const syn = this.getActiveSynergies();
        document.getElementById('uiSynCount').textContent = syn.active.length;

        const diff = DIFFICULTIES[this.state.diffIdx] || DIFFICULTIES[0];
        document.getElementById('btnDiff').textContent = `난이도: ${diff.short} ▾`;

        const chTheme = CHAPTER_THEMES[(this.state.chapter - 1) % CHAPTER_THEMES.length];
        document.getElementById('uiStageLabel').textContent = `${this.state.chapter}-${this.state.stage} ${chTheme.title} (${this.state.wave}/${this.state.waveGoal})`;
        const pct = Math.min(100, ((this.state.wave - 1) / this.state.waveGoal) * 100);
        document.getElementById('uiWaveBar').style.width = `${pct}%`;

        const autoStageBtn = document.getElementById('btnAutoStage');
        if (autoStageBtn) {
          autoStageBtn.textContent = this.state.autoStage ? '🔄 자동진행 ON' : '⏸️ 반복사냥';
          autoStageBtn.className = this.state.autoStage
            ? 'pointer-events-auto px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-700/95 text-amber-100 border border-emerald-900 shadow-xs'
            : 'pointer-events-auto px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-100/95 text-amber-950 border border-amber-500 shadow-xs';
        }
      }

      renderHeroSkillDock() {
        const dock = document.getElementById('heroSkillDock');
        if (!dock) return;
        dock.innerHTML = this.allies.map((a, idx) => `
          <button type="button" data-action="cast-ult" data-val="${idx}" class="relative w-11 h-11 rounded-full overflow-hidden border-2 rarity-${a.code} bg-[#fcf8ee] shadow-md active:scale-95" title="${a.name} 궁극기">
            <canvas id="dockAv_${idx}" width="44" height="44" class="w-full h-full block"></canvas>
            <div id="heroCd_${idx}" class="absolute bottom-0 left-0 right-0 bg-emerald-950/70 transition-all duration-100" style="height: 0%"></div>

          </button>
        `).join('');

        this.allies.forEach((a, idx) => {
          this.artist.drawTo(document.getElementById(`dockAv_${idx}`), a);
        });
      }

      renderAll() {
        this.updateTopHud();
        this.renderHeroSkillDock();

        ['squad', 'roster', 'summon', 'dungeon', 'merchant'].forEach(t => {
          const btn = document.getElementById(`tab-${t}`);
          if (!btn) return;
          if (t === this.state.tab) {
            btn.className = 'py-1.5 rounded-xl text-[11px] font-extrabold bg-[#1e3a34] text-amber-200 shadow';
          } else {
            btn.className = 'py-1.5 rounded-xl text-[11px] font-extrabold bg-[#fcf8ee] text-[#1e3a34] border border-amber-600/20';
          }
        });

        const body = document.getElementById('deckBody');
        if (!body) return;

        if (this.state.tab === 'squad') this.renderSquadTab(body);
        else if (this.state.tab === 'roster') this.renderRosterTab(body);
        else if (this.state.tab === 'summon') this.renderSummonTab(body);
        else if (this.state.tab === 'dungeon') this.renderDungeonTab(body);
        else if (this.state.tab === 'merchant') this.renderMerchantTab(body);
      }

                    ${nat.icon} ${nat.label} <span class="opacity-80">(${ownedInNat}/${totalInNat})</span>

              return `
                <div class="hanji-card p-2 flex flex-col justify-between border-2 ${owned ? `rarity-${spec.code}` : 'border-stone-300 opacity-75'}">
                  <div>
                    <!-- Top Nation & Role Header -->

                      <span class="px-1.5 py-0.5 rounded-full text-[9px] font-black bg-[#e6f0ec] text-[#1e3a34] border border-emerald-700/20">
                        ${natMeta.icon} ${lin.nation}
                      </span>
                      <span class="text-[9px] font-extrabold text-stone-600">${lin.role} · ${spec.elem.icon}</span>
                    </div>

                    <!-- Portrait + Name -->
                    <div class="flex items-center gap-2">
                      <div class="relative w-12 h-14 rounded-xl overflow-hidden border rarity-${spec.code} shrink-0 bg-stone-100">
                        <canvas id="natAv_${idx}" width="48" height="56" class="w-full h-full block ${owned ? '' : 'grayscale'}"></canvas>
                        <span class="absolute top-0 left-0 px-1 text-[8px] font-black bg-amber-500 text-white rounded-br">${spec.code}</span>
                      </div>
                      <div class="min-w-0 flex-1">
                        <div class="font-black text-xs truncate text-[#1e3a34]">${spec.name}</div>

                        ${owned ? `
                          <div class="text-[9.5px] font-extrabold text-emerald-800 mt-0.5">Lv.${owned.lv} · ${'★'.repeat(owned.stars || 1)}</div>

                          <div class="text-[9.5px] font-extrabold text-stone-400 mt-1">🔒 미보유 장수</div>

                    </div>

                  <!-- Bottom Action Row -->

                    ${owned ? `

      renderSummonTab(body) {
        const pityLeft = 80 - this.state.pity;
        body.innerHTML = `
          <div class="hanji-card p-3 flex flex-col gap-2.5">
            <div class="flex items-center justify-between">
              <div>
                <h3 class="font-black text-sm text-[#1e3a34]">🔮 천명 영웅 소환 제단</h3>

              </div>
              <span class="jade-pill bg-amber-100 border-amber-400 text-amber-900">천장까지 ${pityLeft}회</span>

              <div class="h-full bg-gradient-to-r from-emerald-500 via-amber-400 to-red-500 transition-all" style="width: ${(this.state.pity / 80) * 100}%"></div>
            </div>

          <!-- Owned Roster Bench for Deck Swapping -->
          <div class="hanji-card p-2">
            <div class="flex items-center justify-between mb-1.5">

              <button type="button" data-action="tab" data-val="roster" class="text-[10px] font-extrabold text-emerald-800 underline">
                국적별 전체보기 ▸
              </button>
            </div>

            <div class="bg-[#e6f0ec] rounded-xl p-2 text-[11px] text-[#1e3a34] font-bold">
              💡 보유 중인 영웅이 중복 소환되면 자동으로 <strong>영혼 조각(★돌파 재료)</strong>과 <strong>🔮 각성석</strong>으로 변환됩니다.
            </div>
          </div>
        `;
      }

      summonHeroes(count) {
        const cost = count === 10 ? 2700 : 300;
        if (this.state.gems < cost) {
          this.sfx.play('error');
          this.toast(`💎 영혼석이 부족합니다! (${cost.toLocaleString()}개 필요)`);
          return;
        }

        this.state.gems -= cost;
        this.sfx.play('ult');
        const results = [];

        for (let i = 0; i < count; i++) {
          this.state.pity += 1;
          let tier = 0;
          if (this.state.pity >= 80) {
            tier = 3;
            this.state.pity = 0;
          } else {
            const roll = Math.random() * 100;
            if (roll < 1.5) { tier = 3; this.state.pity = 0; }
            else if (roll < 12.0) tier = 2;
            else if (roll < 38.0) tier = 1;
            else tier = 0;
          }

          const lin = LINEAGES[Math.floor(Math.random() * LINEAGES.length)];
          const spec = getHeroSpec(lin.id, tier);
          const existing = this.state.roster.find(r => r.lineageId === lin.id);

          let note = '신규 영입!';
          if (existing) {
            const shardGain = [5, 12, 25, 50][tier];
            const awakenGain = [1, 2, 5, 12][tier];
            existing.shards = (existing.shards || 0) + shardGain;
            this.state.awaken += awakenGain;
            if (tier > existing.tier) {
              existing.tier = tier;
              note = `즉시 승급 + 조각 ${shardGain}!`;
            } else {
              note = `조각 +${shardGain} · 🔮+${awakenGain}`;
            }
          } else {
            this.state.roster.push({
              uid: `u${Date.now()}_${i}`,
              lineageId: lin.id,
              tier,
              lv: 1,
              stars: 1,
              shards: 5
            });
          }
          results.push({ spec, note });
        }

        this.spawnWave();
        this.renderAll();

        const html = `
          <div class="grid ${count === 10 ? 'grid-cols-2' : 'grid-cols-1'} gap-2">
            ${results.map((res, idx) => `
              <div class="p-2 rounded-xl border-2 rarity-${res.spec.code} bg-white flex items-center gap-2">
                <canvas id="pullAv_${idx}" width="42" height="46" class="rounded-lg shrink-0"></canvas>

                  <div class="flex items-center gap-1">
                    <span class="px-1 rounded text-[9px] font-black bg-amber-500 text-white">${res.spec.code}</span>

                  </div>
                  <div class="text-[10px] text-emerald-800 font-bold">${res.note}</div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        this.openModal(`✨ ${count}회 소환 결과`, html);
        results.forEach((res, idx) => {
          this.artist.drawTo(document.getElementById(`pullAv_${idx}`), res.spec);
        });
      }

      /**
       * 5x5 Awakening Dungeon Minimap
       */
      initDungeon(floor) {
        const types = ['chest', 'mob', 'mob', 'shrine', 'empty', 'chest', 'mob'];
        const tiles = [];
        for (let i = 0; i < 25; i++) {
          let type = 'empty';
          if (i === 0) type = 'start';
          else if (i === 24) type = 'boss';
          else type = types[Math.floor(Math.random() * types.length)];
          tiles.push({ idx: i, type, revealed: i === 0 || i === 1 || i === 5, cleared: i === 0 });
        }
        this.state.dungeon.floor = floor;
        this.state.dungeon.pos = 0;
        this.state.dungeon.tiles = tiles;
      }

      isAdjacent(a, b) {
        const ax = a % 5, ay = Math.floor(a / 5);
        const bx = b % 5, by = Math.floor(b / 5);
        return Math.abs(ax - bx) + Math.abs(ay - by) === 1;
      }

      stepDungeon(idx) {
        const d = this.state.dungeon;
        if (idx === d.pos) return;
        const tile = d.tiles[idx];
        if (!tile) return;

        if (!this.isAdjacent(d.pos, idx) && !tile.cleared) {
          this.sfx.play('error');
          this.toast('인접한 칸으로만 이동할 수 있습니다!');
          return;
        }

        d.pos = idx;
        tile.revealed = true;
        d.tiles.forEach(t => {
          if (this.isAdjacent(idx, t.idx)) t.revealed = true;
        });

        const floorMult = 1 + (d.floor - 1) * 0.35;
        if (!tile.cleared) {
          tile.cleared = true;
          if (tile.type === 'chest') {
            const aw = Math.round(3 * floorMult);
            const sc = Math.round(2 * floorMult);
            this.state.awaken += aw;
            this.state.scrolls += sc;
            this.sfx.play('coin');
            this.toast(`🎁 보물상자! 🔮각성석 +${aw} · 📜전직서 +${sc}`);
          } else if (tile.type === 'mob') {
            const sil = Math.round(1400 * floorMult);
            const aw = Math.round(2 * floorMult);
            this.state.silver += sil;
            this.state.awaken += aw;
            this.sfx.play('hit');
            this.toast(`⚔️ 수호병 격파! +${sil.toLocaleString()}🪙 · 🔮+${aw}`);
          } else if (tile.type === 'shrine') {
            this.chainGauge = 100;
            this.allies.forEach(a => { a.hp = a.maxHp; });
            this.sfx.play('combo');
            this.toast('⛩️ 선인의 제단! 부대 생명력 회복 & 협동 공명 100%!');
          } else if (tile.type === 'boss') {
            const aw = Math.round(10 * floorMult);
            const sc = Math.round(6 * floorMult);
            const gm = Math.round(250 * floorMult);
            this.state.awaken += aw;
            this.state.scrolls += sc;
            this.state.gems += gm;
            this.sfx.play('ult');
            this.toast(`👹 ${d.floor}층 수호마왕 격파! 🔮+${aw} · 📜+${sc} · 💎+${gm}`);
            this.initDungeon(d.floor + 1);
          } else {
            this.sfx.play('tap');
          }
        } else {
          this.sfx.play('tap');
        }

        this.updateTopHud();
        if (this.state.tab === 'dungeon') this.renderAll();
      }

      autoStepDungeon() {
        const d = this.state.dungeon;
        const neighbors = d.tiles.filter(t => this.isAdjacent(d.pos, t.idx));
        const unvisited = neighbors.filter(t => !t.cleared);
        const pick = unvisited.length > 0
          ? unvisited[Math.floor(Math.random() * unvisited.length)]
          : neighbors[Math.floor(Math.random() * neighbors.length)];
        if (pick) this.stepDungeon(pick.idx);
      }

      renderMerchantTab(body) {

          <!-- +15 Blacksmith Refinement -->
          <div class="hanji-card p-2.5 flex flex-col gap-1.5">

            <div class="grid grid-cols-3 gap-1.5">
              ${gearItems.map(it => `
      openDifficultyModal() {
        const curDiff = this.state.diffIdx;

          <div class="space-y-1.5">

          </div>
        `;
        this.openModal('⚔️ 전장 난이도 조절', html);
      }

      openSynergyModal() {
        const { list } = this.getActiveSynergies();
        const html = `
          <div class="space-y-1.5">
            <div class="font-black text-xs text-emerald-900">📜 진영 · 역할군 실시간 시너지</div>
            ${list.map(s => `

                  <div class="text-[11px] text-amber-800 font-bold">${s.desc}</div>
                </div>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-black ${s.active ? 'bg-emerald-700 text-white' : 'bg-stone-200 text-stone-600'}">
                  ${s.active ? '발동중' : `${s.cur}/${s.req}`}
                </span>
              </div>
            `).join('')}
          </div>

          <div class="pt-2 border-t border-amber-500/30 space-y-1">
            <div class="font-black text-xs text-amber-900">⚡ 4대 원소 연쇄 반응 가이드</div>
            <div class="p-2 rounded-xl bg-amber-50 border border-amber-300 text-[11px] space-y-1 font-bold">
              <div>🔥 화염 + ⚡ 뇌전 = <span class="text-orange-700">💥 과부하 대폭발 (광역 추가피해)</span></div>
              <div>🌊 수빙 + ⚡ 뇌전 = <span class="text-sky-700">❄️ 초전도 빙결 (적 행동 기절)</span></div>
              <div>🔥 화염 + 🌊 수빙 = <span class="text-blue-700">💨 증발 연쇄일격 (강인도 대폭 파괴)</span></div>
              <div>✨ 천상 + 타원소 = <span class="text-amber-700">☀️ 천벌 성광폭발 (최대 연쇄 피해)</span></div>
            </div>
          </div>
        `;
        this.openModal('🔮 진영 · 병과 · 원소 시너지 도감', html);
      }
    }

    /**
     * =========================================================================
     * 7. GLOBAL ACTION DELEGATOR
     * =========================================================================
     */
    const game = new GersangEmpireGame();

    document.addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) {
        if (e.target.id === 'modalOverlay') game.closeModal();
        return;
      }

      const action = btn.dataset.action;
      const val = btn.dataset.val;

      if (action === 'tab') {
        game.sfx.play('tap');
        game.state.tab = val;
        game.renderAll();
      } else if (action === 'toggle-auto') {
        game.state.autoBattle = !game.state.autoBattle;
        const el = document.getElementById('btnAuto');
        el.textContent = game.state.autoBattle ? '⚡자동' : '🖐️수동';
        el.className = game.state.autoBattle
          ? 'px-2 py-1 rounded-full text-[11px] font-extrabold bg-emerald-700 text-white border border-emerald-900'
          : 'px-2 py-1 rounded-full text-[11px] font-extrabold bg-stone-200 text-stone-800 border border-stone-400';
        game.sfx.play('tap');
      } else if (action === 'toggle-sound') {
        game.sfx.enabled = !game.sfx.enabled;
        document.getElementById('btnSound').textContent = game.sfx.enabled ? '🔊' : '🔇';
        if (game.sfx.enabled) game.sfx.play('tap');
      } else if (action === 'open-diff') {
        game.sfx.play('tap');
        game.openDifficultyModal();
      } else if (action === 'set-diff') {
        game.state.diffIdx = parseInt(val, 10) || 0;
        game.state.wave = 1;
        game.sfx.play('ult');
        game.closeModal();
        game.spawnWave();
        game.saveState();
        game.toast(`난이도 변경: ${DIFFICULTIES[game.state.diffIdx].label}`);
      } else if (action === 'stage-prev') {
        if (game.state.stage > 1) {
          game.state.stage -= 1;
        } else if (game.state.chapter > 1) {
          game.state.chapter -= 1;
          game.state.stage = 10;
        } else {
          game.sfx.play('error');
          game.toast('가장 첫 번째 스테이지입니다.');
          return;
        }
        game.state.wave = 1;
        game.sfx.play('tap');
        game.spawnWave();
      } else if (action === 'stage-next') {
        game.state.stage += 1;
        if (game.state.stage > 10) {
          game.state.stage = 1;
          game.state.chapter += 1;
        }
        game.state.wave = 1;
        game.sfx.play('tap');
        game.spawnWave();
        game.toast(`제${game.state.chapter}장 ${game.state.chapter}-${game.state.stage} 스테이지 이동`);
      } else if (action === 'stage-boss') {
        game.state.wave = 5;
        game.sfx.play('ult');
        game.spawnWave();
        game.toast(`👹 ${game.state.chapter}-${game.state.stage} 스테이지 보스 즉시 소환!`);
      } else if (action === 'toggle-auto-stage') {
        game.state.autoStage = !game.state.autoStage;
        game.sfx.play('tap');
        game.updateTopHud();
      } else if (action === 'filter-nation') {
        game.state.nationFilter = val;
        game.sfx.play('tap');
        game.renderAll();
      } else if (action === 'inspect-hero') {
        if (!game.state.party.includes(val)) {
          if (game.state.party.length >= 4) game.state.party.shift();
          game.state.party.push(val);
        }
        game.state.selectedSlot = game.state.party.indexOf(val);
        game.state.tab = 'squad';
        game.sfx.play('tap');
        game.spawnWave();
        game.renderAll();
      } else if (action === 'open-synergy') {
        game.sfx.play('tap');
        game.openSynergyModal();
      } else if (action === 'close-modal') {
        game.sfx.play('tap');
        game.closeModal();
      } else if (action === 'cast-ult') {
        const idx = parseInt(val, 10);
        const ally = game.allies[idx];
        if (ally) game.castSkill(ally, 2, true);
      } else if (action === 'trigger-chain') {
        game.triggerChainUlt();
      } else if (action === 'select-slot') {
        game.sfx.play('tap');
        game.state.selectedSlot = parseInt(val, 10);
        game.renderAll();
      } else if (action === 'level-up') {
        const h = game.state.roster.find(r => r.uid === val);
        if (!h) return;
        const cost = 300 + h.lv * 90;
        if (game.state.silver < cost) {
          game.sfx.play('error');
          game.toast('🪙 엽전이 부족합니다!');
          return;
        }
        game.state.silver -= cost;
        h.lv += 1;
        game.sfx.play('coin');
        game.spawnWave();
        game.renderAll();
      } else if (action === 'star-up') {
        const h = game.state.roster.find(r => r.uid === val);
        if (!h || (h.stars || 1) >= 6) return;
        const req = (h.stars || 1) * 15;
        if ((h.shards || 0) < req) {
          game.sfx.play('error');
          game.toast(`영혼 조각이 부족합니다! (${req}개 필요)`);
          return;
        }
        h.shards -= req;
        h.stars = (h.stars || 1) + 1;
        game.sfx.play('ult');
        game.toast(`⭐ ${h.stars}성 돌파 성공!`);
        game.spawnWave();
        game.renderAll();
      } else if (action === 'promote') {
        const h = game.state.roster.find(r => r.uid === val);
        if (!h || h.tier >= 3) return;
        const nt = TIERS[h.tier + 1];
        if (h.lv < nt.reqLv) {
          game.sfx.play('error');
          game.toast(`레벨 ${nt.reqLv} 달성 후 전직할 수 있습니다!`);
          return;
        }
        if (game.state.awaken < nt.awaken || game.state.scrolls < nt.scrolls || game.state.silver < nt.silver) {
          game.sfx.play('error');
          game.toast(`전직 재료 부족! (🔮${nt.awaken}, 📜${nt.scrolls}, ${nt.silver.toLocaleString()}🪙)`);
          return;
        }
        game.state.awaken -= nt.awaken;
        game.state.scrolls -= nt.scrolls;
        game.state.silver -= nt.silver;
        h.tier += 1;
        game.sfx.play('ult');
        game.toast(`🔥 [${getHeroSpec(h.lineageId, h.tier).name}] 전직 완료!`);
        game.spawnWave();
        game.renderAll();
      } else if (action === 'toggle-party') {
        const idx = game.state.party.indexOf(val);
        if (idx >= 0) {
          if (game.state.party.length <= 1) {
            game.sfx.play('error');
            game.toast('최소 1명의 장수는 출전해야 합니다!');
            return;
          }
          game.state.party.splice(idx, 1);
        } else {
          if (game.state.party.length >= 4) {
            game.state.party.shift();
          }
          game.state.party.push(val);
        }
        game.sfx.play('tap');
        game.spawnWave();
        game.saveState();
        game.renderAll();
      } else if (action === 'summon') {
        game.summonHeroes(parseInt(val, 10));
        game.saveState();
      } else if (action === 'step-dungeon') {
        game.stepDungeon(parseInt(val, 10));
        game.saveState();
      } else if (action === 'toggle-auto-dungeon') {
        game.state.dungeon.auto = !game.state.dungeon.auto;
        game.sfx.play('tap');
        game.renderAll();
      } else if (action === 'cycle-route') {
        game.state.trade.routeIdx = (game.state.trade.routeIdx + 1) % TRADE_ROUTES.length;
        game.state.trade.progress = 0;
        game.sfx.play('tap');
        game.renderAll();
      } else if (action === 'toggle-auto-trade') {
        game.state.trade.auto = !game.state.trade.auto;
        if (game.state.trade.auto) game.state.trade.running = true;
        game.sfx.play('tap');
        game.renderAll();
      } else if (action === 'start-trade') {
        game.state.trade.running = true;
        game.sfx.play('tap');
        game.renderAll();
      } else if (action === 'refine') {
        const curLv = game.state.gear[val] || 0;
        if (curLv >= 15) return;
        const cost = 500 + curLv * 350;
        if (game.state.silver < cost) {
          game.sfx.play('error');
          game.toast('🪙 엽전이 부족합니다!');
          return;
        }
        game.state.silver -= cost;
        game.state.gear[val] = curLv + 1;
        game.sfx.play('coin');
        game.toast(`🔨 제련 성공! +${curLv + 1}강 달성!`);
        game.spawnWave();
        game.renderAll();
      } else if (action === 'upload-hero') {
        game._uploadHeroLineage = val;
        document.getElementById('heroImgInput').click();
      } else if (action === 'upload-bg') {
        document.getElementById('bgImgInput').click();
      }
    });
  </script>
</body>
</html>
