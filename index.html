<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>천하제일거상 : 제국 리마스터 v3</title>
<style>
  :root {
    --bg-cream: #f4efe6;
    --bg-panel: #fbf8f2;
    --bg-card: #ffffff;
    --ink-main: #221d18;
    --ink-sub: #665d53;
    --ink-muted: #8f8477;
    --accent-gold: #b8821d;
    --accent-gold-soft: rgba(184, 130, 29, 0.14);
    --accent-jade: #1e7a65;
    --accent-jade-soft: rgba(30, 122, 101, 0.14);
    --accent-crimson: #b83227;
    --accent-crimson-soft: rgba(184, 50, 39, 0.14);
    --border-soft: rgba(74, 58, 38, 0.16);
    --shadow-card: 0 4px 14px rgba(42, 31, 18, 0.07);
    --battle-flex: 1.15;
    --side-max: 580px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-cream);
    color: var(--ink-main);
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }

  #app {
    display: flex;
    width: 100%;
    height: 100%;
  }

  #battle-pane {
    position: relative;
    flex: var(--battle-flex);
    min-width: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, #8ecae6 0%, #cde8f5 52%, #e8dcc4 53%, #cbb896 100%);
    transition: flex 0.2s ease, height 0.2s ease;
  }

  #battle-canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }

  .hud-top-bar {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    pointer-events: none;
    z-index: 10;
  }

  .hud-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: auto;
  }

  .hud-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .pill-btn {
    border: 1px solid var(--border-soft);
    background: rgba(251, 248, 242, 0.92);
    backdrop-filter: blur(8px);
    color: var(--ink-main);
    border-radius: 999px;
    padding: 6px 11px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .pill-btn:hover {
    background: #fffdf8;
  }

  .pill-btn.danger {
    background: rgba(184, 50, 39, 0.92);
    color: #fff;
    border-color: transparent;
  }

  .pill-btn.active {
    background: var(--accent-jade);
    color: #fff;
    border-color: transparent;
  }

  .combo-pill {
    background: rgba(34, 29, 24, 0.86);
    color: #ffe299;
    border: 1px solid rgba(255, 226, 153, 0.45);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 800;
  }

  .stage-badge {
    background: rgba(251, 248, 242, 0.94);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 196px;
  }

  .team-hp-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 10px;
    font-weight: 800;
  }

  .team-hp-label {
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }

  .hp-track {
    width: 100%;
    height: 6px;
    background: rgba(0, 0, 0, 0.14);
    border-radius: 999px;
    overflow: hidden;
  }

  .ally-hp-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #10b981, #0284c7);
    transition: width 0.15s linear;
  }

  .enemy-hp-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #f97316, #dc2626);
    transition: width 0.15s linear;
  }

  .wave-bar-wrap {
    width: 100%;
    height: 5px;
    background: rgba(0, 0, 0, 0.1);
    border-radius: 999px;
    overflow: hidden;
  }

  .wave-bar-fill {
    height: 100%;
    width: 20%;
    background: linear-gradient(90deg, var(--accent-gold), var(--accent-jade));
    transition: width 0.25s ease;
  }

  .hud-bottom-bar {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    pointer-events: auto;
  }

  .ultimate-btn {
    border: 2px solid #d49b27;
    background: linear-gradient(135deg, #2b2118 0%, #4d3519 100%);
    color: #ffe299;
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
    white-space: nowrap;
  }

  .ultimate-btn.ready {
    background: linear-gradient(135deg, #c97a16 0%, #e63946 100%);
    color: #fff;
    border-color: #fff3b0;
    animation: pulseGlow 1.1s infinite alternate;
  }

  @keyframes pulseGlow {
    from { transform: scale(1); }
    to { transform: scale(1.05); }
  }

  #side-pane {
    flex: 1;
    min-width: 320px;
    max-width: var(--side-max);
    height: 100%;
    background: var(--bg-panel);
    border-left: 2px solid rgba(184, 130, 29, 0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: max-width 0.2s ease, height 0.2s ease;
  }

  .top-resource-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: #f1eadc;
    border-bottom: 1px solid var(--border-soft);
    font-size: 12px;
    font-weight: 700;
    gap: 8px;
    flex-wrap: wrap;
  }

  .nav-tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    padding: 8px;
    background: #f6f1e7;
    border-bottom: 1px solid var(--border-soft);
  }

  .nav-tab {
    border: 1px solid var(--border-soft);
    background: var(--bg-card);
    color: var(--ink-sub);
    border-radius: 10px;
    padding: 8px 4px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
  }

  .nav-tab.active {
    background: #223029;
    color: #fff;
    border-color: #223029;
  }

  #tab-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .section-card {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 12px;
    box-shadow: var(--shadow-card);
  }

  .section-title {
    margin: 0 0 8px 0;
    font-size: 14px;
    font-weight: 800;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .reward-detail-box {
    background: #fffdf8;
    border: 1px solid rgba(184, 130, 29, 0.35);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 11px;
    line-height: 1.55;
    color: var(--ink-main);
  }

  .clear-popup-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: #faf6ee;
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 12px;
    font-size: 12px;
    line-height: 1.55;
  }

  .mastery-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    margin-top: 8px;
  }

  .mastery-node {
    border: 1px solid var(--border-soft);
    background: #faf6ee;
    border-radius: 10px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .preset-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .preset-box {
    flex: 1;
    min-width: 96px;
    border: 1px solid var(--border-soft);
    background: #faf6ee;
    border-radius: 10px;
    padding: 6px 8px;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .slot-selector-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }

  .slot-box {
    border: 2px solid var(--border-soft);
    background: #fffdf9;
    border-radius: 10px;
    padding: 6px 7px;
    cursor: pointer;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .slot-box.selected {
    border-color: var(--accent-jade);
    background: var(--accent-jade-soft);
  }

  .slot-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    font-weight: 800;
    color: var(--ink-sub);
  }

  .slot-hero-name {
    font-size: 12px;
    font-weight: 800;
    color: var(--ink-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .synergy-guide-box {
    background: #faf6ee;
    border: 1px dashed rgba(184, 130, 29, 0.45);
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 11px;
    color: var(--ink-sub);
    line-height: 1.45;
  }

  .synergy-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .synergy-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 8px;
    background: #f3efe8;
    color: var(--ink-sub);
    border: 1px solid var(--border-soft);
  }

  .synergy-badge.on {
    background: var(--accent-gold-soft);
    color: var(--ink-main);
    border-color: rgba(184, 130, 29, 0.45);
  }

  .nation-filter-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .nation-chip {
    border: 1px solid var(--border-soft);
    background: #faf6ee;
    color: var(--ink-sub);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .nation-chip.active {
    background: var(--accent-gold);
    color: #fff;
    border-color: var(--accent-gold);
  }

  .hero-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
  }

  .hero-card {
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 8px;
    background: #fffdf9;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .hero-card.synergy-match {
    border-color: rgba(30, 122, 101, 0.55);
    box-shadow: 0 0 0 1px rgba(30, 122, 101, 0.2);
  }

  .hero-card.locked {
    opacity: 0.72;
    background: #f3efe8;
  }

  .hero-thumb {
    width: 100%;
    height: 78px;
    border-radius: 8px;
    object-fit: cover;
    background: #e7decb;
  }

  .hero-name {
    font-size: 12px;
    font-weight: 800;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4px;
  }

  .hero-meta {
    font-size: 10px;
    color: var(--ink-sub);
  }

  .hero-syn-tag {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent-jade);
    background: var(--accent-jade-soft);
    border-radius: 6px;
    padding: 3px 6px;
  }

  .equip-slots-strip {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }

  .equip-slot-pill {
    border: 1px solid var(--border-soft);
    background: #faf6ee;
    border-radius: 10px;
    padding: 7px;
    font-size: 11px;
    line-height: 1.35;
  }

  .eq-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .eq-card {
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 8px;
    background: #fffdf9;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .eq-card.equipped {
    border-color: var(--accent-gold);
    background: #fffaf0;
  }

  .attend-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
    gap: 6px;
  }

  .attend-day {
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 7px;
    background: #faf6ee;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .attend-day.claimed {
    background: var(--accent-jade-soft);
    border-color: rgba(30, 122, 101, 0.4);
  }

  .attend-day.today {
    border-color: var(--accent-gold);
    background: #fffaf0;
  }

  .btn-row {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .mini-btn {
    flex: 1;
    border: 1px solid var(--border-soft);
    background: #f5efe3;
    color: var(--ink-main);
    border-radius: 8px;
    padding: 5px 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }

  .mini-btn.primary {
    background: var(--accent-jade);
    color: #fff;
    border-color: transparent;
  }

  .mini-btn.gold {
    background: var(--accent-gold);
    color: #fff;
    border-color: transparent;
  }

  .mini-btn.danger {
    background: var(--accent-crimson);
    color: #fff;
    border-color: transparent;
  }

  .mini-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .backup-textarea {
    width: 100%;
    min-height: 68px;
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 8px;
    font-size: 11px;
    font-family: monospace;
    background: #faf6ee;
    color: var(--ink-main);
    resize: vertical;
  }

  .setting-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border-soft);
  }

  .setting-row:last-child {
    border-bottom: none;
  }

  .setting-label-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 700;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 64px;
    transform: translateX(-50%);
    background: rgba(34, 29, 24, 0.94);
    color: #fff;
    padding: 8px 16px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    z-index: 999;
    display: none;
    max-width: 92vw;
    text-align: center;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 12, 9, 0.62);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 120;
    padding: 16px;
  }

  .modal-backdrop.bottom-align {
    align-items: flex-end;
    padding-bottom: 24px;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-box {
    width: 100%;
    max-width: 520px;
    max-height: 86vh;
    overflow-y: auto;
    background: var(--bg-panel);
    border-radius: 18px;
    padding: 16px;
    border: 1px solid var(--border-soft);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    display: flex;
    flex-direction: column;
    gap: 10px;
    animation: modalPop 0.2s ease-out;
  }

  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .diff-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .diff-item {
    border: 1px solid var(--border-soft);
    background: #fff;
    border-radius: 12px;
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    cursor: pointer;
    text-align: left;
    gap: 10px;
  }

  .diff-item.active {
    border-color: var(--accent-gold);
    background: var(--accent-gold-soft);
  }

  .summon-result-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .summon-item-card {
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 7px;
    background: #fff;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 3px;
    animation: cardReveal 0.26s ease both;
  }

  .summon-item-card.new-hero {
    border-color: var(--accent-gold);
    background: #fffaf0;
    box-shadow: 0 0 0 2px rgba(184, 130, 29, 0.18);
  }

  @keyframes cardReveal {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #dungeon-transition {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #281d38 0%, #120e1a 100%);
    color: #fff;
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    text-align: center;
  }

  #dungeon-transition.active {
    display: flex;
    animation: fadeScreen 0.25s ease;
  }

  @keyframes fadeScreen {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .portal-ring {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border: 4px solid rgba(255, 215, 115, 0.25);
    border-top-color: #ffd166;
    border-right-color: #48cae4;
    animation: spinRing 0.95s linear infinite;
  }

  @keyframes spinRing {
    to { transform: rotate(360deg); }
  }

  .dungeon-progress-wrap {
    width: 100%;
    max-width: 280px;
    height: 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.16);
    overflow: hidden;
  }

  .dungeon-progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffd166, #06d6a0);
    transition: width 0.12s linear;
  }

  @media (max-width: 820px) {
    #app {
      flex-direction: column;
    }
    #battle-pane {
      flex: none;
      height: var(--mobile-battle-h, 44%);
      width: 100%;
    }
    #side-pane {
      flex: 1;
      min-width: 0;
      max-width: none;
      width: 100%;
      border-left: none;
      border-top: 2px solid rgba(184, 130, 29, 0.45);
    }
  }
</style>
</head>
<body>
<div id="app">
  <section id="battle-pane">
    <canvas id="battle-canvas"></canvas>

    <div class="hud-top-bar">
      <div class="hud-group">
        <div class="hud-row">
          <button id="btn-diff-modal" class="pill-btn" type="button">난이도: 입문 ▾</button>
          <button id="btn-speed" class="pill-btn active" type="button">⚡ 1x</button>
          <button id="btn-settings-modal" class="pill-btn" type="button">⚙️ 설정</button>
          <button id="btn-bg-upload" class="pill-btn" type="button" title="배경 이미지 변경">🏞️</button>
          <input id="file-bg-input" type="file" accept="image/*" style="display:none" />
        </div>
        <div class="hud-row">
          <button id="btn-prev-stage" class="pill-btn" type="button">◀ 이전</button>
          <button id="btn-boss-now" class="pill-btn danger" type="button">👹 보스즉시</button>
          <button id="btn-next-stage" class="pill-btn" type="button">다음 ▶</button>
          <span id="combo-badge" class="combo-pill">0 COMBO</span>
        </div>
      </div>

      <div class="hud-group" style="align-items:flex-end;">
        <div class="stage-badge">
          <div id="stage-label">1-1 한양성 외곽 (1/5)</div>
          <div class="team-hp-row">
            <div class="team-hp-label">
              <span>🛡️ 아군 전체</span>
              <span id="ally-hp-text">0 / 0</span>
            </div>
            <div class="hp-track">
              <div id="ally-hp-bar" class="ally-hp-fill"></div>
            </div>
          </div>
          <div class="team-hp-row">
            <div class="team-hp-label">
              <span>⚔️ 적팀 전체</span>
              <span id="enemy-hp-text">0 / 0</span>
            </div>
            <div class="hp-track">
              <div id="enemy-hp-bar" class="enemy-hp-fill"></div>
            </div>
          </div>
          <div class="wave-bar-wrap">

  function buildHeroPool() {
    const pool = [];
    for (const spec of NATION_SPECS) {
      for (let i = 0; i < 35; i++) {
        if (i < spec.named.length) {
          const nm = spec.named[i];
          pool.push({
            id: nm.id,
            name: nm.name,
            nation: spec.nation,
            role: nm.role,
            element: nm.element,
            skillName: nm.skillName,
            cd: nm.cd,
            baseAtk: nm.atk,
            baseHp: nm.hp,
            color: spec.palette[i % spec.palette.length],
            emblem: spec.emblem,
            unlockedDefault: true
          });
        } else {
          const idxInUnits = i - spec.named.length;
          const unitName = spec.unitNames[idxInUnits % spec.unitNames.length];
          const role = ROLES[i % ROLES.length];
          const element = ELEMENTS[i % ELEMENTS.length];
          const skillName = SKILLS[i % SKILLS.length];
          const cd = Number((3.5 + (i % 6) * 0.25).toFixed(1));
          const tierBoost = i * 4;
          pool.push({
            id: `${spec.prefix}_${i + 1}`,
            name: unitName,
            nation: spec.nation,
            role,
            element,
            skillName,
            cd,
            baseAtk: 120 + tierBoost,
            baseHp: 980 + tierBoost * 11,
            color: spec.palette[i % spec.palette.length],
            emblem: spec.emblem,
            unlockedDefault: true
          });
        }
      }
    }
    return pool;
  }

  const AUDIO = (() => {
    let ctx = null;
    let bgmTimer = null;
    let stepIdx = 0;
    let currentTheme = "field";
    let lastHitTime = 0;
    let lastChainTime = 0;
    let lastEnemyAtkTime = 0;

    const THEMES = {
      field: {
        tempoMs: 420,
        wave: "triangle",
        notes: [261.63, 293.66, 329.63, 392.00, 440.00, 392.00, 329.63, 293.66]
      },
      dungeon: {

      },
      portal: {
        tempoMs: 340,
        wave: "sine",
        notes: [329.63, 440.00, 554.37, 659.25, 554.37, 440.00, 392.00, 329.63]
      }
    };

    function ensureCtx() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      if (!ctx) ctx = new AudioCtx();
      if (ctx.state === "suspended") {
        ctx.resume().catch(() => {});
      }
      return ctx;
    }

    function playBgmStep() {
      if (!state.soundEnabled || state.bgmVol <= 0) return;
      const c = ensureCtx();
      if (!c) return;
      const th = THEMES[currentTheme] || THEMES.field;
      const freq = th.notes[stepIdx % th.notes.length];
      stepIdx += 1;

      const now = c.currentTime;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = th.wave;
      osc.frequency.setValueAtTime(freq, now);

      const peak = 0.045 * state.bgmVol;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(peak, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + (th.tempoMs / 1000) * 0.9);

      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(now);
      osc.stop(now + th.tempoMs / 1000);
    }

    function restartBgmLoop() {
      if (bgmTimer) {
        clearInterval(bgmTimer);
        bgmTimer = null;
      }
      const th = THEMES[currentTheme] || THEMES.field;
      bgmTimer = setInterval(playBgmStep, th.tempoMs);
    }

    function playTone(freqStart, freqEnd, duration, type = "triangle", baseGain = 0.06, delay = 0) {
      if (!state.soundEnabled || state.sfxVol <= 0) return;
      const c = ensureCtx();
      if (!c) return;
      const now = c.currentTime + delay;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(Math.max(40, freqStart), now);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, freqEnd), now + duration);

      const peak = baseGain * state.sfxVol;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(peak, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    return {
      unlock() {
        ensureCtx();
        if (!bgmTimer) restartBgmLoop();
      },
      setTheme(themeName) {
        if (currentTheme !== themeName) {
          currentTheme = themeName;
          stepIdx = 0;
          restartBgmLoop();
        }
      },
      hit() {
        const t = performance.now();
        if (t - lastHitTime < 95) return;
        lastHitTime = t;
        playTone(220 + Math.random() * 60, 95, 0.07, "square", 0.03);
      },
      enemyAttack() {
        const t = performance.now();
        if (t - lastEnemyAtkTime < 260) return;
        lastEnemyAtkTime = t;
        playTone(155, 70, 0.11, "sawtooth", 0.045);
      },
      crit() {
        playTone(620, 1280, 0.11, "sawtooth", 0.055);
      },
      tapStrike() {
        playTone(310, 140, 0.09, "sawtooth", 0.05);
      },
      chain() {
        const t = performance.now();
        if (t - lastChainTime < 220) return;
        lastChainTime = t;
        playTone(520, 980, 0.14, "sawtooth", 0.05);
        playTone(780, 1240, 0.12, "sine", 0.04, 0.05);
      },
      skill() {
        playTone(340, 760, 0.18, "triangle", 0.065);
        playTone(510, 1020, 0.16, "sine", 0.045, 0.04);
      },
      ultimate() {

    state.mastery.exp += Math.max(0, amount);
    let leveledUp = false;
    while (state.mastery.exp >= getMasteryNeedExp(state.mastery.level)) {
      state.mastery.exp -= getMasteryNeedExp(state.mastery.level);
      state.mastery.level += 1;
      state.mastery.points += 1;
      leveledUp = true;

      wave: state.wave,
      autoStage: state.autoStage,
      resonance: state.resonance,
      squadSlots: state.squadSlots,
      presets: state.presets,
      forge: state.forge,
      equipmentInv: state.equipmentInv,
      attendance: state.attendance,
      dailyDateKey: state.dailyDateKey,
      claimedDaily: state.claimedDaily,
      repeatCount: state.repeatCount,
      stats: state.stats,
      heroes: state.heroes,
      lastSavedAt: Date.now()
    };
    return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  }

  function applySaveObject(d) {
    if (!d || typeof d !== "object") return false;
    if (typeof d.gold === "number") state.gold = Math.max(0, d.gold);
    if (typeof d.gem === "number") state.gem = Math.max(0, d.gem);
    if (typeof d.soul === "number") state.soul = Math.max(0, d.soul);

    if (d.mastery && typeof d.mastery === "object") {
      state.mastery = {
        level: Math.max(1, Number(d.mastery.level) || 1),
        exp: Math.max(0, Number(d.mastery.exp) || 0),
        points: Math.max(0, Number(d.mastery.points) || 0),
        atkLv: Math.max(0, Number(d.mastery.atkLv) || 0),
        hpLv: Math.max(0, Number(d.mastery.hpLv) || 0),
        resLv: Math.max(0, Number(d.mastery.resLv) || 0),
        rewardLv: Math.max(0, Number(d.mastery.rewardLv) || 0)
      };
    }

    if (typeof d.difficultyIdx === "number") state.difficultyIdx = Math.min(DIFFICULTIES.length - 1, Math.max(0, d.difficultyIdx));
    if (typeof d.speedIdx === "number") state.speedIdx = Math.min(SPEEDS.length - 1, Math.max(0, d.speedIdx));
    if (typeof d.layoutIdx === "number") state.layoutIdx = Math.min(LAYOUTS.length - 1, Math.max(0, d.layoutIdx));
    if (typeof d.soundEnabled === "boolean") state.soundEnabled = d.soundEnabled;
    if (typeof d.bgmVol === "number") state.bgmVol = Math.min(1, Math.max(0, d.bgmVol));
    if (typeof d.sfxVol === "number") state.sfxVol = Math.min(1, Math.max(0, d.sfxVol));
    if (typeof d.chapter === "number" && d.chapter >= 1) state.chapter = d.chapter;
    if (typeof d.stageNum === "number" && d.stageNum >= 1 && d.stageNum <= 10) state.stageNum = d.stageNum;
    if (typeof d.wave === "number" && d.wave >= 1 && d.wave <= 5) state.wave = d.wave;
    if (typeof d.autoStage === "boolean") state.autoStage = d.autoStage;
    if (typeof d.resonance === "number") state.resonance = Math.min(100, Math.max(0, d.resonance));

    state.squadSlots = sanitizeSlots(d.squadSlots);
    if (!state.squadSlots.some(Boolean)) {
      state.squadSlots = [...DEFAULT_NINE_SLOTS];
    }

    if (d.presets && typeof d.presets === "object") {
      state.presets = {
        1: sanitizeSlots(d.presets[1]),
        2: sanitizeSlots(d.presets[2]),
        3: sanitizeSlots(d.presets[3])
      };
    }

    if (d.forge && typeof d.forge === "object") {
      state.forge.weaponLv = Math.max(0, Number(d.forge.weaponLv) || 0);
      state.forge.armorLv = Math.max(0, Number(d.forge.armorLv) || 0);
      state.forge.tradeLv = Math.max(0, Number(d.forge.tradeLv) || 0);
    }

    if (Array.isArray(d.equipmentInv)) {
      state.equipmentInv = d.equipmentInv
        .filter(it => it && EQUIP_TEMPLATES.some(t => t.id === it.tplId))
        .map(it => ({
          uid: String(it.uid || ("eq_" + Math.random().toString(36).slice(2, 8))),
          tplId: it.tplId,
          lv: Math.max(1, Number(it.lv) || 1),
          equippedHeroId: it.equippedHeroId && HERO_POOL.some(h => h.id === it.equippedHeroId) ? it.equippedHeroId : null
        }));
    }

    if (d.attendance && typeof d.attendance === "object") {
      state.attendance = {
        dayIndex: Math.min(6, Math.max(0, Number(d.attendance.dayIndex) || 0)),
        lastClaimDate: d.attendance.lastClaimDate || null
      };
    }

    if (typeof d.dailyDateKey === "string") state.dailyDateKey = d.dailyDateKey;
    if (d.claimedDaily && typeof d.claimedDaily === "object") state.claimedDaily = { ...d.claimedDaily };
    if (d.repeatCount && typeof d.repeatCount === "object") state.repeatCount = { ...d.repeatCount };

    if (d.stats && typeof d.stats === "object") {
      state.stats.kills = Math.max(0, Number(d.stats.kills) || 0);
      state.stats.summons = Math.max(0, Number(d.stats.summons) || 0);
      state.stats.forges = Math.max(0, Number(d.stats.forges) || 0);
    }

    if (d.heroes && typeof d.heroes === "object") {
      for (const h of HERO_POOL) {
        if (d.heroes[h.id]) {
          state.heroes[h.id] = {
            unlocked: Boolean(d.heroes[h.id].unlocked),
            level: Math.max(1, Number(d.heroes[h.id].level) || 1),
            star: Math.min(6, Math.max(1, Number(d.heroes[h.id].star) || 1))
          };
        }
      }
    }

    checkDailyReset();
    return true;
  }

  function saveGame() {
    try {
      localStorage.setItem(STORAGE_KEY, exportSaveCode());
    } catch (_) {}
  }

  function loadGame() {
    initHeroes();
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      let parsed = null;
      try {
        parsed = JSON.parse(decodeURIComponent(escape(atob(raw))));
      } catch (_) {
        parsed = JSON.parse(raw);
      }
      if (!parsed || typeof parsed !== "object") return;
      applySaveObject(parsed);

      if (typeof parsed.lastSavedAt === "number") {
        const elapsedSec = Math.floor((Date.now() - parsed.lastSavedAt) / 1000);
        if (elapsedSec >= 10) {
          const cappedSec = Math.min(elapsedSec, 3600 * 12);
          const mins = Math.max(1, Math.floor(cappedSec / 60));
          const diff = DIFFICULTIES[state.difficultyIdx] || DIFFICULTIES[0];
          const rewardMult = 1 + state.forge.tradeLv * 0.12 + state.mastery.rewardLv * 0.08;
          state.offlineReward = {
            minutes: mins,
            gold: Math.round(mins * 25 * diff.rewardMult * rewardMult),
            soul: Math.max(1, Math.floor(mins / 5) * 2),
            gem: Math.max(1, Math.floor(mins / 10) * 5)
          };
        }
      }
    } catch (_) {}
  }

  function importSaveCode(codeStr) {
    const trimmed = (codeStr || "").trim();
    if (!trimmed) {
      showToast("복원할 세이브 코드를 입력하세요.");
      return;
    }
    try {
      let obj = null;
      try {
        obj = JSON.parse(decodeURIComponent(escape(atob(trimmed))));
      } catch (_) {
        obj = JSON.parse(trimmed);
      }
      if (!applySaveObject(obj)) {
        showToast("올바르지 않은 세이브 코드입니다.");
        return;
      }
      saveGame();
      applyLayout();
      spawnWaveEnemies(false);
      refreshAllyTeamHp(true);
      updateHud();
      renderTabContent();
      showToast("세이브 데이터가 복원되었습니다!");
    } catch (_) {
      showToast("세이브 코드 형식을 확인해 주세요.");
    }
  }

    try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
    state.gold = 5000;
    state.gem = 800;
    state.soul = 60;
    state.mastery = { level: 1, exp: 0, points: 3, atkLv: 0, hpLv: 0, resLv: 0, rewardLv: 0 };

    state.speedIdx = 0;
    state.layoutIdx = 0;
    state.soundEnabled = true;

    state.wave = 1;

    state.selectedSlotIdx = 0;
    state.squadSlots = [...DEFAULT_NINE_SLOTS];

      1: [...DEFAULT_NINE_SLOTS],

    };

    ];
    state.attendance = { dayIndex: 0, lastClaimDate: null };

    state.claimedDaily = {};
    state.repeatCount = {};
    state.stats = { kills: 0, summons: 0, forges: 0 };
    state.recentRewardLog = null;

    initHeroes();
    applyLayout();
    spawnWaveEnemies(false);

  loadGame();

  function getEquipStats(item) {
    const tpl = EQUIP_TEMPLATES.find(t => t.id === item.tplId);
    if (!tpl) return { atk: 0, hp: 0, name: "장비", slotType: "무기" };
    const scale = 1 + (item.lv - 1) * 0.25;
    return {
      atk: Math.round(tpl.baseAtk * scale),
      hp: Math.round(tpl.baseHp * scale),
      name: tpl.name,
      slotType: tpl.slotType
    };
  }

  function getHeroEquippedBySlot(heroId) {
    const map = { "무기": null, "방어구": null, "신물": null };
    for (const it of state.equipmentInv) {
      if (it.equippedHeroId === heroId) {
        const st = getEquipStats(it);
        if (Object.prototype.hasOwnProperty.call(map, st.slotType)) {
          map[st.slotType] = { item: it, stats: st };
        }
      }
    }
    return map;
  }

  function getHeroEquippedBonus(heroId) {
    const slotMap = getHeroEquippedBySlot(heroId);
    let atk = 0;
    let hp = 0;
    for (const key of Object.keys(slotMap)) {
      if (slotMap[key]) {
        atk += slotMap[key].stats.atk;
        hp += slotMap[key].stats.hp;
      }
    }
    return { atk, hp };
  }

  function grantRandomEquipmentDrop(sourceLabel = "던전 전리품") {
    const tpl = EQUIP_TEMPLATES[Math.floor(Math.random() * EQUIP_TEMPLATES.length)];
    const newItem = {
      uid: "eq_drop_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
      tplId: tpl.id,
      lv: 1,
      equippedHeroId: null
    };
    state.equipmentInv.push(newItem);
    return {
      source: sourceLabel,
      label: `[${tpl.slotType}] ${tpl.name} +1`
    };
  }

  function renderEquipModalContent() {
    const titleEl = document.getElementById("equip-modal-title");
    const boxEl = document.getElementById("equip-modal-content");
    if (!titleEl || !boxEl) return;

    const targetHeroId = state.squadSlots[state.selectedSlotIdx] || getActiveSquadIds()[0] || "yi_sunsin";
    const selHeroName = HERO_POOL.find(h => h.id === targetHeroId)?.name || "이순신";
    const heroSlotMap = getHeroEquippedBySlot(targetHeroId);

    titleEl.textContent = `🗡️ 장비창 (${selHeroName} · ${state.selectedSlotIdx + 1}칸)`;

    const slotsHtml = `
      <div class="equip-slots-strip">
        <div class="equip-slot-pill">
          <strong>무기 슬롯</strong>
          <div>${heroSlotMap["무기"] ? `${heroSlotMap["무기"].stats.name} +${heroSlotMap["무기"].item.lv}` : "비어 있음"}</div>
        </div>
        <div class="equip-slot-pill">
          <strong>방어구 슬롯</strong>
          <div>${heroSlotMap["방어구"] ? `${heroSlotMap["방어구"].stats.name} +${heroSlotMap["방어구"].item.lv}` : "비어 있음"}</div>
        </div>
        <div class="equip-slot-pill">
          <strong>신물 슬롯</strong>
          <div>${heroSlotMap["신물"] ? `${heroSlotMap["신물"].stats.name} +${heroSlotMap["신물"].item.lv}` : "비어 있음"}</div>
        </div>
      </div>
    `;

    const cardsHtml = state.equipmentInv.map(it => {
      const st = getEquipStats(it);
      const isOnSel = it.equippedHeroId === targetHeroId;
      const ownerName = it.equippedHeroId ? (HERO_POOL.find(h => h.id === it.equippedHeroId)?.name || "") : "미장착";
      const upCost = it.lv * 350;
      return `
        <div class="eq-card ${isOnSel ? "equipped" : ""}">
          <div style="font-size:12px;font-weight:800;">[${st.slotType}] ${st.name} +${it.lv}</div>
          <div class="hero-meta">공 +${st.atk} · 체 +${st.hp}</div>
          <div class="hero-meta">착용자: ${ownerName}</div>
          <div class="btn-row">
            <button class="mini-btn ${isOnSel ? "gold" : "primary"}" data-eq-toggle="${it.uid}" type="button">${isOnSel ? "해제" : `${st.slotType} 장착`}</button>
            <button class="mini-btn" data-eq-up="${it.uid}" type="button">강화(${upCost}냥)</button>
          </div>
        </div>
      `;
    }).join("");

    boxEl.innerHTML = `${slotsHtml}<div class="eq-grid">${cardsHtml}</div>`;

    boxEl.querySelectorAll("button[data-eq-toggle]").forEach(btn => {
      btn.addEventListener("click", () => {
        toggleEquipOnSelectedHero(btn.getAttribute("data-eq-toggle"));
        renderEquipModalContent();
      });
    });

    boxEl.querySelectorAll("button[data-eq-up]").forEach(btn => {
      btn.addEventListener("click", () => {
        upgradeEquipmentItem(btn.getAttribute("data-eq-up"));
        renderEquipModalContent();
      });
    });
  }

  function equipBestForSelectedHero() {
    const targetHeroId = state.squadSlots[state.selectedSlotIdx] || getActiveSquadIds()[0] || "yi_sunsin";
    const heroName = HERO_POOL.find(h => h.id === targetHeroId)?.name || "장수";
    const slotsToFill = ["무기", "방어구", "신물"];
    let equippedCnt = 0;

    for (const slotType of slotsToFill) {
      const already = state.equipmentInv.some(it => it.equippedHeroId === targetHeroId && getEquipStats(it).slotType === slotType);
      if (already) continue;
      const candidates = state.equipmentInv
        .filter(it => !it.equippedHeroId && getEquipStats(it).slotType === slotType)
        .sort((a, b) => (getEquipStats(b).atk + getEquipStats(b).hp) - (getEquipStats(a).atk + getEquipStats(a).hp));
      if (candidates.length > 0) {
        candidates[0].equippedHeroId = targetHeroId;
        equippedCnt += 1;
      }
    }

    if (equippedCnt === 0) {
      showToast(`${heroName}에게 일괄 장착할 빈 슬롯/장비가 없습니다.`);
      return;
    }
    AUDIO.upgrade();
    refreshAllyTeamHp(false);
    saveGame();
    updateHud();
    renderTabContent();
    renderEquipModalContent();
    showToast(`${heroName}에게 ${equippedCnt}부위 일괄 장착 완료!`);
  }

  function upgradeAllEquipmentBatch() {
    let upgradedCnt = 0;
    for (const it of state.equipmentInv) {
      const cost = it.lv * 350;
      if (state.gold >= cost) {
        state.gold -= cost;
        it.lv += 1;
        state.stats.forges += 1;
        upgradedCnt += 1;
      }
    }
    if (upgradedCnt === 0) {
      showToast("일괄 강화할 냥이 부족합니다.");
      return;
    }
    AUDIO.upgrade();
    refreshAllyTeamHp(false);
    saveGame();
    updateHud();
    renderTabContent();
    renderEquipModalContent();
    showToast(`장비 ${upgradedCnt}건 일괄 강화 완료!`);
  }

  function openEquipModal() {
    AUDIO.unlock();
    renderEquipModalContent();
    document.getElementById("equip-modal").classList.add("open");
  }

  function craftEquipment() {
    const costGold = 900;
    if (state.gold < costGold) {
      showToast("냥이 부족합니다 (900냥 필요).");
      return;
    }
    state.gold -= costGold;
    const tpl = EQUIP_TEMPLATES[Math.floor(Math.random() * EQUIP_TEMPLATES.length)];
    const newItem = {
      uid: "eq_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
      tplId: tpl.id,
      lv: 1,
      equippedHeroId: null
    };
    state.equipmentInv.push(newItem);
    AUDIO.summonNormal();
    saveGame();
    updateHud();
    renderTabContent();
    if (document.getElementById("equip-modal").classList.contains("open")) {
      renderEquipModalContent();
    }
    showToast(`⚒️ [${tpl.slotType}: ${tpl.name}] 제작 완료!`);
  }

  function toggleEquipOnSelectedHero(uid) {
    const item = state.equipmentInv.find(x => x.uid === uid);
    if (!item) return;
    const targetHeroId = state.squadSlots[state.selectedSlotIdx] || getActiveSquadIds()[0] || "yi_sunsin";
    const heroName = HERO_POOL.find(h => h.id === targetHeroId)?.name || "장수";
    const st = getEquipStats(item);

    if (item.equippedHeroId === targetHeroId) {
      item.equippedHeroId = null;
      showToast(`${heroName}의 [${st.slotType}] 슬롯을 비웠습니다.`);
    } else {
      for (const other of state.equipmentInv) {
        if (other.uid !== item.uid && other.equippedHeroId === targetHeroId) {
          const otherSt = getEquipStats(other);
          if (otherSt.slotType === st.slotType) {
            other.equippedHeroId = null;
          }
        }
      }
      item.equippedHeroId = targetHeroId;
      showToast(`${heroName} [${st.slotType}] 슬롯에 [${st.name}] 장착!`);
    }
    AUDIO.upgrade();
    refreshAllyTeamHp(false);
    saveGame();
    renderTabContent();
  }

  function upgradeEquipmentItem(uid) {
    const item = state.equipmentInv.find(x => x.uid === uid);
    if (!item) return;
    const cost = item.lv * 350;
    if (state.gold < cost) {
      showToast("장비 강화 냥이 부족합니다.");
      return;
    }
    state.gold -= cost;
    item.lv += 1;
    state.stats.forges += 1;
    AUDIO.upgrade();
    refreshAllyTeamHp(false);
    saveGame();
    updateHud();
    renderTabContent();
    showToast(`${getEquipStats(item).name} +${item.lv} 강화 성공!`);
  }

  function canClaimAttendanceToday() {
    checkDailyReset();
    return state.attendance.lastClaimDate !== getTodayKey();
  }

  function claimAttendanceReward() {
    checkDailyReset();
    if (!canClaimAttendanceToday()) {
      showToast("오늘 출석 보상은 이미 받았습니다.");
      return;
    }
    const idx = state.attendance.dayIndex % ATTENDANCE_REWARDS.length;
    const rew = ATTENDANCE_REWARDS[idx];
    state.gold += rew.gold;
    state.gem += rew.gem;
    state.soul += rew.soul;
    state.attendance.lastClaimDate = getTodayKey();
    state.attendance.dayIndex = (idx + 1) % ATTENDANCE_REWARDS.length;
    AUDIO.clear();
    saveGame();
    updateHud();
    renderTabContent();
    openClearRewardModal({
      source: `${rew.label} 출석 보상`,
      lines: [
        `<strong>획득 재화:</strong> 💰 +${formatNum(rew.gold)}냥 · 💎 +${formatNum(rew.gem)}옥 · 🔥 +${formatNum(rew.soul)} 영혼석`
      ]
    });
  }

  const builtInPortraitCache = new Map();
  function getBuiltInPortraitUrl(hero) {
    if (builtInPortraitCache.has(hero.id)) {
      return builtInPortraitCache.get(hero.id);
    }
    const nationBadge = {
      "조선": "#1d4ed8",
      "명나라": "#15803d",
      "일본": "#b45309",
      "몽골": "#0369a1",
      "천상": "#6d28d9"
    }[hero.nation] || "#334155";

    const shortLabel = hero.name.length > 6 ? hero.name.slice(0, 6) : hero.name;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="${hero.color}"/>
          <stop offset="100%" stop-color="#1e1b18"/>
        </linearGradient>
      </defs>
      <rect width="128" height="128" rx="16" fill="url(#g)"/>
      <circle cx="64" cy="52" r="28" fill="rgba(255,255,255,0.14)" stroke="#fde68a" stroke-width="2.5"/>
      <text x="64" y="61" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">${shortLabel}</text>
      <rect x="12" y="90" width="104" height="24" rx="10" fill="${nationBadge}" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <text x="64" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#fef9c3">${hero.emblem} ${hero.nation}</text>
    </svg>`;
    const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    builtInPortraitCache.set(hero.id, url);
    return url;
  }

  function getActiveSquadIds() {
    return state.squadSlots.filter(Boolean);
  }

  function getElementChains(squadIds) {
    const elems = new Set();
    for (const hid of squadIds) {
      const h = HERO_POOL.find(x => x.id === hid);
      if (!h || !h.element) continue;
      if (h.element.startsWith("수")) elems.add("수");
      else if (h.element.startsWith("뇌")) elems.add("뇌");
      else if (h.element.startsWith("화")) elems.add("화");
      else if (h.element.startsWith("풍")) elems.add("풍");
      else if (h.element.startsWith("목")) elems.add("목");
    }

    const chains = [];
    let chainBonusPct = 0;
    if (elems.has("수") && elems.has("뇌")) {
      chains.push({ id: "shock", name: "⚡ 감전 연쇄 (수+뇌)", bonus: 25, color: "#38bdf8" });
      chainBonusPct += 25;
    }
    if (elems.has("화") && elems.has("풍")) {
      chains.push({ id: "gale", name: "🌪️ 열풍 폭발 (화+풍)", bonus: 25, color: "#fb923c" });
      chainBonusPct += 25;
    }
    if (elems.has("목") && elems.has("화")) {
      chains.push({ id: "burn", name: "🔥 화목 연소 (목+화)", bonus: 20, color: "#f87171" });
      chainBonusPct += 20;
    }
    return { chains, chainBonusPct };
  }

  function getSynergySummary(squadIds) {
    const nationCount = {};
    const roleCount = {};
    for (const hid of squadIds) {
      const h = HERO_POOL.find(x => x.id === hid);
      if (!h) continue;
      nationCount[h.nation] = (nationCount[h.nation] || 0) + 1;
      roleCount[h.role] = (roleCount[h.role] || 0) + 1;
    }

    const activeItems = [];
    let atkBonusPct = state.forge.weaponLv * 8 + state.mastery.atkLv * 6;
    let hpBonusPct = state.forge.armorLv * 10 + state.mastery.hpLv * 8;

    for (const [nat, cnt] of Object.entries(nationCount)) {
      if (cnt >= 2) {
        const bonus = cnt * 10;
        atkBonusPct += bonus;
        activeItems.push({ label: `${nat} ${cnt}인 결속 (공격 +${bonus}%)`, on: true });
      }
    }
    for (const [role, cnt] of Object.entries(roleCount)) {
      if (cnt >= 2) {
        const bonus = cnt * 12;
        hpBonusPct += bonus;
        activeItems.push({ label: `${role} 진형 (체력 +${bonus}%)`, on: true });
      }
    }

    const elemInfo = getElementChains(squadIds);
    atkBonusPct += elemInfo.chainBonusPct;
    for (const ch of elemInfo.chains) {
      activeItems.push({ label: `${ch.name} (공격 +${ch.bonus}%)`, on: true });
    }

    if (activeItems.length === 0) {
      activeItems.push({ label: "시너지 대기중 · 국적/역할 2인↑ 또는 수+뇌/화+풍/목+화 조합", on: false });
    }

    return { nationCount, roleCount, activeItems, atkBonusPct, hpBonusPct, chains: elemInfo.chains };
  }

  function getHeroSynergyHint(hero) {
    const activeIds = getActiveSquadIds();
    const syn = getSynergySummary(activeIds);
    const sameNat = syn.nationCount[hero.nation] || 0;
    const sameRole = syn.roleCount[hero.role] || 0;
    const isInSquad = activeIds.includes(hero.id);

    if (isInSquad) {
      if (sameNat >= 2 && sameRole >= 2) return `출전중 · ${hero.nation}·${hero.role} 시너지 활성`;
      if (sameNat >= 2) return `출전중 · ${hero.nation} 결속 활성`;
      if (sameRole >= 2) return `출전중 · ${hero.role} 진형 활성`;
      return `출전중 · 스킬: ${hero.skillName}`;
    }

    if (sameNat >= 1 || sameRole >= 1) {
      return `합류 시 ${sameNat >= 1 ? `${hero.nation} 결속` : ""}${sameNat >= 1 && sameRole >= 1 ? " + " : ""}${sameRole >= 1 ? `${hero.role} 진형` : ""} 활성!`;
    }
    return `스킬: ${hero.skillName} · ${hero.nation}/${hero.role}`;
  }

  function savePreset(slotKey) {
    state.presets[slotKey] = [...state.squadSlots];
    AUDIO.upgrade();
    saveGame();
    renderTabContent();
    showToast(`프리셋 ${slotKey}번 저장 완료!`);
  }

  function loadPreset(slotKey) {
    const raw = state.presets[slotKey];
    const sanitized = sanitizeSlots(raw);
    if (!sanitized.some(Boolean)) {
      showToast(`프리셋 ${slotKey}번이 비어 있습니다.`);
      return;
    }
    state.squadSlots = sanitized;
    AUDIO.upgrade();
    refreshAllyTeamHp(true);
    saveGame();
    renderTabContent();
    showToast(`프리셋 ${slotKey}번 불러오기 완료!`);
  }

  function autoAssignSquad() {
    const owned = HERO_POOL.filter(h => state.heroes[h.id] && state.heroes[h.id].unlocked);
    if (owned.length === 0) return;

    const nationGroups = {};
    for (const h of owned) {
      if (!nationGroups[h.nation]) nationGroups[h.nation] = [];
      nationGroups[h.nation].push(h);
    }

    const sortedNations = Object.values(nationGroups).sort((a, b) => b.length - a.length);
    const picked = [];
    const usedIds = new Set();

    for (const grp of sortedNations) {
      const grpSorted = [...grp].sort((x, y) => getHeroPower(y.id).atk - getHeroPower(x.id).atk);
      for (const h of grpSorted) {
        if (picked.length < SQUAD_SIZE && !usedIds.has(h.id)) {
          picked.push(h.id);
          usedIds.add(h.id);
        }
      }
    }

    const remainSorted = [...owned].sort((x, y) => getHeroPower(y.id).atk - getHeroPower(x.id).atk);
    for (const h of remainSorted) {
      if (picked.length < SQUAD_SIZE && !usedIds.has(h.id)) {
        picked.push(h.id);
        usedIds.add(h.id);
      }
    }

    state.squadSlots = Array.from({ length: SQUAD_SIZE }, (_, idx) => picked[idx] || null);
    AUDIO.upgrade();
    refreshAllyTeamHp(true);
    saveGame();
    renderTabContent();
    showToast("⚡ 9인 시너지 자동배치 완료!");
  }

  const imgCache = new Map();
  function getLoadedImage(src) {
    if (!src) return null;
    if (imgCache.has(src)) {
      const entry = imgCache.get(src);
      return entry.ready ? entry.img : null;
    }
    const img = new Image();
    const entry = { img, ready: false };
    img.onload = () => { entry.ready = true; };
    img.onerror = () => { entry.ready = false; };
    img.src = src;
    imgCache.set(src, entry);
    return null;
  }

  function getHeroImageSrc(heroId) {
    if (state.customImages[heroId]) return state.customImages[heroId];
    return `./assets/${heroId}.png`;
  }

  function renderHeroVisualHtml(hero, heightPx = 78) {
    const imgSrc = getHeroImageSrc(hero.id);
    const loadedImg = getLoadedImage(imgSrc);
    const displaySrc = (loadedImg && imgSrc) ? imgSrc : getBuiltInPortraitUrl(hero);
    return `<img class="hero-thumb" style="height:${heightPx}px;" src="${displaySrc}" alt="${hero.name}" />`;
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.style.display = "block";
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => {
      el.style.display = "none";
    }, 2400);
  }

  function openClearRewardModal(info) {
    const modal = document.getElementById("clear-reward-modal");
    const titleEl = document.getElementById("clear-modal-title");
    const bodyEl = document.getElementById("clear-modal-body");
    if (!modal || !titleEl || !bodyEl) return;

    titleEl.textContent = `🏆 ${info.source}`;
    bodyEl.innerHTML = info.lines.map(line => `<div>${line}</div>`).join("");
    modal.classList.add("open");
  }

  function formatNum(n) {
    return Math.floor(n).toLocaleString("ko-KR");
  }

  function getStageIndex() {
    return (state.chapter - 1) * 10 + (state.stageNum - 1);
  }

  function getStageName() {
    if (state.activeSpecialEncounter) {
      return `${state.activeSpecialEncounter.title} 전투 중`;
    }
    const title = STAGE_TITLES[(state.stageNum - 1) % STAGE_TITLES.length];
    return `${state.chapter}-${state.stageNum} ${title} (${state.wave}/${state.maxWave})`;
  }

  function getHeroPower(heroId) {
    const base = HERO_POOL.find(h => h.id === heroId);
    const st = state.heroes[heroId];
    if (!base || !st) return { atk: 100, maxHp: 1000 };
    const eqBonus = getHeroEquippedBonus(heroId);
    const lvScale = 1 + (st.level - 1) * 0.15;
    const starScale = 1 + (st.star - 1) * 0.35;
    return {
      atk: Math.round((base.baseAtk + eqBonus.atk) * lvScale * starScale),
      maxHp: Math.round((base.baseHp + eqBonus.hp) * lvScale * starScale)
    };
  }

  function getTotalAllyMaxHp() {
    const activeIds = getActiveSquadIds();
    const syn = getSynergySummary(activeIds);
    let sumHp = 0;
    for (const hid of activeIds) {
      sumHp += getHeroPower(hid).maxHp;
    }
    return Math.max(500, Math.round(sumHp * (1 + syn.hpBonusPct / 100)));
  }

  function refreshAllyTeamHp(fullHeal = false) {
    const nextMax = getTotalAllyMaxHp();
    if (fullHeal || state.allyMaxHp <= 0) {
      state.allyMaxHp = nextMax;
      state.allyHp = nextMax;
    } else {
      const ratio = Math.min(1, Math.max(0, state.allyHp / state.allyMaxHp));
      state.allyMaxHp = nextMax;
      state.allyHp = Math.max(1, Math.round(nextMax * ratio));
    }
  }

  function getTotalSquadDps() {
    const activeIds = getActiveSquadIds();
    const syn = getSynergySummary(activeIds);
    let baseSum = 0;
    for (const hid of activeIds) {
      baseSum += getHeroPower(hid).atk;
    }
    return Math.round(baseSum * (1 + syn.atkBonusPct / 100));
  }

  function getDifficultyMetrics(diffObj) {
    const sIdx = Math.max(0, getStageIndex());
    const mobHp = Math.round(450 * Math.pow(1.22, sIdx) * Math.pow(diffObj.hpPow, sIdx));
    const bossHp = Math.round(mobHp * 3.8);
    const recDps = Math.max(400, Math.round(bossHp / 10));
    return { mobHp, bossHp, recDps };
  }

  function syncBgmTheme() {
    if (state.dungeonRunning) {
      AUDIO.setTheme("portal");
    } else if (state.activeSpecialEncounter || state.enemies.some(e => e.isBoss)) {
      AUDIO.setTheme("dungeon");
    } else {
      AUDIO.setTheme("field");
    }
  }

  function triggerShake(duration = 0.14, mag = 4) {
    state.shakeTime = Math.max(state.shakeTime, duration);
    state.shakeMag = Math.max(state.shakeMag, mag);
  }

  function spawnHitSparks(xRatio, yRatio, color = "#fde047", count = 7) {
    for (let i = 0; i < count; i++) {
      const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
      const spd = 0.14 + Math.random() * 0.22;
      state.sparks.push({
        xRatio,
        yRatio,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 0.06,
        alpha: 1,
        size: 2.5 + Math.random() * 2.5,
        color
      });
    }
  }

  function spawnChainEffect(chainObj, xRatio, yRatio) {
    AUDIO.chain();
    if (chainObj.id === "shock") {
      state.lightningBolts.push({ xRatio, yRatio, alpha: 1, color: "#38bdf8" });
      spawnHitSparks(xRatio, yRatio, "#38bdf8", 10);
    } else if (chainObj.id === "gale") {
      state.effects.push({ xRatio, yRatio, radius: 18, maxRadius: 72, alpha: 0.95, color: "#fb923c" });
      spawnHitSparks(xRatio, yRatio, "#fb923c", 9);
    } else {
      state.effects.push({ xRatio, yRatio, radius: 14, maxRadius: 56, alpha: 0.9, color: "#f87171" });
      spawnHitSparks(xRatio, yRatio, "#f87171", 9);
    }
  }

  function pushDamagePopup(xRatio, yRatio, amount, label = "", element = "화(火)", isCrit = false, isEnemyHit = false) {
    const dmgVal = Math.max(1, Math.round(amount));
    const elemColor = ELEMENT_COLORS[element] || "#ffffff";
    if (!isEnemyHit) {
      state.combo += 1;
      state.comboTimer = 2.4;
    }

    let text = `-${formatNum(dmgVal)}`;
    if (isCrit && label) {
      text = `💥${label} -${formatNum(dmgVal)}!`;
    } else if (isCrit) {
      text = `💥-${formatNum(dmgVal)}!`;
    } else if (label) {
      text = `${label} -${formatNum(dmgVal)}`;
    }

    state.floatingDamages.push({
      text,
      xRatio: xRatio + (Math.random() - 0.5) * 0.06,
      yRatio: Math.max(0.18, yRatio - 0.06),
      alpha: 1,
      isCrit: Boolean(isCrit),
      color: isEnemyHit ? "#fca5a5" : (isCrit ? "#fde047" : elemColor)
    });
    if (state.floatingDamages.length > 32) {
      state.floatingDamages.shift();
    }
  }

  function handleBattleTap(e) {
    AUDIO.unlock();
    if (state.dungeonRunning || state.enemies.length === 0) return;
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const xRatio = Math.min(0.92, Math.max(0.12, (e.clientX - rect.left) / rect.width));
    const yRatio = Math.min(0.86, Math.max(0.24, (e.clientY - rect.top) / rect.height));

    const isCrit = Math.random() < 0.35;
    if (isCrit) AUDIO.crit();
    else AUDIO.tapStrike();

    triggerShake(isCrit ? 0.12 : 0.08, isCrit ? 4 : 2.5);
    const resMult = 1 + state.mastery.resLv * 0.1;
    state.resonance = Math.min(100, state.resonance + 3 * resMult);

    const baseTap = Math.max(40, Math.round(getTotalSquadDps() * 0.45));
    const tapDmg = isCrit ? Math.round(baseTap * 1.75) : baseTap;
    for (const en of state.enemies) {
      en.hp -= tapDmg;
      en.hitFlash = 0.16;
    }

    pushDamagePopup(xRatio, yRatio, tapDmg, "⚔️일격", "뇌(雷)", isCrit, false);
    spawnHitSparks(xRatio, yRatio, isCrit ? "#fde047" : "#38bdf8", isCrit ? 11 : 7);
    state.effects.push({
      xRatio,
      yRatio,
      radius: 14,
      maxRadius: isCrit ? 68 : 50,
      alpha: 0.85,
      color: isCrit ? "#fde047" : "#38bdf8"
    });

    const prevEnemies = state.enemies.length;
    state.enemies = state.enemies.filter(en => en.hp > 0);
    const defeated = Math.max(0, prevEnemies - state.enemies.length);
    if (defeated > 0) {
      state.stats.kills += defeated;
      gainMasteryExp(defeated * 18);
    }
    if (state.enemies.length === 0) {
      onWaveCleared();
    }
    updateHud();
  }

  function spawnWaveEnemies(isBossForce = false) {
    state.activeSpecialEncounter = null;
    const diff = DIFFICULTIES[state.difficultyIdx] || DIFFICULTIES[0];
    const metrics = getDifficultyMetrics(diff);
    const isBoss = isBossForce || state.wave === state.maxWave;
    const count = isBoss ? 1 : 3;
    const baseHp = isBoss ? metrics.bossHp : metrics.mobHp;
    const baseAtk = Math.max(18, Math.round(26 * Math.pow(1.12, getStageIndex()) * Math.pow(diff.hpPow, Math.min(8, getStageIndex())) * (isBoss ? 1.5 : 1)));

    state.enemies = [];
    for (let i = 0; i < count; i++) {
      state.enemies.push({
        id: "e_" + Math.random().toString(36).slice(2, 8),
        name: isBoss ? `${getStageName().split(" ")[1]} 수호신` : `흉수 ${i + 1}`,
        isBoss,
        hp: baseHp,
        maxHp: baseHp,
        atk: baseAtk,
        xRatio: 0.72 + i * 0.08,
        yRatio: isBoss ? 0.64 : 0.56 + i * 0.11,
        hitFlash: 0,
        startedAt: Date.now()
      });
    }
    state.enemyAtkCooldown = 1.2;
    syncBgmTheme();
  }

  function startSpecialBattle(cfg, isRaid) {
    AUDIO.unlock();
    if (state.dungeonRunning) return;
    enterDungeonTransition(
      `${cfg.name} 결계 전개 중...`,
      isRaid ? "거대 토벌 보스가 전장에 강림합니다" : "시련 결계의 수호자가 출현합니다",
      () => {
        const diff = DIFFICULTIES[state.difficultyIdx] || DIFFICULTIES[0];
        const sIdx = getStageIndex();
        const hp = Math.round(1400 * Math.pow(1.22, sIdx) * cfg.hpMult * Math.max(1, diff.hpPow));
        const bossAtk = Math.max(35, Math.round(45 * Math.pow(1.12, sIdx) * (isRaid ? 1.4 : 1.1)));
        state.activeSpecialEncounter = {
          title: cfg.name,
          soulReward: cfg.soulReward,
          gemReward: cfg.gemReward,
          goldReward: cfg.goldReward,
          dropChance: cfg.dropChance || 0.5,
          startedAt: Date.now()
        };
        state.enemies = [{
          id: "sp_" + Math.random().toString(36).slice(2, 8),
          name: cfg.name,
          isBoss: true,
          hp,
          maxHp: hp,
          atk: bossAtk,
          xRatio: 0.76,
          yRatio: 0.62,
          hitFlash: 0
        }];
        state.enemyAtkCooldown = 1.0;
        refreshAllyTeamHp(true);
        syncBgmTheme();
        updateHud();
        showToast(`${cfg.name} 출정! (HP ${formatNum(hp)}) · 격파 시 보상 & 랜덤 장비 드랍`);
      }
    );
  }

  function advanceStage(delta) {
    const nextTotal = getStageIndex() + delta;
    const clamped = Math.max(0, nextTotal);
    state.chapter = Math.floor(clamped / 10) + 1;
    state.stageNum = (clamped % 10) + 1;
    state.wave = 1;
    spawnWaveEnemies(false);
    refreshAllyTeamHp(true);
    AUDIO.upgrade();
    saveGame();
    updateHud();
    showToast(`스테이지 이동: ${state.chapter}-${state.stageNum}`);
  }

  function onWaveCleared() {
    AUDIO.clear();
    triggerShake(0.16, 5);
    const diff = DIFFICULTIES[state.difficultyIdx] || DIFFICULTIES[0];
    const rewardMult = 1 + state.forge.tradeLv * 0.12 + state.mastery.rewardLv * 0.08;

    if (state.activeSpecialEncounter) {
      const sp = state.activeSpecialEncounter;
      const gGain = Math.round(sp.goldReward * rewardMult);
      const expGain = 85;
      const secTaken = Math.max(1, Math.round((Date.now() - (sp.startedAt || Date.now())) / 1000));
      state.gold += gGain;
      state.gem += sp.gemReward;
      state.soul += sp.soulReward;
      state.resonance = Math.min(100, state.resonance + 30);
      gainMasteryExp(expGain);

      const gotDrop = Math.random() < (sp.dropChance || 0.5) ? grantRandomEquipmentDrop(sp.title) : null;
      const lines = [
        `<strong>획득 재화:</strong> 💰 +${formatNum(gGain)}냥 · 💎 +${formatNum(sp.gemReward)}옥 · 🔥 +${formatNum(sp.soulReward)} 영혼석`,
        `<strong>성장/전투 정보:</strong> 👑 마스터EXP +${formatNum(expGain)} · 소요 ${secTaken}초 · 공명 +30%`,
        `<strong>랜덤 장비 득템:</strong> ${gotDrop ? `🗡️ <strong>${gotDrop.label}</strong> 획득!` : "아쉽게도 이번엔 장비가 나오지 않았습니다."}`
      ];

      state.recentRewardLog = {
        source: sp.title,
        detail: `소요 ${secTaken}초 · +${formatNum(gGain)}냥 · +${sp.gemReward}옥 · +${sp.soulReward}석${gotDrop ? ` · 득템: ${gotDrop.label}` : ""}`
      };
      openClearRewardModal({ source: `${sp.title} 격파`, lines });

      state.activeSpecialEncounter = null;
      spawnWaveEnemies(false);
      refreshAllyTeamHp(true);
      saveGame();
      updateHud();
      if (state.activeTab === "dungeon" || state.activeTab === "squad") {
        renderTabContent();
      }
      return;
    }

    const wasBossWave = state.wave === state.maxWave;
    const goldGain = Math.round((150 + getStageIndex() * 40) * diff.rewardMult * rewardMult);
    const gemGain = wasBossWave ? Math.max(8, Math.round(14 * Math.sqrt(diff.rewardMult) * rewardMult)) : 0;
    const expGain = wasBossWave ? 65 : 30;
    state.gold += goldGain;
    state.gem += gemGain;
    state.resonance = Math.min(100, state.resonance + 25);
    gainMasteryExp(expGain);

    const bossDrop = wasBossWave && Math.random() < 0.35
      ? grantRandomEquipmentDrop(`${state.chapter}-${state.stageNum} 보스`)
      : null;

    state.recentRewardLog = {
      source: `${state.chapter}-${state.stageNum} (${state.wave}/${state.maxWave} 웨이브)`,
      detail: `+${formatNum(goldGain)}냥${gemGain ? ` · +${gemGain}옥` : ""} · +${expGain} 마스터EXP${bossDrop ? ` · 득템: ${bossDrop.label}` : ""}`
    };

    if (wasBossWave) {
      const lines = [
        `<strong>획득 재화:</strong> 💰 +${formatNum(goldGain)}냥 · 💎 +${formatNum(gemGain)}옥`,
        `<strong>성장/전투 정보:</strong> 👑 마스터EXP +${formatNum(expGain)} · 공명 +25%`
      ];
      if (bossDrop) {
        lines.push(`<strong>랜덤 장비 득템:</strong> 🗡️ <strong>${bossDrop.label}</strong> 획득!`);
      }
      openClearRewardModal({
        source: `${state.chapter}-${state.stageNum} 보스 돌파`,
        lines
      });
    } else {
      showToast(`웨이브 클리어! +${formatNum(goldGain)}냥`);
    }

    if (state.wave < state.maxWave) {
      state.wave += 1;
      spawnWaveEnemies(false);
    } else if (state.autoStage) {
      const nextTotal = getStageIndex() + 1;
      state.chapter = Math.floor(nextTotal / 10) + 1;
      state.stageNum = (nextTotal % 10) + 1;
      state.wave = 1;
      spawnWaveEnemies(false);
      refreshAllyTeamHp(true);
    } else {
      state.wave = 1;
      spawnWaveEnemies(false);
    }
    saveGame();
    updateHud();
    if (state.activeTab === "squad" || state.activeTab === "roster" || state.activeTab === "dungeon") {
      renderTabContent();
    }
  }

  function triggerUltimate() {
    AUDIO.unlock();
    if (state.resonance < 100) {
      showToast("공명 게이지 100% 달성 시 발동 가능!");
      return;
    }
    state.resonance = 0;
    AUDIO.ultimate();
    triggerShake(0.28, 8);
    const totalDmg = Math.max(300, getTotalSquadDps() * 3);

    for (const en of state.enemies) {
      en.hp -= totalDmg;
      en.hitFlash = 0.25;
      pushDamagePopup(en.xRatio, en.yRatio, totalDmg, "⚡천지개벽", "뇌(雷)", true, false);
      spawnHitSparks(en.xRatio, en.yRatio, "#fde047", 14);
      state.effects.push({ xRatio: en.xRatio, yRatio: en.yRatio, radius: en.isBoss ? 78 : 52, maxRadius: 120, alpha: 0.95, color: "#f59e0b" });
    }
    const beforeLen = state.enemies.length;
    state.enemies = state.enemies.filter(e => e.hp > 0);
    const defeated = Math.max(0, beforeLen - state.enemies.length);
    if (defeated > 0) {
      state.stats.kills += defeated;
      gainMasteryExp(defeated * 20);
    }
    saveGame();
    showToast(`⚡ 천지개벽 협동필살! (${formatNum(totalDmg)} 피해)`);
    if (state.enemies.length === 0) {
      onWaveCleared();
    }
    updateHud();
  }

  function assignHeroToSelectedSlot(heroId) {
    const st = state.heroes[heroId];
    const heroObj = HERO_POOL.find(h => h.id === heroId);
    if (!st || !st.unlocked || !heroObj) {
      showToast("미보유 장수입니다. 태극소환에서 영입하세요!");
      return;
    }

    const slotIdx = state.selectedSlotIdx;
    const currentInSlot = state.squadSlots[slotIdx];
    const existingSlotIdx = state.squadSlots.indexOf(heroId);

    if (currentInSlot === heroId) {
      if (getActiveSquadIds().length <= 1) {
        showToast("최소 1명 이상은 출전을 유지해야 합니다.");
        return;
      }
      state.squadSlots[slotIdx] = null;
      showToast(`${slotIdx + 1}번 칸에서 ${heroObj.name} 편성을 해제했습니다.`);
    } else if (existingSlotIdx >= 0) {
      state.squadSlots[existingSlotIdx] = currentInSlot;
      state.squadSlots[slotIdx] = heroId;
      showToast(`${slotIdx + 1}번 칸과 ${existingSlotIdx + 1}번 칸 배치를 맞바꿨습니다.`);
    } else {
      state.squadSlots[slotIdx] = heroId;
      showToast(`${slotIdx + 1}번 칸에 ${heroObj.name} 배치 완료!`);
    }

    AUDIO.upgrade();
    refreshAllyTeamHp(false);
    saveGame();
    renderTabContent();
  }

  function clearSelectedSlot() {
    const slotIdx = state.selectedSlotIdx;
    if (!state.squadSlots[slotIdx]) {
      showToast(`${slotIdx + 1}번 칸이 이미 비어 있습니다.`);
      return;
    }
    if (getActiveSquadIds().length <= 1) {
      showToast("최소 1명 이상은 출전을 유지해야 합니다.");
      return;
    }
    state.squadSlots[slotIdx] = null;
    AUDIO.upgrade();
    refreshAllyTeamHp(false);
    saveGame();
    showToast(`${slotIdx + 1}번 칸을 비웠습니다.`);
    renderTabContent();
  }

  function levelUpHero(heroId) {
    const st = state.heroes[heroId];
    if (!st || !st.unlocked) return;
    const cost = st.level * 150;
    if (state.gold < cost) {
      showToast("냥이 부족합니다!");
      return;
    }
    state.gold -= cost;
    st.level += 1;
    AUDIO.upgrade();
    refreshAllyTeamHp(false);
    saveGame();
    updateHud();
    renderTabContent();
    showToast(`Lv.${st.level} 달성!`);
  }

  function upgradeAllSquadHeroes() {
    const activeIds = getActiveSquadIds();
    let count = 0;
    for (const hid of activeIds) {
      const st = state.heroes[hid];
      if (!st || !st.unlocked) continue;
      const cost = st.level * 150;
      if (state.gold >= cost) {
        state.gold -= cost;
        st.level += 1;
        count += 1;
      }
    }
    if (count === 0) {
      showToast("강화할 냥이 부족합니다.");
      return;
    }
    AUDIO.upgrade();
    refreshAllyTeamHp(false);
    saveGame();
    updateHud();
    renderTabContent();
    showToast(`출전 장수 ${count}명 일괄 강화 완료!`);
  }

  function promoteStarHero(heroId) {
    const st = state.heroes[heroId];
    if (!st || !st.unlocked) return;
    if (st.star >= 6) {
      showToast("이미 ★6 최고 성급입니다.");
      return;
    }
    const cost = st.star * 10;
    if (state.soul < cost) {
      showToast(`영혼석 ${cost}개가 필요합니다.`);
      return;
    }
    state.soul -= cost;
    st.star += 1;
    AUDIO.summonSpecial();
    refreshAllyTeamHp(false);
    saveGame();
    updateHud();
    renderTabContent();
    showToast(`★${st.star} 성급 돌파 성공!`);

  function openSummonModal(results, count) {
    const modal = document.getElementById("summon-modal");
    const titleEl = document.getElementById("summon-modal-title");
    const sumEl = document.getElementById("summon-modal-summary");
    const gridEl = document.getElementById("summon-modal-grid");
    if (!modal || !gridEl) return;

    const newCount = results.filter(r => r.isNew).length;

    titleEl.textContent = `🔮 태극소환 ${count}연 결과`;
    sumEl.textContent = `신규 영입 ${newCount}명 · 중복 변환 영혼석 +${soulGain}`;
    gridEl.innerHTML = "";

    results.forEach((item, idx) => {
      const card = document.createElement("div");
      card.className = `summon-item-card ${item.isNew ? "new-hero" : ""}`;

        </div>
      `;
      gridEl.appendChild(card);
    });

    modal.classList.add("open");

  function doSummon(count) {
    AUDIO.unlock();
    const cost = count === 10 ? 180 : 20;
    if (state.gem < cost) {
      showToast("옥이 부족합니다!");
      return;
    }
    state.gem -= cost;
    state.stats.summons += count;
    gainMasteryExp(count * 12);

    const results = [];
    let hasSpecial = count === 10;
    for (let i = 0; i < count; i++) {
      const pick = HERO_POOL[Math.floor(Math.random() * HERO_POOL.length)];
      const st = state.heroes[pick.id];
      let isNew = false;
      let soulBonus = 0;
      if (!st.unlocked) {
        st.unlocked = true;
        isNew = true;
        hasSpecial = true;
      } else {
        soulBonus = 4;
        state.soul += soulBonus;
      }
      if (pick.nation === "천상" || pick.baseAtk >= 175) {
        hasSpecial = true;
      }
      results.push({ hero: pick, isNew, soulBonus });
    }

    if (hasSpecial) {
      AUDIO.summonSpecial();
    } else {
      AUDIO.summonNormal();
    }

    saveGame();
    updateHud();
    if (state.activeTab === "roster" || state.activeTab === "squad" || state.activeTab === "dungeon") {
      renderTabContent();
    }
    openSummonModal(results, count);
  }

  function enterDungeonTransition(titleText, subText, onComplete) {
    if (state.dungeonRunning) return;
    state.dungeonRunning = true;
    syncBgmTheme();
    AUDIO.portal();

    const overlay = document.getElementById("dungeon-transition");
    const titleEl = document.getElementById("dungeon-tr-title");
    const subEl = document.getElementById("dungeon-tr-sub");
    const barEl = document.getElementById("dungeon-tr-bar");

    titleEl.textContent = titleText;
    subEl.textContent = subText;
    barEl.style.width = "0%";
    overlay.classList.add("active");

    let progress = 0;
    const timer = setInterval(() => {
      progress += 18;
      barEl.style.width = `${Math.min(100, progress)}%`;
      if (progress >= 100) {
        clearInterval(timer);
        setTimeout(() => {
          overlay.classList.remove("active");
          state.dungeonRunning = false;
          onComplete();
          syncBgmTheme();
          saveGame();
          updateHud();
        }, 120);
      }
    }, 70);
  }

  function claimDailyQuest(qDef) {
    checkDailyReset();
    const curVal = state.stats[qDef.targetKey] || 0;
    if (curVal < qDef.target) {
      showToast("일일 목표를 아직 채우지 못했습니다.");
      return;
    }
    if (state.claimedDaily[qDef.id]) {
      showToast("오늘 이미 수령한 일일 퀘스트입니다.");
      return;
    }
    state.claimedDaily[qDef.id] = true;
    state.gold += qDef.gold;
    state.soul += qDef.soul;
    state.gem += qDef.gem;
    AUDIO.clear();
    saveGame();
    updateHud();
    renderTabContent();
    openClearRewardModal({
      source: "일일 퀘스트 완료",
      lines: [
        `<strong>완료 항목:</strong> ${qDef.title}`,
        `<strong>획득 보상:</strong> 💰 +${formatNum(qDef.gold)}냥 · 💎 +${formatNum(qDef.gem)}옥 · 🔥 +${formatNum(qDef.soul)} 영혼석`
      ]
    });

  function claimRepeatMission(rDef) {
    const repIdx = state.repeatCount[rDef.id] || 0;
    const goal = rDef.baseTarget + repIdx * rDef.stepTarget;
    const curVal = state.stats[rDef.targetKey] || 0;
    if (curVal < goal) {
      showToast("반복 미션 목표를 아직 채우지 못했습니다.");
      return;
    }
    state.repeatCount[rDef.id] = repIdx + 1;
    state.gold += rDef.gold;
    state.soul += rDef.soul;
    state.gem += rDef.gem;
    AUDIO.clear();
    saveGame();
    updateHud();
    renderTabContent();
    openClearRewardModal({
      source: `반복 미션 ${repIdx + 1}회차 완료`,
      lines: [
        `<strong>완료 항목:</strong> ${rDef.title} (${repIdx + 1}회차)`,
        `<strong>획득 보상:</strong> 💰 +${formatNum(rDef.gold)}냥 · 💎 +${formatNum(rDef.gem)}옥 · 🔥 +${formatNum(rDef.soul)} 영혼석`
      ]
    });
  }

  function claimAllReadyMissions() {
    checkDailyReset();
    let totalGold = 0;
    let totalGem = 0;
    let totalSoul = 0;
    let claimedCount = 0;
    const doneTitles = [];

    for (const qDef of DAILY_QUEST_DEFS) {
      const curVal = state.stats[qDef.targetKey] || 0;
      if (curVal >= qDef.target && !state.claimedDaily[qDef.id]) {
        state.claimedDaily[qDef.id] = true;
        totalGold += qDef.gold;
        totalGem += qDef.gem;
        totalSoul += qDef.soul;
        claimedCount += 1;
        doneTitles.push(qDef.title);
      }
    }

    for (const rDef of REPEAT_MISSION_DEFS) {
      while (true) {
        const repIdx = state.repeatCount[rDef.id] || 0;
        const goal = rDef.baseTarget + repIdx * rDef.stepTarget;
        const curVal = state.stats[rDef.targetKey] || 0;
        if (curVal >= goal) {
          state.repeatCount[rDef.id] = repIdx + 1;
          totalGold += rDef.gold;
          totalGem += rDef.gem;
          totalSoul += rDef.soul;
          claimedCount += 1;
          doneTitles.push(`${rDef.title} (${repIdx + 1}회차)`);
        } else {
          break;
        }
      }
    }

    if (claimedCount === 0) {
      showToast("수령 가능한 완료 미션이 없습니다.");
      return;
    }

    state.gold += totalGold;
    state.gem += totalGem;
    state.soul += totalSoul;
    AUDIO.summonSpecial();
    saveGame();
    updateHud();
    renderTabContent();

    openClearRewardModal({
      source: `임무 전체 받기 (${claimedCount}건 수령)`,
      lines: [
        `<strong>누적 획득 재화:</strong> 💰 +${formatNum(totalGold)}냥 · 💎 +${formatNum(totalGem)}옥 · 🔥 +${formatNum(totalSoul)} 영혼석`,
        `<strong>수령 내역:</strong> ${doneTitles.join(", ")}`
      ]
    });
  }

  function renderDifficultyModal() {
    const list = document.getElementById("diff-list");
    if (!list) return;
    list.innerHTML = "";
    const curDps = Math.max(1, getTotalSquadDps());

    for (const d of DIFFICULTIES) {
      const m = getDifficultyMetrics(d);
      const estBossSec = (m.bossHp / curDps).toFixed(1);
      let fitLabel = "화력 부족";
      let fitColor = "var(--accent-crimson)";
      if (curDps >= m.recDps) {
        fitLabel = "여유 (10초 내 처치)";
        fitColor = "var(--accent-jade)";
      } else if (curDps >= m.recDps * 0.45) {
        fitLabel = `접전 (약 ${estBossSec}초)`;
        fitColor = "var(--accent-gold)";
      }

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = `diff-item ${state.difficultyIdx === d.id ? "active" : ""}`;
      btn.innerHTML = `
        <div>
          <strong>${d.id + 1}. ${d.name}</strong>
          <div class="hero-meta">일반 HP ${formatNum(m.mobHp)} · 보스 HP ${formatNum(m.bossHp)}</div>
          <div class="hero-meta">권장 DPS ${formatNum(m.recDps)} (내 DPS ${formatNum(curDps)}) · ${d.recHero}</div>
          <div style="font-size:11px;color:var(--ink-main);margin-top:2px;">💡 ${d.tip}</div>
        </div>
        <div style="text-align:right;flex:none;">
          <div style="font-size:12px;font-weight:700;color:var(--accent-jade);">보상 ×${d.rewardMult}</div>
          <div style="font-size:10px;font-weight:700;color:${fitColor};">${fitLabel}</div>
        </div>
      `;
      btn.addEventListener("click", () => {
        state.difficultyIdx = d.id;
        spawnWaveEnemies(false);
        AUDIO.upgrade();
        saveGame();
        updateHud();
        renderDifficultyModal();

        showToast(`난이도 변경: ${d.name} (보스 HP ${formatNum(getDifficultyMetrics(d).bossHp)})`);
      });
      list.appendChild(btn);
    }
  }

    ultBtn.classList.toggle("ready", state.resonance >= 100);

    document.getElementById("res-gem").textContent = `💎 ${formatNum(state.gem)}옥`;

    document.getElementById("res-master").textContent = `👑 마스터 Lv.${state.mastery.level} (MP ${state.mastery.points})`;
