  const canvas = document.getElementById("battle-canvas");
  const ctx = canvas.getContext("2d");

  function resizeCanvas() {
    const pane = document.getElementById("battle-pane");
    if (!pane || !canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = pane.clientWidth;
    const h = pane.clientHeight;
    canvas.width = Math.max(1, Math.floor(w * dpr));
    canvas.height = Math.max(1, Math.floor(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function stepBattle(rawDt) {
    if (state.dungeonRunning) return;
    const spd = SPEEDS[state.speedIdx] || 1;
    const dt = rawDt * spd;

    if (state.shakeTime > 0) {
      state.shakeTime = Math.max(0, state.shakeTime - rawDt);
    }

    if (state.comboTimer > 0) {
      state.comboTimer -= dt;
      if (state.comboTimer <= 0) {
        state.comboTimer = 0;
        state.combo = 0;
      }
    }

    if (state.enemies.length === 0) {
      state.waveTimer += dt;
      if (state.waveTimer > 0.6) {
        state.waveTimer = 0;
        spawnWaveEnemies(false);
      }
      return;
    }

    const activeIds = getActiveSquadIds();
    const totalDps = getTotalSquadDps();
    const deal = totalDps * dt * 1.15;
    const resMult = 1 + state.mastery.resLv * 0.1;
    const target = state.enemies[0];
    if (target) {
      target.hp -= deal;
      target.hitFlash = Math.max(0, target.hitFlash - dt);
      state.resonance = Math.min(100, state.resonance + dt * 9 * resMult);

      if (Math.random() < dt * 4) {
        const attackerId = activeIds[Math.floor(Math.random() * activeIds.length)];
        const attacker = HERO_POOL.find(x => x.id === attackerId);
        const elem = attacker ? attacker.element : "화(火)";
        const isCrit = Math.random() < 0.28;
        if (isCrit) AUDIO.crit();
        else AUDIO.hit();

        const popDmg = isCrit
          ? Math.max(24, totalDps * 0.48)
          : Math.max(12, totalDps * 0.26);

        state.projectiles.push({
          x: 0.34,
          y: 0.62,
          tx: target.xRatio,
          ty: target.yRatio,
          t: 0,
          color: ELEMENT_COLORS[elem] || "#fbbf24"
        });
        spawnHitSparks(target.xRatio, target.yRatio, ELEMENT_COLORS[elem] || "#fde047", isCrit ? 9 : 5);
        pushDamagePopup(target.xRatio, target.yRatio, popDmg, "", elem, isCrit, false);
      }

      for (const hid of activeIds) {
        const hero = HERO_POOL.find(x => x.id === hid);
        if (!hero) continue;
        state.skillTimers[hid] = (state.skillTimers[hid] || 0) + dt;
        if (state.skillTimers[hid] >= hero.cd) {
          state.skillTimers[hid] = 0;
          const isCrit = Math.random() < 0.35;
          AUDIO.skill();
          triggerShake(0.1, 3);
          const baseSkill = Math.max(80, Math.round(getHeroPower(hid).atk * 2.2));
          const skillDmg = isCrit ? Math.round(baseSkill * 1.5) : baseSkill;
          for (const en of state.enemies) {
            en.hp -= skillDmg;
            en.hitFlash = 0.2;
          }
          state.skillBanners.push({
            text: `${hero.name} · ${hero.skillName}!`,
            color: ELEMENT_COLORS[hero.element] || hero.color,
            alpha: 1,
            yRatio: 0.28 + Math.random() * 0.14
          });
          if (state.skillBanners.length > 4) state.skillBanners.shift();

          pushDamagePopup(target.xRatio, target.yRatio, skillDmg, `${hero.name}·${hero.skillName}`, hero.element, isCrit, false);
          spawnHitSparks(target.xRatio, target.yRatio, ELEMENT_COLORS[hero.element] || hero.color, 9);
          state.effects.push({
            xRatio: target.xRatio,
            yRatio: target.yRatio,
            radius: 20,
            maxRadius: 68,
            alpha: 0.9,
            color: ELEMENT_COLORS[hero.element] || hero.color
          });
        }
      }

      const chains = getElementChains(activeIds).chains;
      if (chains.length > 0 && Math.random() < dt * 1.6) {
        const pickedChain = chains[Math.floor(Math.random() * chains.length)];
        spawnChainEffect(pickedChain, target.xRatio, target.yRatio);
        state.chainTexts.push({
          text: pickedChain.name,
          xRatio: target.xRatio,
          yRatio: Math.max(0.2, target.yRatio - 0.12),
          alpha: 1
        });
      }

      state.enemyAtkCooldown -= dt;
      if (state.enemyAtkCooldown <= 0) {
        state.enemyAtkCooldown = 1.6;
        let enemyDmgSum = 0;
        for (const en of state.enemies) {
          enemyDmgSum += en.atk;
        }
        enemyDmgSum = Math.max(8, Math.round(enemyDmgSum * 0.45));
        state.allyHp = Math.max(0, state.allyHp - enemyDmgSum);
        AUDIO.enemyAttack();
        triggerShake(0.09, 3);
        pushDamagePopup(0.22, 0.56, enemyDmgSum, "👹적격", "화(火)", false, true);
        spawnHitSparks(0.22, 0.58, "#f87171", 6);

        if (state.allyHp <= 0) {
          refreshAllyTeamHp(true);
          showToast("🛡️ 아군 진형 재정비 완료! 체력이 회복되었습니다.");
        }
      }
    }

    const prevEnemies = state.enemies.length;
    state.enemies = state.enemies.filter(e => e.hp > 0);
    const defeated = Math.max(0, prevEnemies - state.enemies.length);
    if (defeated > 0) {
      state.stats.kills += defeated;
      gainMasteryExp(defeated * 18);
    }

    if (state.enemies.length === 0) {
      onWaveCleared();
    }

    for (const p of state.projectiles) {
      p.t = Math.min(1, p.t + dt * 4.5);
    }
    state.projectiles = state.projectiles.filter(p => p.t < 1);

    for (const ef of state.effects) {
      ef.alpha -= dt * 2.1;
      const maxR = ef.maxRadius || 90;
      ef.radius += (maxR - ef.radius) * Math.min(1, dt * 8);
    }
    state.effects = state.effects.filter(ef => ef.alpha > 0);

    for (const sp of state.sparks) {
      sp.xRatio += sp.vx * dt;
      sp.yRatio += sp.vy * dt;
      sp.vy += 0.45 * dt;
      sp.alpha -= dt * 2.6;
    }
    state.sparks = state.sparks.filter(sp => sp.alpha > 0);

    for (const lb of state.lightningBolts) {
      lb.alpha -= dt * 3.4;
    }
    state.lightningBolts = state.lightningBolts.filter(lb => lb.alpha > 0);

    for (const sb of state.skillBanners) {
      sb.yRatio -= dt * 0.05;
      sb.alpha -= dt * 1.15;
    }
    state.skillBanners = state.skillBanners.filter(sb => sb.alpha > 0);

    for (const ct of state.chainTexts) {
      ct.yRatio -= dt * 0.08;
      ct.alpha -= dt * 1.1;
    }
    state.chainTexts = state.chainTexts.filter(ct => ct.alpha > 0);

    for (const fd of state.floatingDamages) {
      fd.yRatio -= dt * 0.12;
      fd.alpha -= dt * 1.25;
    }
    state.floatingDamages = state.floatingDamages.filter(fd => fd.alpha > 0);

    const comboEl = document.getElementById("combo-badge");
    if (comboEl) comboEl.textContent = `${state.combo} COMBO`;
  }

  function drawBattle() {
    const pane = document.getElementById("battle-pane");
    if (!pane || !ctx) return;
    const w = pane.clientWidth;
    const h = pane.clientHeight;
    ctx.clearRect(0, 0, w, h);

    ctx.save();
    if (state.shakeTime > 0) {
      const dx = (Math.random() - 0.5) * state.shakeMag * 2;
      const dy = (Math.random() - 0.5) * state.shakeMag * 2;
      ctx.translate(dx, dy);
    }

    const bgImg = getLoadedImage(state.bgImageSrc);
    if (bgImg) {
      ctx.drawImage(bgImg, 0, 0, w, h);
    } else {
      const sky = ctx.createLinearGradient(0, 0, 0, h * 0.54);
      sky.addColorStop(0, "#7ec8e3");
      sky.addColorStop(1, "#e0f2fe");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h * 0.54);

      const ground = ctx.createLinearGradient(0, h * 0.54, 0, h);
      ground.addColorStop(0, "#dfd2b5");
      ground.addColorStop(1, "#c2b08d");
      ctx.fillStyle = ground;
      ctx.fillRect(0, h * 0.54, w, h * 0.46);
    }

    state.squadSlots.forEach((hid, idx) => {
      if (!hid) return;
      const hero = HERO_POOL.find(x => x.id === hid);
      if (!hero) return;
      const col = idx % 3;
      const row = Math.floor(idx / 3);
      const x = w * (0.12 + col * 0.085);
      const y = h * (0.54 + row * 0.14);
      const fileImg = getLoadedImage(getHeroImageSrc(hid));
      const portraitImg = fileImg || getLoadedImage(getBuiltInPortraitUrl(hero));

      if (portraitImg) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y - 12, 19, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(portraitImg, x - 19, y - 31, 38, 38);
        ctx.restore();
      } else {
        ctx.fillStyle = hero.color;
        ctx.beginPath();
        ctx.arc(x, y - 12, 17, 0, Math.PI * 2);
        ctx.fill();
      }

      const cdRatio = Math.min(1, (state.skillTimers[hid] || 0) / Math.max(0.1, hero.cd));
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(x - 16, y + 8, 32, 3);
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(x - 16, y + 8, 32 * cdRatio, 3);

      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.font = "bold 10px sans-serif";
      ctx.textAlign = "center";
      const shortName = hero.name.length > 5 ? hero.name.slice(0, 5) : hero.name;
      ctx.fillText(`${idx + 1}.${shortName}`, x, y + 20);
    });

    for (const en of state.enemies) {
      const x = w * en.xRatio;
      const y = h * en.yRatio;
      const r = en.isBoss ? 32 : 20;

      ctx.fillStyle = en.hitFlash > 0 ? "#fde047" : (en.isBoss ? "#991b1b" : "#4b5563");
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fff";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(en.name, x, y + r + 14);
    }

    for (const p of state.projectiles) {
      const cx = w * (p.x + (p.tx - p.x) * p.t);
      const cy = h * (p.y + (p.ty - p.y) * p.t);
      ctx.fillStyle = p.color || "#fbbf24";
      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const ef of state.effects) {
      ctx.strokeStyle = ef.color || "#f59e0b";
      ctx.globalAlpha = Math.max(0, ef.alpha);
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(w * ef.xRatio, h * ef.yRatio, ef.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    for (const sp of state.sparks) {
      ctx.globalAlpha = Math.max(0, sp.alpha);
      ctx.fillStyle = sp.color;
      ctx.beginPath();
      ctx.arc(w * sp.xRatio, h * sp.yRatio, sp.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    for (const lb of state.lightningBolts) {
      const lx = w * lb.xRatio;
      const ly = h * lb.yRatio;
      ctx.save();
      ctx.globalAlpha = Math.max(0, lb.alpha);
      ctx.strokeStyle = lb.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(lx - 18, ly - 58);
      ctx.lineTo(lx + 6, ly - 32);
      ctx.lineTo(lx - 10, ly - 16);
      ctx.lineTo(lx + 12, ly + 8);
      ctx.stroke();
      ctx.restore();
    }

    for (const sb of state.skillBanners) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, sb.alpha);
      ctx.fillStyle = "rgba(25, 20, 15, 0.82)";
      ctx.fillRect(w * 0.5 - 88, h * sb.yRatio - 11, 176, 20);
      ctx.fillStyle = sb.color || "#fde047";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(sb.text, w * 0.5, h * sb.yRatio + 3);
      ctx.restore();
    }

    for (const ct of state.chainTexts) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ct.alpha);
      ctx.fillStyle = "#fef08a";
      ctx.strokeStyle = "rgba(0,0,0,0.65)";
      ctx.lineWidth = 3;
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      const tx = w * ct.xRatio;
      const ty = h * ct.yRatio;
      ctx.strokeText(ct.text, tx, ty);
      ctx.fillText(ct.text, tx, ty);
      ctx.restore();
    }

    for (const fd of state.floatingDamages) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, fd.alpha);
      ctx.fillStyle = fd.color || "#ffffff";
      ctx.strokeStyle = fd.isCrit ? "rgba(127, 29, 29, 0.92)" : "rgba(0, 0, 0, 0.72)";
      ctx.lineWidth = fd.isCrit ? 4 : 2.5;
      ctx.font = fd.isCrit
        ? '900 15px Georgia, "Batang", serif'
        : '600 11px "Trebuchet MS", "Malgun Gothic", sans-serif';
      ctx.textAlign = "center";
      const fx = w * fd.xRatio;
      const fy = h * fd.yRatio;
      ctx.strokeText(fd.text, fx, fy);
      ctx.fillText(fd.text, fx, fy);
      ctx.restore();
    }

    ctx.restore();
  }

  function loop(now) {
    const dt = Math.min(0.1, Math.max(0.001, (now - state.lastTime) / 1000));
    state.lastTime = now;
    stepBattle(dt);
    drawBattle();
    requestAnimationFrame(loop);
  }

    });

    document.getElementById("file-hero-input").addEventListener("change", e => {
      const file = e.target.files && e.target.files[0];
      const targetId = state.pendingHeroImageId;
      state.pendingHeroImageId = null;
      if (!file || !targetId) return;
      const reader = new FileReader();
      reader.onload = ev => {
        if (ev.target && typeof ev.target.result === "string") {
          state.customImages[targetId] = ev.target.result;
          AUDIO.upgrade();
          renderTabContent();
          showToast("장수 일러스트가 변경되었습니다.");
        }
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    });
  }

  applyLayout();
  bindEvents();
  spawnWaveEnemies(false);
  refreshAllyTeamHp(true);
  updateHud();
  renderTabContent();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
