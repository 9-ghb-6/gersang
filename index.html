                                <canvas id="ev_after" width="92" height="92" style="border-radius:12px; border:2.5px solid #fde047; box-shadow:0 0 18px rgba(250,204,21,0.8);"></canvas>
                            </div>
                            <div style="font-size:13px; color:#cbd5e1; margin-bottom:8px;">[${before.name}] ➔ <strong style="color:#fde047; font-size:16px;">[${after.name}] (${after.stageLabel})</strong></div>
                            <div style="background:#120b06; border:1px solid #855e36; border-radius:10px; padding:10px; font-size:12px; line-height:1.6;">
                                <div style="color:#86efac; font-weight:800;">기본 능력치 배율 ${before.mult}x ➔ ${after.mult}x 대폭 상승!</div>
                                <div style="color:#f0abfc; font-weight:800;">고유 필살기 개방: [${after.skill}]</div>
                            </div>
                        </div>
                    `,
                    false
                );

                this.portraitEngine.paintTo(document.getElementById('ev_before'), before);
                this.portraitEngine.paintTo(document.getElementById('ev_after'), after);
            }

            toggleDeploy(uid) {
                const idx = this.state.partyUids.indexOf(uid);
                if (idx >= 0) {
                    if (this.state.partyUids.length <= 1) {
                        this.toast('최소 1명은 출전해야 합니다.');
                        return;
                    }
                    this.state.partyUids.splice(idx, 1);
                } else {
                    if (this.state.partyUids.length >= 3) {
                        this.state.partyUids.shift();
                    }
                    this.state.partyUids.push(uid);
                }
                sfx.click();
                this.saveSafe();
                this.spawnWave(false);
                this.renderAll();
            }

            summonGacha(times) {
                const costSeals = times;
                const costMoney = times === 1 ? 1000 : 9000;

                if (this.state.seals >= costSeals) {
                    this.state.seals -= costSeals;
                } else if (this.state.money >= costMoney) {
                    this.state.money -= costMoney;
                } else {
                    this.toast(`소환 재화 부족! (🎟️${costSeals}장 또는 ${costMoney.toLocaleString()}냥 필요)`);
                    return;
                }

                const pulled = [];
                let hasUR = false;

                for (let i = 0; i < times; i++) {
                    const r = Math.random() * 100;
                    let stageIdx = 0;
                    if (r < 10 || (times === 10 && i === 9 && Math.random() < 0.4)) {
                        stageIdx = 3;
                        hasUR = true;
                    } else if (r < 30) {
                        stageIdx = 2;
                    } else if (r < 62 || (times === 10 && i === 9)) {
                        stageIdx = 1;
                    }

                    const lin = LINEAGES[Math.floor(Math.random() * LINEAGES.length)];
                    const spec = getUnitSpec(lin.id, stageIdx);

                    const exist = this.state.roster.find(u => u.lineageId === lin.id);
                    let badge = 'NEW!';
                    if (exist) {
                        if (stageIdx > exist.stage) {
                            exist.stage = stageIdx;
                            badge = '승급!';
                        } else {
                            exist.stars = Math.min(10, exist.stars + 1);
                            this.state.soul += 30;
                            badge = `★${exist.stars}각성`;
                        }
                    } else {
                        this.state.roster.push({
                            uid: 'h' + (this.state.nextUid++),
                            lineageId: lin.id,
                            stage: stageIdx,
                            level: stageIdx === 0 ? 1 : STAGES[stageIdx].reqLv,
                            stars: 1
                        });
                    }
                    pulled.push({ spec, badge });
                }

                sfx.gacha(hasUR);
                this.saveSafe();
                this.renderAll();

                const cardsHtml = `
                    <div class="gacha-result-grid">
                        ${pulled.map((p, idx) => `
                            <div class="gacha-card bg-${p.spec.rarity}">
                                <span style="font-size:9px; font-weight:900; background:rgba(0,0,0,0.7); padding:1px 4px; border-radius:4px;">${p.spec.rarity}·${p.spec.stageLabel}</span>
                                <canvas id="gc_${idx}" width="64" height="64" style="margin:4px 0; border-radius:7px; border:1.5px solid #fde047;"></canvas>
                                <div style="font-weight:900; font-size:10px; color:#fff;">${p.spec.name.split(' ')[0]}</div>
                                <div style="font-size:9px; color:#fde047; font-weight:800;">${p.badge}</div>
                            </div>
                        `).join('')}
                    </div>
                `;

                this.openModal('🔮 태극 팔괘진 영웅 등용 결과', cardsHtml, true);
                pulled.forEach((p, idx) => {
                    this.portraitEngine.paintTo(document.getElementById(`gc_${idx}`), p.spec);
                });
            }

            forgeGear(uid) {
                const g = this.state.gear.find(x => x.uid === uid);
                if (!g) return;
                if (g.enhance >= 15) {
                    this.toast('이미 최대 제련 단계(+15)입니다!');
                    return;
                }
                const costMoney = 300 + g.enhance * 200;
                const costForge = 5 + g.enhance * 3;
                if (this.state.money < costMoney || this.state.forge < costForge) {
                    this.toast(`제련 재료 부족! (${costMoney.toLocaleString()}냥 + 🔨${costForge} 필요)`);
                    return;
                }
                this.state.money -= costMoney;
                this.state.forge -= costForge;

                const rate = g.enhance < 8 ? 90 : 65;
                if (Math.random() * 100 < rate) {
                    g.enhance += 1;
                    sfx.anvil(true);
                    this.toast(`🔨 대성공! [+${g.enhance}] 제련 완료!`);
                } else {
                    sfx.anvil(false);
                    this.toast('💨 제련 실패 (장비는 안전하게 보존되었습니다)');
                }
                this.saveSafe();
                this.renderAll();
            }

            equipGear(gearUid) {
                const g = this.state.gear.find(x => x.uid === gearUid);
                if (!g) return;
                if (g.owner === this.selectedHeroUid) {
                    g.owner = null;
                    this.toast('장비 장착을 해제했습니다.');
                } else {
                    const tpl = GEAR_TEMPLATES.find(t => t.id === g.tplId);
                    this.state.gear.forEach(other => {
                        const ot = GEAR_TEMPLATES.find(t => t.id === other.tplId);
                        if (other.owner === this.selectedHeroUid && ot && ot.slot === tpl.slot) {
                            other.owner = null;
                        }
                    });
                    g.owner = this.selectedHeroUid;
                    this.toast('장수에게 장비를 장착했습니다!');
                }
                sfx.click();
                this.saveSafe();
                this.renderAll();
            }

            buyCargo(cityItemId) {
                const price = this.state.prices[this.state.cityId][cityItemId];
                if (this.state.money < price) {
                    this.toast('은전이 부족합니다!');
                    return;
                }
                this.state.money -= price;
                this.state.cargo[cityItemId] = (this.state.cargo[cityItemId] || 0) + 1;
                sfx.coin();
                this.saveSafe();
                this.renderAll();
            }

            sellCargo(cityItemId) {
                const qty = this.state.cargo[cityItemId] || 0;
                if (qty <= 0) return;
                const price = this.state.prices[this.state.cityId][cityItemId];
                this.state.money += price * qty;
                this.state.cargo[cityItemId] = 0;
                sfx.coin();
                this.toast(`💰 특산품 전량 매도! (+${(price * qty).toLocaleString()}냥)`);
                this.saveSafe();
                this.renderAll();
            }

            travelCity(targetCityId) {
                if (targetCityId === this.state.cityId) return;
                this.state.cityId = targetCityId;
                this.refreshPrices();
                const c = this.getCity();
                sfx.click();
                this.toast(`✈️ ${c.reg} · ${c.name} 도착! 시세가 갱신되었습니다.`);
                if (this.scene === 'battle') this.spawnWave(false);
                this.saveSafe();
                this.renderAll();
            }

            openModal(title, bodyHtml, showExtra = false) {
                const modal = document.getElementById('resultModal');
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalBody').innerHTML = bodyHtml;
                document.getElementById('modalExtraBtn').style.display = showExtra ? 'block' : 'none';
                modal.classList.add('open');
            }

            closeModal() {
                document.getElementById('resultModal').classList.remove('open');
            }

            loop(now) {
                const rawDt = Math.min(0.05, (now - this.lastTs) / 1000);
                this.lastTs = now;
                const dt = rawDt * this.speed;
                this.tick += dt * 60;

                this.update(dt);
                this.drawCanvas();
                requestAnimationFrame((t) => this.loop(t));
            }

            update(dt) {
                if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 36);
                if (this.cutin) {
                    this.cutin.life -= dt;
                    if (this.cutin.life <= 0) this.cutin = null;
                }

                for (let i = this.activeSkillFX.length - 1; i >= 0; i--) {
                    this.activeSkillFX[i].life -= dt;
                    if (this.activeSkillFX[i].life <= 0) this.activeSkillFX.splice(i, 1);
                }

                this.wagonX += dt * 32;
                if (this.wagonX > 1000) this.wagonX = -80;

                this.mp = Math.min(100, this.mp + dt * 13);
                const mpBar = document.getElementById('hudMpBar');
                const mpVal = document.getElementById('hudMpVal');
                if (mpBar) mpBar.style.width = `${Math.round(this.mp)}%`;
                if (mpVal) mpVal.textContent = Math.floor(this.mp);

                [1, 2, 3, 4].forEach(n => {
                    const sk = this.skills[n];
                    const el = document.getElementById(`cd${n}`);
                    if (!el) return;
                    if (sk.cd > 0) {
                        sk.cd = Math.max(0, sk.cd - dt);
                        el.style.display = 'flex';
                        el.textContent = sk.cd.toFixed(1) + 's';
                    } else {
                        el.style.display = 'none';
                    }
                });

                if (this.scene === 'battle') {
                    this.allies.forEach(a => {
                        if (a.hitFlash > 0) a.hitFlash -= dt * 25;
                        a.cd += dt;
                        if (a.cd >= 0.95 && this.enemies.length > 0) {
                            a.cd = 0;
                            if (a.healer) {
                                const hurt = this.allies.find(x => x.hp < x.maxHp);
                                if (hurt) {
                                    const heal = Math.round(a.atk * 0.8);
                                    hurt.hp = Math.min(hurt.maxHp, hurt.hp + heal);
                                    this.addParticle(hurt.x, hurt.y - 20, '#4ade80', `+${heal}`);
                                    return;
                                }
                            }
                            const target = this.enemies[0];
                            const isCrit = Math.random() < 0.25;
                            const dmg = Math.round(a.atk * (isCrit ? 1.6 : 1.0));
                            target.hp -= dmg;
                            target.hitFlash = 6;
                            this.addParticle(target.x, target.y - 18, isCrit ? '#fde047' : '#ffffff', `${isCrit ? '치명타! ' : ''}-${dmg}`);
                        }
                    });

                    this.enemies.forEach(e => {
                        if (e.hitFlash > 0) e.hitFlash -= dt * 25;
                        e.cd += dt;
                        if (e.cd >= 1.15 && this.allies.length > 0) {
                            e.cd = 0;
                            const target = this.allies[Math.floor(Math.random() * this.allies.length)];
                            const dmg = Math.max(8, Math.round(e.atk - target.def * 0.3));
                            target.hp = Math.max(1, target.hp - dmg);
                            target.hitFlash = 5;
                        }
                    });

                    const aliveEnemies = this.enemies.filter(e => e.hp > 0);
                    if (aliveEnemies.length < this.enemies.length) {
                        const killed = this.enemies.length - aliveEnemies.length;
                        const city = this.getCity();
                        const diff = DIFFICULTIES[this.state.difficulty] || DIFFICULTIES.normal;
                        this.state.money += Math.round(city.reward * 0.45 * diff.reward * killed);
                        this.state.soul += 6 * killed;
                        this.state.forge += 4 * killed;
                        if (Math.random() < 0.35) this.state.scrolls += 1;
                        this.enemies = aliveEnemies;
                        this.updateTopResourceBar();
                    }

                    if (this.enemies.length === 0) {
                        this.spawnWave(false);
                    }

                    if (this.autoHunt && this.mp >= 60 && this.skills[4].cd <= 0) {
                        this.castSkill(4);
                    }
                }

                if (this.autoTrade && Math.floor(this.tick) % 120 === 0) {
                    const curCity = this.getCity();
                    if ((this.state.cargo[curCity.id] || 0) < 3) {
                        this.buyCargo(curCity.id);
                    } else {
                        const next = CITIES[(CITIES.findIndex(c => c.id === curCity.id) + 1) % CITIES.length];
                        this.travelCity(next.id);
                        Object.keys(this.state.cargo).forEach(k => {
                            if (k !== next.id && this.state.cargo[k] > 0) this.sellCargo(k);
                        });
                    }
                }

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx * dt * 28;
                    p.y += p.vy * dt * 28;
                    p.life -= dt * 36;
                    if (p.life <= 0) this.particles.splice(i, 1);
                }
            }

            drawCanvas() {
                const canvas = document.getElementById('gameCanvas');
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                if (canvas.width !== Math.floor(rect.width) || canvas.height !== Math.floor(rect.height)) {
                    canvas.width = Math.floor(rect.width);
                    canvas.height = Math.floor(rect.height);
                }
                const ctx = canvas.getContext('2d');
                const w = canvas.width;
                const h = canvas.height;

                ctx.save();
                if (this.shake > 0) {
                    ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
                }

                if (this.scene === 'battle') {
                    this.drawBattlefield(ctx, w, h);
                } else {
                    this.drawTown(ctx, w, h);
                }

                // 초호화 필살기 쉐이더 이펙트 레이어
                this.activeSkillFX.forEach(fx => {
                    this.vfxRenderer.drawSkillFX(ctx, fx, w, h, this.tick);
                });

                // 파티클 & 데미지 폰트
                this.particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.life / 42);
                    if (p.text) {
                        ctx.font = '900 13px sans-serif';
                        ctx.strokeStyle = '#140c06';
                        ctx.lineWidth = 3.2;
                        ctx.textAlign = 'center';
                        ctx.strokeText(p.text, p.x, p.y);
                        ctx.fillStyle = p.color;
                        ctx.fillText(p.text, p.x, p.y);
                    } else {
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                });

                // 고해상도 초상화 필살기 컷인 배너
                if (this.cutin) {
                    const c = this.cutin;
                    const by = h * 0.34;
                    ctx.save();
                    ctx.globalAlpha = Math.min(1, c.life * 2.5);
                    const grad = ctx.createLinearGradient(0, by, w, by);
                    grad.addColorStop(0, 'rgba(18, 10, 5, 0.96)');
                    grad.addColorStop(0.55, 'rgba(153, 27, 27, 0.94)');
                    grad.addColorStop(1, 'rgba(234, 88, 12, 0.08)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, by, w, 58);

                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.moveTo(0, by); ctx.lineTo(w * 0.85, by);
                    ctx.moveTo(0, by + 58); ctx.lineTo(w * 0.85, by + 58);
                    ctx.stroke();

                    const pCan = this.portraitEngine.getPortraitCanvas(c.spec);
                    ctx.drawImage(pCan, 8, by + 3, 52, 52);
                    ctx.strokeRect(8, by + 3, 52, 52);

                    ctx.font = '900 15px Georgia, serif';
                    ctx.strokeStyle = '#140c06';
                    ctx.lineWidth = 3.2;
                    ctx.textAlign = 'left';
                    ctx.strokeText(c.title, 68, by + 34);
                    ctx.fillStyle = '#fef9c3';
                    ctx.fillText(c.title, 68, by + 34);
                    ctx.restore();
                }

                ctx.restore();
            }

            drawBattlefield(ctx, w, h) {
                const sky = ctx.createLinearGradient(0, 0, 0, h * 0.38);
                sky.addColorStop(0, '#cbd5e1');
                sky.addColorStop(1, '#e2e8f0');
                ctx.fillStyle = sky;
                ctx.fillRect(0, 0, w, h * 0.38);

                ctx.fillStyle = '#64748b';
                ctx.beginPath();
                ctx.moveTo(0, h * 0.36);
                ctx.lineTo(w * 0.22, h * 0.10);
                ctx.lineTo(w * 0.45, h * 0.25);
                ctx.lineTo(w * 0.72, h * 0.08);
                ctx.lineTo(w, h * 0.22);
                ctx.lineTo(w, h * 0.38);
                ctx.fill();

                const gnd = ctx.createLinearGradient(0, h * 0.34, 0, h);
                gnd.addColorStop(0, '#6d7c47');
                gnd.addColorStop(0.5, '#8c7a53');
                gnd.addColorStop(1, '#5c6b3c');
                ctx.fillStyle = gnd;
                ctx.fillRect(0, h * 0.34, w, h * 0.66);

                // 적진 망루 & 횃불
                const tx = w - 130;
                if (tx > 155) {
                    ctx.fillStyle = '#5c3a21';
                    ctx.fillRect(tx + 10, 44, 6, 40);
                    ctx.fillRect(tx + 40, 44, 6, 40);
                    ctx.fillStyle = '#292524';
                    ctx.beginPath();
                    ctx.moveTo(tx, 44); ctx.lineTo(tx + 28, 26); ctx.lineTo(tx + 56, 44);
                    ctx.fill();

                    ctx.fillStyle = '#f97316';
                    ctx.beginPath();
                    ctx.arc(tx - 6, 68, 5 + Math.sin(this.tick * 0.25) * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                const units = [...this.allies, ...this.enemies].sort((a, b) => a.y - b.y);
                units.forEach(u => {
                    if (u.x > w - 45) u.x = w - 55;
                    const facing = u.side === 'ally' ? 1 : -1;
                    const sc = u.isBoss ? 1.45 : (u.kind === 'tiger' ? 1.2 : 1.08);
                    this.vfxRenderer.drawActor(ctx, u, u.x, u.y, sc, this.tick, facing);

                    const topY = u.y - (u.isBoss ? 56 : 45);
                    const bw = u.isBoss ? 48 : 34;
                    const pct = Math.max(0, u.hp / u.maxHp);
                    if (u.side === 'enemy') {
                        ctx.font = 'bold 9px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillStyle = '#fef9c3';
                        ctx.fillText(u.name, u.x, topY - 4);
                    }
                    ctx.fillStyle = '#140c06';
                    ctx.fillRect(u.x - bw / 2 - 1, topY - 1, bw + 2, 6);
                    ctx.fillStyle = u.side === 'ally' ? '#4ade80' : '#ef4444';
                    ctx.fillRect(u.x - bw / 2, topY, bw * pct, 4);
                });
            }

            drawTown(ctx, w, h) {
                ctx.fillStyle = '#c7aa79';
                ctx.fillRect(0, 0, w, h);

                ctx.fillStyle = '#b5925c';
                ctx.beginPath();
                ctx.moveTo(0, h * 0.72); ctx.lineTo(w * 0.85, 0); ctx.lineTo(w, 0);
                ctx.lineTo(w, h * 0.35); ctx.lineTo(w * 0.25, h); ctx.lineTo(0, h);
                ctx.fill();

                const houses = [
                    { x: 35, y: 34, w: 115, h: 46, name: `${this.getCity().name} 시전` },
                    { x: 175, y: 20, w: 110, h: 42, name: '객주상단' }
                ];
                houses.forEach(hs => {
                    ctx.fillStyle = '#f5ebd6';
                    ctx.strokeStyle = '#140c06';
                    ctx.lineWidth = 1.5;
                    ctx.fillRect(hs.x + 6, hs.y + 14, hs.w - 12, hs.h - 14);
                    ctx.strokeRect(hs.x + 6, hs.y + 14, hs.w - 12, hs.h - 14);

                    ctx.fillStyle = '#293241';
                    ctx.beginPath();
                    ctx.moveTo(hs.x - 8, hs.y + 16);
                    ctx.lineTo(hs.x + hs.w * 0.25, hs.y - 4);
                    ctx.lineTo(hs.x + hs.w * 0.75, hs.y - 4);
                    ctx.lineTo(hs.x + hs.w + 8, hs.y + 16);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#fde047';
                    ctx.font = 'bold 9px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(hs.name, hs.x + hs.w * 0.5, hs.y + 28);
                });

                const wx = (this.wagonX % (w + 120)) - 60;
                const wy = h * 0.58;
                ctx.fillStyle = '#92400e';
                ctx.fillRect(wx + 42, wy + 6, 18, 10);
                ctx.fillStyle = '#f5ebd6';
                ctx.beginPath();
                ctx.arc(wx + 20, wy + 8, 14, Math.PI, 0);
                ctx.fill();
                ctx.fillStyle = '#291d12';
                ctx.beginPath();
                ctx.arc(wx + 12, wy + 18, 6, 0, Math.PI * 2);
                ctx.arc(wx + 28, wy + 18, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#f9a8d4';
                ctx.beginPath(); ctx.arc(28, h * 0.65, 18, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#dc2626';
                ctx.beginPath(); ctx.arc(w - 36, h * 0.72, 20, 0, Math.PI * 2); ctx.fill();

                this.allies.forEach((a, i) => {
                    this.vfxRenderer.drawActor(ctx, a, 105 + i * 52, h * 0.78, 1.05, this.tick, 1);
                });
            }

            updateTopResourceBar() {
                document.getElementById('uiCity').textContent = this.getCity().name;
                document.getElementById('uiPower').textContent = this.getTotalPower().toLocaleString();
                document.getElementById('uiMoney').textContent = this.state.money.toLocaleString();
                document.getElementById('uiScrolls').textContent = this.state.scrolls;
                document.getElementById('uiSoul').textContent = this.state.soul;
                document.getElementById('uiForge').textContent = this.state.forge;
                document.getElementById('uiSeals').textContent = this.state.seals;
            }

            renderAll() {
                this.updateTopResourceBar();

                ['squad', 'gacha', 'gear', 'trade', 'codex'].forEach(t => {
                    const btn = document.getElementById(`tab-${t}`);
                    if (btn) btn.className = t === this.activeTab ? 'tab-btn active' : 'tab-btn';
                });

                const panel = document.getElementById('hanjiPanel');
                if (!panel) return;

                if (this.activeTab === 'squad') this.renderSquadTab(panel);
                else if (this.activeTab === 'gacha') this.renderGachaTab(panel);
                else if (this.activeTab === 'gear') this.renderGearTab(panel);
                else if (this.activeTab === 'trade') this.renderTradeTab(panel);
                else this.renderCodexTab(panel);
            }

            renderSquadTab(panel) {
                if (!this.state.roster.some(h => h.uid === this.selectedHeroUid)) {
                    this.selectedHeroUid = this.state.roster[0].uid;
                }
                const sel = this.state.roster.find(h => h.uid === this.selectedHeroUid);
                const st = this.getHeroStats(sel);
                const nextStage = sel.stage < 3 ? STAGES[sel.stage + 1] : null;
                const nextSpec = sel.stage < 3 ? getUnitSpec(sel.lineageId, sel.stage + 1) : null;

                panel.innerHTML = `
                    <!-- 출전 부대 3인 고해상도 초상화 카드 (초상화 터치 시 필살기 발동 가능) -->
                    <div class="squad-strip">
                        ${this.state.partyUids.map((uid, idx) => {
                            const h = this.state.roster.find(x => x.uid === uid);
                            if (!h) return '';
                            const hs = this.getHeroStats(h);
                            return `
                                <div data-action="select-hero" data-val="${h.uid}" class="hero-card ${h.uid === sel.uid ? 'selected' : ''}">
                                    <div class="portrait-box">
                                        <canvas id="sq_can_${idx}" width="110" height="84" style="width:100%; height:100%; display:block;"></canvas>
                                        <span class="stage-pill">${hs.stageLabel}</span>
                                        <button type="button" data-action="hero-ult" data-val="${h.uid}" class="ult-pill">⚡필살기</button>
                                    </div>
                                    <div style="font-size:10px; color:#fde047; font-weight:800; margin-top:3px;">Lv.${h.level}</div>
                                    <div class="serif" style="font-size:12px; font-weight:900;">${hs.name.split(' ')[0]}</div>
                                    <div class="bar-track"><div class="bar-hp" style="width:100%"></div></div>
                                    <div class="bar-track"><div class="bar-mp" style="width:100%"></div></div>
                                    <div style="font-size:10px; color:#fde047; margin-top:2px;">${'★'.repeat(Math.min(5, h.stars))}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- 선택 영웅 4단계 전직 트리 & 초상화 진화 로드맵 -->
                    <div class="hanji-box">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                            <div>
                                <span style="background:#26160b; color:#fde047; font-size:10px; font-weight:900; padding:2px 6px; border-radius:4px;">${st.rarity} · ${st.stageLabel} ★${sel.stars}</span>
                                <strong class="serif" style="font-size:14px; margin-left:4px;">${st.name}</strong>
                            </div>
                            <span style="font-size:11px; font-weight:900; color:#991b1b;">전투력 ${st.power.toLocaleString()}</span>
                        </div>

                        <div class="evo-grid">
                            ${[0, 1, 2, 3].map(i => {
                                const sp = getUnitSpec(sel.lineageId, i);
                                return `
                                    <div class="evo-node ${sel.stage === i ? 'current' : ''}">
                                        <canvas id="evo_tree_${i}" width="54" height="54" style="border-radius:6px; border:1px solid #78522d; margin-bottom:2px;"></canvas>
                                        <div style="font-size:8px;">${sp.stageLabel}</div>
                                        <div style="font-weight:900;">${sp.name.split(' ')[0]}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px;">
                            <button type="button" data-action="levelup-hero" data-val="1" class="float-action-btn btn-hanji">🔥 +1 단련 (300냥)</button>
                            <button type="button" data-action="levelup-hero" data-val="10" class="float-action-btn btn-hanji">🔥 +10 폭풍단련</button>
                        </div>

                        ${nextStage ? `
                            <div style="margin-top:8px; background:#26150b; border:1.5px solid #fde047; border-radius:8px; padding:7px; color:#f6ecd7; display:flex; justify-content:space-between; align-items:center; gap:6px;">
                                <div style="font-size:10px; line-height:1.4;">
                                    <div style="color:#fde047; font-weight:900;">다음 전직: ${nextSpec.name} (${nextStage.mult}x)</div>
                                    <div>조건: Lv.${nextStage.reqLv} · 📜${nextStage.scrolls} · 🔮${nextStage.soul} · ${nextStage.gold.toLocaleString()}냥</div>
                                </div>
                                <button type="button" data-action="evolve-hero" class="float-action-btn btn-crimson" style="white-space:nowrap;">🔥 전직 승급</button>
                            </div>
                        ` : `
                            <div style="margin-top:8px; background:#450a0a; border:1px solid #fde047; border-radius:8px; padding:6px; text-align:center; color:#fde047; font-size:11px; font-weight:900;">
                                👑 최종 경지 [3차 각성] 달성 완료!
                            </div>
                        `}
                    </div>

                    <!-- 보유 장수 목록 -->
                    <div class="hanji-box">
                        <div style="font-size:11px; font-weight:900; margin-bottom:5px;">📋 보유 용병 · 장수 목록 (${this.state.roster.length}명)</div>
                        <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:5px;">
                            ${this.state.roster.map((h, rIdx) => {
                                const hs = this.getHeroStats(h);
                                const deployed = this.state.partyUids.includes(h.uid);
                                return `
                                    <div data-action="select-hero" data-val="${h.uid}" style="background:${h.uid === sel.uid ? '#362010' : '#f7eedb'}; color:${h.uid === sel.uid ? '#fde047' : '#22140a'}; border:1.5px solid #7c5832; border-radius:7px; padding:4px 6px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; gap:5px;">
                                        <div style="display:flex; align-items:center; gap:5px;">
                                            <canvas id="ros_can_${rIdx}" width="36" height="36" style="border-radius:5px; border:1px solid #78522d; flex-shrink:0;"></canvas>
                                            <div>
                                                <div style="font-size:8.5px; opacity:0.85;">${hs.stageLabel} · Lv.${h.level}</div>
                                                <div style="font-size:11px; font-weight:900;">${hs.name.split(' ')[0]}</div>
                                            </div>
                                        </div>
                                        <button type="button" data-action="toggle-deploy" data-val="${h.uid}" class="mini-btn" style="background:${deployed ? '#15803d' : '#6e4b2a'}; color:#fff; padding:3px 6px;">
                                            ${deployed ? '✓출전' : '출전'}
                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;

                this.state.partyUids.forEach((uid, idx) => {
                    const h = this.state.roster.find(x => x.uid === uid);
                    if (h) this.portraitEngine.paintTo(document.getElementById(`sq_can_${idx}`), getUnitSpec(h.lineageId, h.stage));
                });

                [0, 1, 2, 3].forEach(i => {
                    this.portraitEngine.paintTo(document.getElementById(`evo_tree_${i}`), getUnitSpec(sel.lineageId, i));
                });

                this.state.roster.forEach((h, rIdx) => {
                    this.portraitEngine.paintTo(document.getElementById(`ros_can_${rIdx}`), getUnitSpec(h.lineageId, h.stage));
                });
            }

            renderGachaTab(panel) {
                panel.innerHTML = `
                    <div class="hanji-box" style="background:linear-gradient(135deg, #2e140e 0%, #6b1d18 50%, #2e140e 100%); color:#f6ecd7; border:2px solid #fde047;">
                        <div style="text-align:center; padding:6px 0;">
                            <div style="font-size:28px;">☯️</div>
                            <h3 class="serif" style="font-size:16px; font-weight:900; color:#fde047; margin:4px 0;">태극 팔괘진 전설 영웅 · 신수 소환</h3>
                            <p style="font-size:11px; color:#eadec4;">이순신·허준·지국천왕·광개토태왕·사방신수 등 16계보 64종 즉시 등용!</p>
                        </div>

                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;">
                            <button type="button" data-action="summon-gacha" data-val="1" class="float-action-btn btn-hanji" style="padding:10px 6px;">
                                <div style="font-size:13px;">✨ 1회 등용</div>
                                <div style="font-size:10px; color:#78350f; margin-top:2px;">🎟️1장 또는 1,000냥</div>
                            </button>
                            <button type="button" data-action="summon-gacha" data-val="10" class="float-action-btn btn-gold" style="padding:10px 6px;">
                                <div style="font-size:13px;">🌟 10연속 등용</div>
                                <div style="font-size:10px; color:#fef08a; margin-top:2px;">🎟️10장 또는 9,000냥</div>
                            </button>
                        </div>
                    </div>

                    <div class="hanji-box">
                        <div style="font-size:12px; font-weight:900; margin-bottom:4px;">📜 상단 보급소 (은전 ➔ 소환패/전직서 교환)</div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
                            <button type="button" data-action="exchange-item" data-val="seals" class="float-action-btn btn-wood">4,500냥 ➔ 🎟️소환패 5장</button>
                            <button type="button" data-action="exchange-item" data-val="scrolls" class="float-action-btn btn-wood">3,000냥 ➔ 📜전직서 3장</button>
                        </div>
                    </div>
                `;
            }

            renderGearTab(panel) {
                if (!this.state.gear.some(g => g.uid === this.selectedGearUid)) {
                    this.selectedGearUid = this.state.gear[0].uid;
                }
                const g = this.state.gear.find(x => x.uid === this.selectedGearUid);
                const tpl = GEAR_TEMPLATES.find(t => t.id === g.tplId);
                const selHero = this.state.roster.find(h => h.uid === this.selectedHeroUid) || this.state.roster[0];
                const heroName = getUnitSpec(selHero.lineageId, selHero.stage).name.split(' ')[0];
                const costMoney = 300 + g.enhance * 200;

                panel.innerHTML = `
                    <div class="hanji-box">
                        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <div class="gear-slot bg-${tpl.rarity}" style="width:54px; height:54px; flex-shrink:0;">
                                    <span style="position:absolute; top:2px; right:4px; font-size:10px; font-weight:900; color:#fde047;">+${g.enhance}</span>
                                    <span style="font-size:24px;">${tpl.icon}</span>
                                </div>
                                <div>
                                    <div class="serif" style="font-size:14px; font-weight:900;">+${g.enhance} ${tpl.name}</div>
                                    <div style="font-size:11px; color:#5c3e21; font-weight:800;">공격 +${Math.round(tpl.atk*(1+g.enhance*0.18))} · 체력 +${Math.round(tpl.hp*(1+g.enhance*0.18))}</div>
                                </div>
                            </div>
                            <div style="display:flex; flex-direction:column; gap:4px;">
                                <button type="button" data-action="forge-gear" data-val="${g.uid}" class="float-action-btn btn-gold">🔨 제련 (${costMoney}냥)</button>
                                <button type="button" data-action="equip-gear" data-val="${g.uid}" class="float-action-btn btn-hanji">${g.owner === selHero.uid ? `[${heroName}] 해제` : `[${heroName}] 장착`}</button>
                            </div>
                        </div>
                    </div>

                    <div class="gear-grid">
                        ${this.state.gear.map(item => {
                            const it = GEAR_TEMPLATES.find(t => t.id === item.tplId);
                            const eqHero = item.owner ? this.state.roster.find(h => h.uid === item.owner) : null;
                            const eqTag = eqHero ? getUnitSpec(eqHero.lineageId, eqHero.stage).name.split(' ')[0] : '';
                            return `
                                <div data-action="select-gear" data-val="${item.uid}" class="gear-slot bg-${it.rarity} ${item.uid === g.uid ? 'selected' : ''}">
                                    <span style="position:absolute; top:2px; right:4px; font-size:10px; font-weight:900; color:#fde047;">+${item.enhance}</span>
                                    ${eqTag ? `<span style="position:absolute; top:2px; left:3px; background:#16a34a; font-size:8px; font-weight:900; padding:0 3px; border-radius:3px;">${eqTag}</span>` : ''}
                                    <span style="font-size:22px;">${it.icon}</span>
                                    <span style="font-size:9px; font-weight:800; text-align:center; margin-top:2px;">${it.name}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            renderTradeTab(panel) {
                const curCity = this.getCity();
                const curPrices = this.state.prices[curCity.id] || {};

                panel.innerHTML = `
                    <div class="hanji-box" style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:12px; font-weight:900;">🤖 자동사냥 & 자동교역 AI</span>
                        <div style="display:flex; gap:5px;">
                            <button type="button" data-action="toggle-hunt" class="mini-btn ${this.autoHunt ? 'active-gold' : ''}">⚔️자동사냥 ${this.autoHunt ? 'ON' : 'OFF'}</button>
                            <button type="button" data-action="toggle-trade" class="mini-btn ${this.autoTrade ? 'active-gold' : ''}">🐫자동교역 ${this.autoTrade ? 'ON' : 'OFF'}</button>
                        </div>
                    </div>

                    <div class="hanji-box">
                        <div style="font-size:11px; font-weight:900; margin-bottom:5px;">⚖️ ${curCity.name} 시전 특산품 매매</div>
                        <div style="display:flex; flex-direction:column; gap:4px; max-height:110px; overflow-y:auto;">
                            ${CITIES.slice(0, 8).map(ic => {
                                const p = curPrices[ic.id] || ic.base;
                                const owned = this.state.cargo[ic.id] || 0;
                                return `
                                    <div style="display:flex; justify-content:space-between; align-items:center; background:#fbf4e4; border:1px solid #b89f78; border-radius:6px; padding:4px 6px; font-size:11px;">
                                        <span><strong>${ic.icon}${ic.spec}</strong> · ${p}냥 ${owned > 0 ? `<strong style="color:#1d4ed8;">[보유 ${owned}]</strong>` : ''}</span>
                                        <div style="display:flex; gap:4px;">
                                            <button type="button" data-action="buy-cargo" data-val="${ic.id}" class="mini-btn" style="background:#1d4ed8; color:#fff;">매수</button>
                                            <button type="button" data-action="sell-cargo" data-val="${ic.id}" class="mini-btn" style="background:#b45309; color:#fff;">매도</button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="hanji-box">
                        <div style="font-size:11px; font-weight:900; margin-bottom:5px;">🌏 동아시아 24개 거점 도시 이동</div>
                        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:4px;">
                            ${CITIES.map(c => `
                                <button type="button" data-action="travel-city" data-val="${c.id}" class="mini-btn ${c.id === curCity.id ? 'active-gold' : ''}" style="text-align:left;">
                                    <div style="font-size:8px; opacity:0.8;">${c.reg}</div>
                                    <div style="font-size:11px; font-weight:900;">${c.name}</div>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            renderCodexTab(panel) {
                panel.innerHTML = `
                    <div class="hanji-box">
                        <div style="font-size:12px; font-weight:900; margin-bottom:6px;">📖 16대 전직 계보도감 (총 64종 정밀 일러스트 초상화)</div>
                        <div style="display:flex; flex-direction:column; gap:6px; max-height:185px; overflow-y:auto;">
                            ${LINEAGES.map((lin, idx) => `
                                <div style="background:#fbf4e4; border:1px solid #9e825c; border-radius:7px; padding:5px 7px; font-size:10px; display:flex; align-items:center; justify-content:space-between; gap:6px;">
                                    <div>
                                        <div style="font-weight:900; color:#78350f;">[${lin.nation}] ${lin.forms.map(f => f.name.split(' ')[0]).join(' ➔ ')}</div>
                                    </div>
                                    <canvas id="cdx_can_${idx}" width="40" height="40" style="border-radius:6px; border:1px solid #b45309; flex-shrink:0;"></canvas>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="hanji-box" style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:11px; font-weight:900;">💾 진행 데이터 자동 저장됨</span>
                        <button type="button" data-action="reset-save" class="float-action-btn btn-crimson">🗑️ 데이터 초기화</button>
                    </div>
                `;

                LINEAGES.forEach((lin, idx) => {
                    this.portraitEngine.paintTo(document.getElementById(`cdx_can_${idx}`), getUnitSpec(lin.id, 3));
                });
            }
        }

        /**
         * ============================================================================
         * 7. 전역 통합 터치/클릭 위임 핸들러
         * ============================================================================
         */
        const game = new GersangGame();

        let lastActionTime = 0;
        function handleGlobalInteraction(e) {
            sfx.unlock();

            const target = e.target.closest('[data-action]');
            if (!target) return;

            const now = Date.now();
            if (now - lastActionTime < 140) return;
            lastActionTime = now;

            const action = target.getAttribute('data-action');
            const val = target.getAttribute('data-val');

            if (action === 'close-modal-backdrop' && e.target.id !== 'resultModal') return;

            switch (action) {
                case 'toggle-sound':
                    sfx.toggle();
                    break;
                case 'set-layout': {
                    sfx.click();
                    const root = document.getElementById('appRoot');
                    const btnP = document.getElementById('btnPortrait');
                    const btnL = document.getElementById('btnLandscape');
                    if (val === 'landscape') {
                        root.classList.add('landscape-mode');
                        btnL.className = 'mini-btn active-gold';
                        btnP.className = 'mini-btn';
                    } else {
                        root.classList.remove('landscape-mode');
                        btnP.className = 'mini-btn active-gold';
                        btnL.className = 'mini-btn';
                    }
                    break;
                }
                case 'cycle-speed':
                    sfx.click();
                    game.speed = game.speed === 1 ? 2 : (game.speed === 2 ? 3 : 1);
                    document.getElementById('btnSpeed').textContent = `⚡${game.speed}x`;
                    game.toast(`게임 속도 ${game.speed}배속 적용`);
                    break;
                case 'skill-showcase':
                    game.playSkillShowcase();
                    break;
                case 'hero-ult': {
                    const h = game.state.roster.find(x => x.uid === val);
                    if (h) {
                        const sp = getUnitSpec(h.lineageId, h.stage);
                        game.castSkill(sp.ultType, true, sp);
                    }
                    break;
                }
                case 'toggle-scene': {
                    sfx.click();
                    game.scene = game.scene === 'battle' ? 'town' : 'battle';
                    const btn = document.getElementById('btnSceneSwitch');
                    const bar = document.getElementById('battleSkillBar');
                    const title = document.getElementById('hudSceneTitle');
                    if (game.scene === 'town') {
                        btn.textContent = '⚔️ 전장으로 출정';
                        bar.style.display = 'none';
                        title.textContent = `🏘️ 마을 (${game.getCity().name}) · 2.5D 저잣거리`;
                    } else {
                        btn.textContent = '🏘️ 마을로 이동';
                        bar.style.display = 'flex';
                        game.spawnWave(false);
                    }
                    break;
                }
                case 'spawn-boss':
                    sfx.skill(4);
                    game.scene = 'battle';
                    document.getElementById('btnSceneSwitch').textContent = '🏘️ 마을로 이동';
                    document.getElementById('battleSkillBar').style.display = 'flex';
                    game.spawnWave(true);
                    game.toast(`🐉 [${game.getCity().boss}] 출현!`);
                    break;
                case 'rest-inn':
                    sfx.coin();
                    game.allies.forEach(a => a.hp = a.maxHp);
                    game.mp = 100;
                    game.toast('🍚 주막 휴식 완료! 부대 체력과 도력이 100% 회복되었습니다.');
                    break;
                case 'cast-skill':
                    game.castSkill(Number(val));
                    break;
                case 'switch-tab':
                    sfx.click();
                    game.activeTab = val;
                    game.renderAll();
                    break;
                case 'select-hero':
                    sfx.click();
                    game.selectedHeroUid = val;
                    game.renderAll();
                    break;
                case 'levelup-hero':
                    game.levelUpHero(game.selectedHeroUid, Number(val));
                    break;
                case 'evolve-hero':
                    game.evolveHero(game.selectedHeroUid);
                    break;
                case 'toggle-deploy':
                    game.toggleDeploy(val);
                    break;
                case 'summon-gacha':
                    game.summonGacha(Number(val));
                    break;
                case 'gacha-again':
                    game.summonGacha(10);
                    break;
                case 'exchange-item':
                    if (game.state.money < (val === 'seals' ? 4500 : 3000)) {
                        game.toast('은전이 부족합니다!');
                    } else if (val === 'seals') {
                        game.state.money -= 4500;
                        game.state.seals += 5;
                        sfx.coin();
                        game.toast('🎟️ 소환패 5장을 교환했습니다!');
                    } else {
                        game.state.money -= 3000;
                        game.state.scrolls += 3;
                        sfx.coin();
                        game.toast('📜 전직서 3장을 교환했습니다!');
                    }
                    game.saveSafe();
                    game.renderAll();
                    break;
                case 'select-gear':
                    sfx.click();
                    game.selectedGearUid = val;
                    game.renderAll();
                    break;
                case 'forge-gear':
                    game.forgeGear(val);
                    break;
                case 'equip-gear':
                    game.equipGear(val);
                    break;
                case 'toggle-hunt':
                    sfx.click();
                    game.autoHunt = !game.autoHunt;
                    game.renderAll();
                    break;
                case 'toggle-trade':
                    sfx.click();
                    game.autoTrade = !game.autoTrade;
                    game.renderAll();
                    break;
                case 'buy-cargo':
                    game.buyCargo(val);
                    break;
                case 'sell-cargo':
                    game.sellCargo(val);
                    break;
                case 'travel-city':
                    game.travelCity(val);
                    break;
                case 'close-modal':
                case 'close-modal-backdrop':
                    sfx.click();
                    game.closeModal();
                    break;
                case 'reset-save':
                    try { window.localStorage.removeItem(game.STORAGE_KEY); } catch (err) {}
                    game.state = game.defaultState();
                    game.refreshPrices();
                    game.spawnWave(false);
                    game.renderAll();
                    game.toast('🗑️ 초기 상태로 복원되었습니다.');
                    break;
            }
        }

        document.addEventListener('pointerdown', handleGlobalInteraction, { passive: true });
        document.addEventListener('click', handleGlobalInteraction);

        document.getElementById('diffSelect').addEventListener('change', function () {
            sfx.click();
            game.state.difficulty = this.value;
            game.spawnWave(false);
            game.saveSafe();
            game.toast(`난이도 [${DIFFICULTIES[this.value].label}] 적용`);
        });
    </script>
</body>
</html>
